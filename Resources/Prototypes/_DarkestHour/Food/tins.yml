# Консервы «Осады» (план осады п. 27, решение автора 2026-11-20): общий набор, открываются ножом (DHCannedFood).
# Банки — ванильные SS14 (рыба и каша — перекраска, Tools/_DarkestHour/food/tins.py).

- type: entity
  parent: FoodTinBase
  id: DHFoodTinStew
  name: tinned stew
  description: A tin of field-ration stewed meat. Open it with a knife.
  components:
  - type: Item
    storedOffset: 0,-3
  - type: Sprite
    sprite: Objects/Consumable/Food/Tins/meat.rsi
  - type: Solution
    solution:
      maxVol: 50
      reagents:
      - ReagentId: Nutriment
        Quantity: 40
      - ReagentId: TableSalt
        Quantity: 5
  - type: FlavorProfile
    flavors:
    - meaty
    - salty
  - type: Edible
    trash:
    - DHFoodTinStewTrash
  - type: DHCannedFood
  - type: Tag
    tags:
    - Meat

- type: entity
  parent: FoodTinBaseTrash
  id: DHFoodTinStewTrash
  name: tinned stew
  components:
  - type: Item
    storedOffset: 0,-3
  - type: Sprite
    sprite: Objects/Consumable/Food/Tins/meat.rsi

