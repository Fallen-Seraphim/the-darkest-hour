# DarkestHour: трекер командира отряда, как у морпехов CM (решение автора 2026-11-12). Стрелка указывает на
# командира своего отряда; цвет — цвет отряда. Тяжесть: 0 — нет командира, 1 — рядом, 2–9 — направление.
# Иконки — RMC-14/CM-SS13 (squad_tracker.rsi).

- type: alertCategory
  id: DHSquadTracker

- type: alert
  id: DHSquadTrackerAlpha
  category: DHSquadTracker
