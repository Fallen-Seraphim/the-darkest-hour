# DarkestHour: разрывные прыжки (этап 3). Генератор + один накопитель на корабле — прыжок в другую звёздную систему.
# Накопители — одно устройство трёх типоразмеров: больше масса корабля, больше хронита на прыжок, сильнее вспышка,
# медленнее износ. Хронит — ячейками (DHChroniteCell).

- type: entity
  abstract: true
  parent: BaseMachinePowered
  id: DHRiftMachineBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 400
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
    delay: 10
  - type: Pullable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: DHRiftMachineBase
  id: DHRiftGenerator
  name: rift generator
  description: Tears a rift for jumps between star systems. Needs power and a rift accumulator charged with chronite on the same hull. Every jump throws off a chronite flash — lightning, radiation and chronite exposure for everyone aboard.
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/Shuttles/Rift/generator.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: PointLight
    radius: 2
    energy: 1.5
    color: "#9b4dff"
  - type: ApcPowerReceiver
    powerLoad: 8000
  - type: DHRiftGenerator
    chargeTime: 30
    cooldown: 300
  - type: StaticPrice
    price: 25000

- type: entity
  abstract: true
  parent: DHRiftMachineBase
  id: DHRiftAccumulatorBase
  components:
  - type: ApcPowerReceiver
    powerLoad: 500

- type: entity
  parent: DHRiftAccumulatorBase
  id: DHRiftCoil
  name: rift coil
  description: The smallest rift accumulator, for light craft. Holds chronite for four jumps; wears out quickly. Load chronite cells into it, repair wear with a welder.
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/Shuttles/Rift/coil.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: DHRiftAccumulator
    maxMass: 25000
    chronite: 100
    chroniteMax: 100
    chronitePerJump: 25
    wearPerJump: 0.1
    flashPower: 1
  - type: StaticPrice
    price: 10000

- type: entity
  parent: DHRiftAccumulatorBase
  id: DHRiftCapacitor
  name: rift capacitor
  description: A mid-size rift accumulator for frigates and transports. More chronite per jump, a stronger flash, slower wear.
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/Shuttles/Rift/capacitor.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: DHRiftAccumulator
    maxMass: 80000
    chronite: 160
    chroniteMax: 160
    chronitePerJump: 40
    wearPerJump: 0.07
    flashPower: 1.3
  - type: StaticPrice
    price: 20000

- type: entity
  parent: DHRiftAccumulatorBase
  id: DHRiftSupercapacitor
  name: rift supercapacitor
  description: A heavy rift accumulator for large warships. Burns a lot of chronite and gives off a powerful flash, but wears out slowly.
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/Shuttles/Rift/supercapacitor.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: DHRiftAccumulator
    maxMass: 250000
    chronite: 240
    chroniteMax: 240
    chronitePerJump: 60
    wearPerJump: 0.05
    flashPower: 1.6
  - type: StaticPrice
    price: 40000

# Хронитовая ячейка: заряд для накопителя. Слабо облучает хронитом, если держать при себе.
- type: entity
  parent: BaseItem
  id: DHChroniteCell
  name: chronite cell
  description: A sealed cell of refined chronite for rift accumulators. Load it into a coil or capacitor. Do not carry it around for long.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _DarkestHour/Objects/Power/chronite_cell.rsi
    state: icon
  - type: PointLight
    radius: 1.2
    energy: 0.8
    color: "#9b4dff"
  - type: DHChroniteCell
    amount: 25
  - type: DHChroniteEmitter
    rate: 0.01
    range: 1
  - type: StaticPrice
    price: 800

# Звёздные системы: для каждой при старте раунда создаётся своя карта. Названия — заглушки, автор переименует.
# Тела — заглушки, автор переделает. Координаты — метры от центра карты системы (точки прибытия у центра).
- type: dhStarSystem
  id: DHSystemTau
  name: dh-star-system-tau
  bodies:
  - id: Star
    name: dh-celestial-tau
    kind: Star
    position: -380000, 240000
    radius: 70000
    color: "#FFE2A8"
    radiation: 70
    radiationFalloff: 240000
  - id: T1
    name: dh-celestial-tau-1
    position: 30000, -40000
    radius: 5000
    color: "#7FA36B"
    orbitParent: Star
    landable: true
    biome: Grasslands
    surfaceGases:
      Oxygen: 21.8
      Nitrogen: 82.1
    surfaceTemperature: 291
    surfaceLight: "#D8B059"
  - id: T2
    name: dh-celestial-tau-2
    kind: GasGiant
    position: 260000, 420000
    radius: 30000
    color: "#C9B27A"
    orbitParent: Star
    radiation: 0.1
    radiationFalloff: 7000
    enterableDepth: 3000
    layerGases:
      Nitrogen: 0.5
      Oxygen: 0.3
      CarbonDioxide: 0.2
    layerTemperature: 180

