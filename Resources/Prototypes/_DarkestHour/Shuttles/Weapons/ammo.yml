# DarkestHour: боеприпасы корабельных орудий. 20 и 30 мм — короба-заряжатели (магазин в слоте орудия);
# 90, 155 и 220 мм — снаряды, заряжаются по одному. Спрайты Monolith (CC-BY-SA / CC-BY).

- type: Tag
  id: DHShipMagazine20mm

- type: Tag
  id: DHShipMagazine30mm

- type: Tag
  id: DHShipCartridge20mm

- type: Tag
  id: DHShipCartridge30mm

- type: Tag
  id: DHShipShell90mm

- type: Tag
  id: DHShipShell155mm

- type: Tag
  id: DHShipShell220mm

# --- 20 мм ---

- type: entity
  abstract: true
  parent: BaseItem
  id: DHShipMagazineBase
  components:
  - type: Item
    size: Large
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Boxes/generic_shipgun_box.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: DHShipMagazineBase
  id: DHShipMagazine20mm
  name: 20mm ammo loader
  description: A loader box with 400 rounds for a 20mm autocannon.
  components:
  - type: Tag
    tags:
    - DHShipMagazine20mm
  - type: BallisticAmmoProvider
    proto: DHShipCartridge20mm
    capacity: 400
    whitelist:
      tags:
      - DHShipCartridge20mm
  - type: StaticPrice
    price: 300

- type: entity
  parent: DHShipMagazineBase
  id: DHShipMagazine30mmAP
  name: 30mm AP ammo loader
  description: A loader box with 150 armour-piercing rounds for a 30mm autocannon.
  components:
  - type: Tag
    tags:
    - DHShipMagazine30mm
  - type: BallisticAmmoProvider
    proto: DHShipCartridge30mmAP
    capacity: 150
    whitelist:
      tags:
      - DHShipCartridge30mm
  - type: StaticPrice
    price: 450

- type: entity
  parent: DHShipMagazine30mmAP
  id: DHShipMagazine30mmHE
  name: 30mm HE ammo loader
  description: A loader box with 150 high-explosive rounds for a 30mm autocannon.
  components:
  - type: BallisticAmmoProvider
    proto: DHShipCartridge30mmHE
    capacity: 150
    whitelist:
      tags:
      - DHShipCartridge30mm

# Стартовый короб 30 мм в орудии — бронебойный.
- type: entity
  parent: DHShipMagazine30mmAP
  id: DHShipMagazine30mm
  suffix: AP, starting

- type: entity
  abstract: true
  parent: BaseCartridge
  id: DHShipCartridgeBase
  components:
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/50_armorpiercing_machinegun_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: DHShipCartridgeBase
  id: DHShipCartridge20mm
  name: 20mm cartridge
  components:
  - type: Tag
    tags:
    - Cartridge
    - DHShipCartridge20mm
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: DHShipBullet20mm

- type: entity
  parent: DHShipCartridgeBase
  id: DHShipCartridge30mmAP
  name: 30mm AP cartridge
  components:
  - type: Tag
    tags:
    - Cartridge
    - DHShipCartridge30mm
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: DHShipBullet30mmAP

- type: entity
  parent: DHShipCartridgeBase
  id: DHShipCartridge30mmHE
  name: 30mm HE cartridge
  components:
  - type: Tag
    tags:
    - Cartridge
    - DHShipCartridge30mm
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: DHShipBullet30mmHE

# --- Снаряды 90 / 155 / 220 мм ---

- type: entity
  abstract: true
  parent: BaseCartridge
  id: DHShipShellBase
  components:
  - type: Item
    size: Large
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 60
        mask:
        - ItemMask
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/shells.rsi
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: Injurable
    damageContainer: Inorganic
  - type: Damageable
    damageModifierSet: Metallic

- type: entity
  parent: DHShipShellBase
  id: DHShipShell90mmAP
  name: 90mm AP shell
  description: An armour-piercing shell for a 90mm naval gun.
  components:
  - type: Tag
    tags:
    - DHShipShell90mm
  - type: Sprite
    layers:
    - state: 90mmAP
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: DHShipBullet90mmAP
    deleteOnSpawn: true
    muzzleFlash: null
  - type: StaticPrice
    price: 120

- type: entity
  parent: DHShipShellBase
  id: DHShipShell90mmHE
  name: 90mm HE shell
  description: A high-explosive shell for a 90mm naval gun.
  components:
  - type: Tag
    tags:
    - DHShipShell90mm
  - type: Sprite
    layers:
    - state: 90mmHE
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: DHShipBullet90mmHE
    deleteOnSpawn: true
    muzzleFlash: null
  - type: StaticPrice
    price: 150

- type: entity
  parent: DHShipShellBase
  id: DHShipShell155mmAP
  name: 155mm AP shell
  description: An armour-piercing shell for a 155mm howitzer.
  components:
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - DHShipShell155mm
  - type: Sprite
    layers:
    - state: 150mmAP
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: DHShipBullet155mmAP
    deleteOnSpawn: true
    muzzleFlash: null
  - type: StaticPrice
    price: 300

- type: entity
  parent: DHShipShellBase
  id: DHShipShell155mmHE
  name: 155mm HE shell
  description: A high-explosive shell for a 155mm howitzer.
  components:
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - DHShipShell155mm
  - type: Sprite
    layers:
    - state: 255mmHE
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: DHShipBullet155mmHE
    deleteOnSpawn: true
    muzzleFlash: null
  - type: StaticPrice
    price: 350

- type: entity
  parent: DHShipShellBase
  id: DHShipShell220mmAPHE
  name: 220mm APHE shell
  description: An armour-piercing high-explosive shell for a 220mm cannon.
  components:
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - DHShipShell220mm
  - type: Sprite
    layers:
    - state: 220mmAPHE
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: DHShipBullet220mmAPHE
    deleteOnSpawn: true
    muzzleFlash: null
  - type: StaticPrice
    price: 600

- type: entity
  parent: DHShipShellBase
  id: DHShipShell220mmHE
  name: 220mm HE shell
  description: A high-explosive shell for a 220mm cannon.
  components:
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - DHShipShell220mm
  - type: Sprite
    layers:
    - state: 220mmHE
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: DHShipBullet220mmHE
    deleteOnSpawn: true
    muzzleFlash: null
  - type: StaticPrice
    price: 650

# --- Снаряды в полёте ---

- type: entity
  parent: BaseBullet
  id: DHShipBullet20mm
  categories: [ HideSpawnMenu ]
  name: 20mm bullet
  components:
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/50_armorpiercing_machinegun_casing.rsi
    layers:
    - state: base-projectile
  - type: Projectile
    damage:
      types:
        Piercing: 40
        Structural: 15
  - type: TimedDespawn
    lifetime: 2
  - type: PointLight
    radius: 2
    energy: 0.5
    color: orange

- type: entity
  parent: BaseBullet
  id: DHShipBullet30mmAP
  categories: [ HideSpawnMenu ]
  name: 30mm AP bullet
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 90
        Structural: 60
  - type: TimedDespawn
    lifetime: 3
  - type: PointLight
    radius: 2.5
    energy: 0.5
    color: orange

- type: entity
  parent: BaseBulletTrigger
  id: DHShipBullet30mmHE
  categories: [ HideSpawnMenu ]
  name: 30mm HE bullet
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 40
        Structural: 30
  - type: TimedDespawn
    lifetime: 3
  - type: PointLight
    radius: 2.5
    energy: 0.5
    color: orange
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 4
    intensitySlope: 2
    maxIntensity: 2
    tileBreakScale: 2

- type: entity
  abstract: true
  parent: BaseBullet
  id: DHShipShellBulletBase
  components:
  - type: TimedDespawn
    lifetime: 6
  - type: PointLight
    radius: 3
    energy: 0.8
    color: "#FCBA03"

- type: entity
