# DarkestHour: корабельные и станционные орудия (этап 3). По образцу Monolith SpaceArtillery (AGPL), спрайты Monolith
# (CC-BY-SA, _Mono/Objects/ShuttleWeapons). Управляются с консоли наведения (DHGunneryConsole); 20 и 30 мм — ещё и
# противометеорная защита. Станции — только 20 и 30 мм.

- type: entity
  abstract: true
  parent: BaseMachinePowered
  id: DHShipGunBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 800
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
    delay: 10
  - type: Pullable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    drawdepth: OverMobs
    noRot: false
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: StaticPrice
    price: 2000

# Магазинные (20 и 30 мм): короб-заряжатель в слоте.
- type: entity
  abstract: true
  parent: DHShipGunBase
  id: DHShipGunMagazineBase
  components:
  - type: MagazineAmmoProvider
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg

# Снарядные (90, 155, 220 мм): снаряды заряжаются по одному прямо в орудие.
- type: entity
  abstract: true
  parent: DHShipGunBase
  id: DHShipGunShellBase
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg

- type: entity
  parent: DHShipGunMagazineBase
  id: DHShipGun20mm
  name: 20mm point-defense autocannon
  description: A light rapid-fire turret. Shreds small craft and, in point-defense mode, shoots down meteors before they reach the hull. Needs power; controlled from a gunnery computer.
  components:
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/L85.rsi
    layers:
    - state: icon
  - type: DHShipGun
    caliber: dh-ship-gun-caliber-20
    pointDefense: true
    pointDefenseRange: 40
  - type: Gun
    fireRate: 10
    projectileSpeed: 120
    minAngle: 0
    maxAngle: 4
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/flak_fire.ogg
      params:
        volume: -4
        variation: 0.1
        pitch: 1.3
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: DHShipMagazine20mm
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - DHShipMagazine20mm
  - type: ApcPowerReceiver
    powerLoad: 300

- type: entity
  parent: DHShipGunMagazineBase
  id: DHShipGun30mm
  name: 30mm autocannon
  description: A heavy rapid-fire turret with armour-piercing and high-explosive belts. Also works in point-defense mode. Needs power; controlled from a gunnery computer.
  components:
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/rac-30_draupnir.rsi
    layers:
    - state: space_artillery
  - type: DHShipGun
    caliber: dh-ship-gun-caliber-30
    pointDefense: true
    pointDefenseRange: 50
    proximityRange: 1.2
  - type: Gun
    fireRate: 6
    projectileSpeed: 100
    minAngle: 0
    maxAngle: 3
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/flak_fire.ogg
      params:
        variation: 0.1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: DHShipMagazine30mm
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - DHShipMagazine30mm
  - type: ApcPowerReceiver
    powerLoad: 500

- type: entity
  parent: DHShipGunShellBase
  id: DHShipGun90mm
  name: 90mm naval gun
  description: A medium single-barrel gun. Shells are loaded by hand, one at a time. Controlled from a gunnery computer.
  components:
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/longbow.rsi
    layers:
    - state: space_artillery
  - type: DHShipGun
    caliber: dh-ship-gun-caliber-90
  - type: Gun
    fireRate: 0.5
    projectileSpeed: 90
    minAngle: 0
    maxAngle: 1
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/cannon.ogg
  - type: BallisticAmmoProvider
    capacity: 8
    whitelist:
      tags:
      - DHShipShell90mm
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: StaticPrice
    price: 6000

- type: entity
  parent: DHShipGunShellBase
  id: DHShipGun155mm
  name: 155mm howitzer
  description: A heavy long-range gun. Slow to reload, devastating on impact. Controlled from a gunnery computer.
  components:
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/hades.rsi
    layers:
    - state: space_artillery
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.6,0.6,0.6"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: DHShipGun
    caliber: dh-ship-gun-caliber-155
  - type: Gun
    fireRate: 0.25
    projectileSpeed: 80
    minAngle: 0
    maxAngle: 1
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/120mm_mortar.ogg
  - type: BallisticAmmoProvider
    capacity: 6
    whitelist:
      tags:
      - DHShipShell155mm
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ApcPowerReceiver
    powerLoad: 2000
  - type: StaticPrice
    price: 12000

- type: entity
  parent: DHShipGunShellBase
  id: DHShipGun220mm
  name: 220mm twin cannon
  description: A main battery with two barrels firing paired salvos at extreme range. Controlled from a gunnery computer.
  components:
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/cyrexa.rsi
    layers:
    - state: space_artillery
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.6,0.6,0.6"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: DHShipGun
    caliber: dh-ship-gun-caliber-220
  - type: Gun
    fireRate: 0.15
    projectileSpeed: 110
    minAngle: 0
    maxAngle: 1
    burstCooldown: 6
    burstFireRate: 2
    shotsPerBurst: 2
    selectedMode: Burst
    availableModes:
    - Burst
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/120mm_mortar.ogg
      params:
        volume: 3
        pitch: 0.8
  - type: BallisticAmmoProvider
    capacity: 8
    whitelist:
      tags:
      - DHShipShell220mm
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ApcPowerReceiver
    powerLoad: 3000
  - type: StaticPrice
    price: 20000

# Консоль наведения: корабельная (только ручной огонь) и станционная (с противометеорной защитой).
- type: entity
  parent: BaseComputer
  id: DHComputerGunnery
  name: gunnery computer
  description: Radar fire control for every gun on this hull. Click the radar to fire the selected guns at that point.
  components:
  - type: ComputerVisuals
    stateScreen: shuttle
    stateKeys: security_key
  - type: RadarConsole
    maxRange: 384
  - type: DHGunneryConsole
  - type: ActivatableUI
    key: enum.DHGunneryUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DHGunneryUiKey.Key:
        type: DHGunneryBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: DHGunneryComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#e0503a"

- type: entity
  parent: DHComputerGunnery
  id: DHComputerPointDefense
  name: station defense computer
  description: Fire control for the station's turrets, with an automatic point-defense mode that shoots down approaching meteors.
  components:
  - type: DHGunneryConsole
    autoDefense: true
  - type: Computer
    board: DHPointDefenseComputerCircuitboard

- type: entity
  parent: BaseComputerCircuitboard
  id: DHGunneryComputerCircuitboard
  name: gunnery computer board
  description: A computer printed circuit board for a gunnery computer.
  components:
  - type: Sprite
    state: cpu_security
  - type: ComputerBoard
    prototype: DHComputerGunnery

- type: entity
  parent: BaseComputerCircuitboard
  id: DHPointDefenseComputerCircuitboard
  name: station defense computer board
  description: A computer printed circuit board for a station defense computer.
  components:
  - type: Sprite
    state: cpu_security
  - type: ComputerBoard
    prototype: DHComputerPointDefense
