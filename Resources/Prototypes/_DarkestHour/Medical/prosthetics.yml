# Ящик протезов: по паре рук и ног (карго, раздел «Медицина»).
- type: entity
  parent: CrateMedical
  id: DHCrateProsthetics
  name: prosthetics crate
  description: Two prosthetic arms and two prosthetic legs, left and right.
  components:
  - type: StorageFill
    contents:
    - id: DHProstheticArmLeft
    - id: DHProstheticArmRight
    - id: DHProstheticLegLeft
    - id: DHProstheticLegRight
