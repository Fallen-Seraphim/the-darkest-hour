# Протезы конечностей (план осады п. 18): серо-стальные конечности из спрайта человеческих частей.
# Приживляются обычной операцией «приживление конечности»; не кровят, не ломаются, нервов нет.

- type: entity
  parent: OrganBaseArmLeft
  id: DHOrganProstheticArmLeft
  name: prosthetic left arm
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: l_arm
    color: "#7d848c"
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
      state: l_arm
      color: "#7d848c"
  - type: VisualOrganMarkings
    markingData:
      group: None
  - type: DHProsthetic

