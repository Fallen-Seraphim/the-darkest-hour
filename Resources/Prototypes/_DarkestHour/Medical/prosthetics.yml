- type: entity
  parent: DetachedBody
  id: DHProstheticArmLeft
  name: prosthetic left arm
  description: A steel-and-polymer limb on a standard socket. Attached like any severed limb — it doesn't bleed, break or hurt.
  save: true
  components:
  - type: InitialBody
    organs:
      ArmLeft: DHOrganProstheticArmLeft
      HandLeft: DHOrganProstheticHandLeft
    relationships:
      ArmLeft: [ HandLeft ]
  - type: StaticPrice
    price: 150

