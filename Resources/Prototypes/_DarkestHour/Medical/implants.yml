# Импланты (план осады п. 29): ставятся операцией «Установка импланта» в голову или торс. Пока в теле —
# растёт отторжение (DHImplantSystem). Спрайты — Tools/_DarkestHour/implants/build.py.

- type: entity
  parent: BaseItem
  id: DHImplantBase
  abstract: true
  components:
  - type: Sprite
    sprite: _DarkestHour/Objects/Specific/Medical/implants.rsi
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 400

- type: entity
  parent: DHImplantBase
  id: DHImplantBase
  name: 'basic implant'
  description: "A service bio-capsule: a base for other implants. Barely noticeable to the body."
  components:
  - type: Sprite
    state: base
  - type: DHImplant
    kind: Base
    part: Torso
    passiveRate: 0.001
    activeRate: 0

- type: entity
  parent: DHImplantBase
  id: DHImplantPulsar
  name: '"Pulsar" cardiac stimulator'
  description: "Restarts a stopped heart once, then needs ten minutes to recharge."
  components:
  - type: Sprite
    state: pulsar
  - type: DHImplant
    kind: Pulsar
    part: Torso

- type: entity
  parent: DHImplantBase
  id: DHImplantEcho
  name: '"Echo" auditory implant'
  description: "Dampens the concussion of blasts and makes distant gunfire easier to place by ear."
  components:
  - type: Sprite
    state: echo
  - type: DHImplant
    kind: Echo
    part: Head

- type: entity
  parent: DHImplantBase
  id: DHImplantScale
  name: '"Scale" subdermal armor'
  description: "A mesh under the skin that turns blades, bullets and fragments a little."
  components:
  - type: Sprite
    state: scale
  - type: DHImplant
    kind: Scale
    part: Torso

- type: entity
  parent: DHImplantBase
  id: DHImplantSilence
  name: '"Silence" pain suppressor'
  description: "Pain and pain shock below the threshold are not felt. You also stop feeling how badly hurt you are."
  components:
  - type: Sprite
    state: silence
  - type: DHImplant
    kind: Silence
    part: Head

- type: entity
  parent: DHImplantBase
  id: DHImplantFilter
  name: '"Filter" lung filter'
  description: "Filters poisons and fallout out of every breath."
  components:
  - type: Sprite
    state: filter
  - type: DHImplant
    kind: Filter
    part: Torso

- type: entity
  parent: DHImplantBase
  id: DHImplantHemostat
  name: '"Hemostat" clotting implant'
  description: "Releases clotting agents into the blood: bleeding stops much faster."
  components:
  - type: Sprite
    state: hemostat
  - type: DHImplant
    kind: Hemostat
    part: Torso

# Ящик имплантов (карго, раздел «Медицина», 1 со старта): по одному каждого и Цитрасин.
- type: entity
  parent: CrateMedical
  id: DHCrateImplants
  name: implants crate
  description: "Sealed bio-capsules for surgical implantation, and immunosuppressant to keep the body from rejecting them."
  components:
  - type: StorageFill
    contents:
    - id: DHImplantPulsar
    - id: DHImplantEcho
    - id: DHImplantScale
    - id: DHImplantSilence
    - id: DHImplantFilter
    - id: DHImplantHemostat
    - id: DHPillCanisterCitrasin
      amount: 2

- type: entity
  name: pill
  suffix: Citrasin 10u
  parent: Pill
  id: DHPillCitrasin
  components:
  - type: Pill
    pillType: 7
  - type: Sprite
    state: pill8
  - type: Label
    localizedLabel: reagent-name-dh-citrasin
  - type: Solution
    solution:
      reagents:
      - ReagentId: DHCitrasin
        Quantity: 10

- type: entity
  name: pill canister
  parent: PillCanister
  id: DHPillCanisterCitrasin
  suffix: Citrasin 10u, 6
  components:
  - type: Label
    localizedLabel: reagent-name-dh-citrasin
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: DHPillCitrasin
        amount: 6
