# DarkestHour: операции. Часть тела открывают («Разрез», для головы и торса ещё «Вскрыть кость»), работают внутри и закрывают
# («Закрыть»: вправить и склеить кость, если вскрыта, затем прижечь). Органы и конечности — сущности тела апстрима.

- type: dhSurgery
  id: DHSurgeryOpen
  name: dh-surgery-open
  description: dh-surgery-open-desc
  order: 0
  parts: [ Head, Torso, ArmLeft, ArmRight, HandLeft, HandRight, LegLeft, LegRight, FootLeft, FootRight ]
  forbids: [ Incised ]
  steps:
  - DHSurgeryStepIncise
  - DHSurgeryStepClamp
  - DHSurgeryStepRetract

