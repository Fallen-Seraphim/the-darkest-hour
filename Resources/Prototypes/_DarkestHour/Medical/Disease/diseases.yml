# DarkestHour: болезни (этап 2, шаг 3). Список и лечение — claude/medicine-design.md (утверждено автором 2026-10-20).
# Прогресс: N = стадия N; progressRate — рост в секунду, immuneGain/immuneStrength — как организм сам сбивает болезнь.
# Первая стадия — инкубация: без симптомов, не заразна, не видна на медицинском HUD.
# resistance — устойчивость к обычным лекарствам (резервные действуют в полную силу).

# 1. Простуда — вирус, воздух. Проходит сама за ~10 минут, оставляет иммунитет.
- type: dhDisease
  id: DHDiseaseCold
  name: dh-disease-cold
  group: Virus
  spread: [ Airborne ]
  infectivity: 0.12
  progressRate: 0.008
  immuneGain: 0.002
  immuneStrength: 0.025
  grantsImmunity: true
  symptoms: [ dh-symptom-sneezing, dh-symptom-cough, dh-symptom-runny-nose ]
  structure: dh-virology-structure-cold
  treatment: Rest
  recipe: dh-virology-recipe-cold
  researchPoints: 3000
  stages:
  - contagious: false
    symptomatic: false
  - interval: 6
    effects:
    - !type:Emote
      emote: Sneeze
      showInChat: true
      probability: 0.15
    - !type:Emote
      emote: Cough
      showInChat: true
      probability: 0.15
    - !type:PopupMessage
      type: Local
      visualType: Small
      messages: [ "dh-disease-symptom-runny-nose", "dh-disease-symptom-sore-throat" ]
      probability: 0.1

# 2. Грипп «Таурус» — вирус, воздух и контакт. Жар, отравление, обмороки; без лечения ~20 минут.
- type: dhDisease
  id: DHDiseaseFluTaurus
  name: dh-disease-flu-taurus
  group: Virus
  spread: [ Airborne, Contact ]
  infectivity: 0.15
  progressRate: 0.0055
  immuneGain: 0.0012
  immuneStrength: 0.012
  grantsImmunity: true
  symptoms: [ dh-symptom-cough, dh-symptom-fever, dh-symptom-aches, dh-symptom-weakness, dh-symptom-fainting ]
  structure: dh-virology-structure-flu-taurus
  treatment: Vaccine
  recipe: dh-virology-recipe-flu-taurus
  researchPoints: 7500
  stages:
  - contagious: false
    symptomatic: false
  - interval: 6
    effects:
    - !type:Emote
      emote: Cough
      showInChat: true
      probability: 0.2
    - !type:PopupMessage
      type: Local
      visualType: Small
      messages: [ "dh-disease-symptom-fever", "dh-disease-symptom-aches" ]
      probability: 0.15
    - !type:HealthChange
      probability: 0.3
      damage:
        types:
          Poison: 0.5
  - interval: 5
    effects:
    - !type:Emote
      emote: Cough
      showInChat: true
      probability: 0.25
    - !type:PopupMessage
      type: Local
      visualType: Medium
      messages: [ "dh-disease-symptom-high-fever", "dh-disease-symptom-weak" ]
      probability: 0.15
    - !type:HealthChange
      probability: 0.5
      damage:
        types:
          Poison: 1
    - !type:Jitter
      probability: 0.1
    - !type:ModifyStatusEffect
      effectProto: StatusEffectForcedSleeping
      time: 3
      type: Update
      probability: 0.03
    # Осложнение: бактериальная пневмония.
    - !type:DHInfectDisease
      disease: DHDiseasePneumonia
      probability: 0.004

