# DarkestHour: болезни (этап 2, шаг 3). Список и лечение — claude/medicine-design.md (утверждено автором 2026-10-20).
# Прогресс: N = стадия N; progressRate — рост в секунду, immuneGain/immuneStrength — как организм сам сбивает болезнь.
# Первая стадия — инкубация: без симптомов, не заразна, не видна на медицинском HUD.
# Остальные болезни списка (пневмония, лихорадка Келвина, MRS-14, грибки, паразиты) — вместе с их лекарствами и вирусологией.

# 1. Простуда — вирус, воздух. Проходит сама за ~10 минут, оставляет иммунитет.
- type: dhDisease
  id: DHDiseaseCold
  name: dh-disease-cold
  group: Virus
  spread: [ Airborne ]
  infectivity: 0.12
  progressRate: 0.008
  immuneGain: 0.002
  immuneStrength: 0.025
  grantsImmunity: true
  stages:
  - contagious: false
    symptomatic: false
  - interval: 6
    effects:
    - !type:Emote
      emote: Sneeze
      showInChat: true
      probability: 0.15
    - !type:Emote
      emote: Cough
      showInChat: true
      probability: 0.15
    - !type:PopupMessage
      type: Local
      visualType: Small
      messages: [ "dh-disease-symptom-runny-nose", "dh-disease-symptom-sore-throat" ]
      probability: 0.1

# 2. Грипп «Таурус» — вирус, воздух и контакт. Жар, отравление, обмороки; без лечения ~20 минут.
- type: dhDisease
  id: DHDiseaseFluTaurus
  name: dh-disease-flu-taurus
  group: Virus
  spread: [ Airborne, Contact ]
  infectivity: 0.15
  progressRate: 0.0055
  immuneGain: 0.0012
  immuneStrength: 0.012
  grantsImmunity: true
  stages:
  - contagious: false
    symptomatic: false
  - interval: 6
    effects:
    - !type:Emote
      emote: Cough
      showInChat: true
      probability: 0.2
    - !type:PopupMessage
      type: Local
      visualType: Small
      messages: [ "dh-disease-symptom-fever", "dh-disease-symptom-aches" ]
      probability: 0.15
    - !type:HealthChange
      probability: 0.3
      damage:
        types:
          Poison: 0.5
  - interval: 5
    effects:
    - !type:Emote
      emote: Cough
      showInChat: true
      probability: 0.25
    - !type:PopupMessage
      type: Local
      visualType: Medium
      messages: [ "dh-disease-symptom-high-fever", "dh-disease-symptom-weak" ]
      probability: 0.15
    - !type:HealthChange
      probability: 0.5
      damage:
        types:
          Poison: 1
    - !type:Jitter
      probability: 0.1
    - !type:ModifyStatusEffect
      effectProto: StatusEffectForcedSleeping
      time: 3
      type: Update
      probability: 0.03

# 6. Станционная дизентерия — бактерия, контакт (и испорченная еда — эффект DHInfectDisease). Лечится антибиотиком.
- type: dhDisease
  id: DHDiseaseDysentery
  name: dh-disease-dysentery
  group: Bacteria
  spread: [ Contact ]
  infectivity: 0.12
  progressRate: 0.008
  immuneGain: 0.0004
  immuneStrength: 0.008
  stages:
  - contagious: false
    symptomatic: false
  - interval: 6
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Small
      messages: [ "dh-disease-symptom-cramps", "dh-disease-symptom-nausea" ]
      probability: 0.15
    - !type:Vomit
      probability: 0.06
    - !type:HealthChange
      probability: 0.4
      damage:
        types:
          Poison: 0.5
  - interval: 5
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Medium
      messages: [ "dh-disease-symptom-cramps-severe" ]
      probability: 0.15
    - !type:Vomit
      probability: 0.12
    - !type:HealthChange
      probability: 0.6
      damage:
        types:
          Poison: 1

# 5. Раневая инфекция — бактерия, не заразна; от нестерильной операции (без маски и перчаток) и грязных ран.
# Организм почти не справляется сам: нужен Спейсациллин. Последняя стадия — гангрена.
- type: dhDisease
  id: DHDiseaseWoundInfection
  name: dh-disease-wound-infection
  group: Bacteria
  infectivity: 0
  progressRate: 0.0067
  immuneGain: 0.0002
  immuneStrength: 0.005
  stages:
  - contagious: false
    symptomatic: false
  - contagious: false
    interval: 10
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Small
      messages: [ "dh-disease-symptom-wound-throb", "dh-disease-symptom-fever" ]
      probability: 0.25
    - !type:HealthChange
      damage:
        types:
          Poison: 0.5
  - contagious: false
    interval: 10
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Medium
      messages: [ "dh-disease-symptom-wound-oozing", "dh-disease-symptom-high-fever" ]
      probability: 0.25
    - !type:HealthChange
      damage:
        types:
          Poison: 1.5
    - !type:Jitter
      probability: 0.15
  - contagious: false
    interval: 10
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Large
      messages: [ "dh-disease-symptom-gangrene" ]
      probability: 0.25
    - !type:HealthChange
      damage:
        types:
          Poison: 2
          Cellular: 1

# 13. Лучевая болезнь — не заразна. Стадию задаёт накопленная доза радиации (DHDose), не время.
- type: dhDisease
  id: DHDiseaseRadiationSickness
  name: dh-disease-radiation-sickness
  group: Radiation
  infectivity: 0
  progressRate: 0
  immuneGain: 0
  stages:
  - contagious: false
    interval: 8
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Small
      messages: [ "dh-disease-symptom-nausea", "dh-disease-symptom-rad-metal-taste" ]
      probability: 0.2
    - !type:Vomit
      probability: 0.04
  - contagious: false
    interval: 6
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Small
      messages: [ "dh-disease-symptom-rad-hair", "dh-disease-symptom-weak" ]
      probability: 0.15
    - !type:Vomit
      probability: 0.08
    - !type:ModifyBleed
      amount: 0.5
      probability: 0.2
    - !type:HealthChange
      probability: 0.4
      damage:
        types:
          Cellular: 0.3
  - contagious: false
    interval: 5
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Medium
      messages: [ "dh-disease-symptom-rad-bleeding", "dh-disease-symptom-weak" ]
      probability: 0.15
    - !type:ModifyBleed
      amount: 1
      probability: 0.3
    - !type:HealthChange
      probability: 0.6
      damage:
        types:
          Cellular: 1
    - !type:Jitter
      probability: 0.1
  - contagious: false
    interval: 5
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Large
      messages: [ "dh-disease-symptom-rad-dying" ]
      probability: 0.15
    - !type:HealthChange
      damage:
        types:
          Cellular: 3
          Poison: 1
    - !type:ModifyStatusEffect
      effectProto: StatusEffectForcedSleeping
      time: 3
      type: Update
      probability: 0.05

# 12. Хронитовая кожно-покровная болезнь — не заразна, страшнее лучевой. Стадию задаёт накопленный хронит (DHDose);
# хронит сам не выводится. Кожа светится фиолетовым. Лечение: Хроносорб + Dylovene (ранняя стадия), иссечение кожи
# и пересадка (средняя). Последняя стадия неизлечима.
- type: dhDisease
  id: DHDiseaseChroniteSkin
  name: dh-disease-chronite-skin
  group: Chronite
  infectivity: 0
  progressRate: 0
  immuneGain: 0
  stages:
  - contagious: false
    interval: 8
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Small
      messages: [ "dh-disease-symptom-chronite-spots", "dh-disease-symptom-chronite-itch" ]
      probability: 0.2
  - contagious: false
    interval: 6
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Medium
      messages: [ "dh-disease-symptom-chronite-crystals", "dh-disease-symptom-chronite-cracks" ]
      probability: 0.2
    - !type:HealthChange
      probability: 0.5
      damage:
        types:
          Caustic: 0.5
    - !type:ModifyBleed
      amount: 0.5
      probability: 0.2
    - !type:DHAddPain
      amount: 10
      probability: 0.3
  - contagious: false
    interval: 5
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Medium
      messages: [ "dh-disease-symptom-chronite-necrosis" ]
      probability: 0.2
    - !type:HealthChange
      probability: 0.7
      damage:
        types:
          Caustic: 1
          Cellular: 1
    - !type:ModifyBleed
      amount: 1
      probability: 0.3
    - !type:DHAddPain
      amount: 20
      probability: 0.4
  - contagious: false
    interval: 5
    effects:
    - !type:PopupMessage
      type: Local
      visualType: Large
      messages: [ "dh-disease-symptom-chronite-terminal" ]
      probability: 0.2
    - !type:HealthChange
      damage:
        types:
          Caustic: 2
          Cellular: 3
    - !type:DHAddPain
      amount: 30
      probability: 0.5
