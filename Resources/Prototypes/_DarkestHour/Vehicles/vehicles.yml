# Бронетехника «Штурма» (решение автора 2026-10-30): по БТР и танку на сторону.
# Код — Content.*/_DarkestHour/Vehicles. Спрайты корпусов, башен и модулей — RMC-14 (cmss13, CC-BY-SA-3.0).
#
# Как пользоваться:
#  * войти — клик по машине (2 с; кого тащите — затаскивается с вами), выйти — клик по люку в отсеке;
#  * кресло водителя — ведёте машину и видите то, что вокруг неё; кресла стрелков — стреляете из орудия (боевой
#    режим), башня доворачивается за прицелом; командир — ещё и дымовая завеса (если есть);
#  * броня: пули её почти не берут (10 % урона по постройкам), бронебойные снаряды и взрывы — полностью;
#  * уничтоженная машина выбрасывает экипаж и десант наружу ранеными и оставляет остов.

# ------------------------------------------------------------------ основа

- type: entity
  abstract: true
  id: DHVehicleBase
  placement:
    mode: AlignTileAny
  components:
  - type: Transform
    anchored: false
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Physics
    bodyType: KinematicController
  - type: Vehicle
    transferDamage: false
  - type: MovementSpeedModifier
    weightlessModifier: 0
    acceleration: 1.5
    friction: 2
    frictionNoInput: 4
    baseWalkSpeed: 3
    baseSprintSpeed: 4.5
  - type: GravityAffected
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: DHFortified
    multiplier: 1
    bulletStructuralMultiplier: 0.1
  - type: Appearance
  - type: AmbientSound
    volume: -4
    range: 8
    sound:
      path: /Audio/Ambience/Objects/engine_hum.ogg
  - type: PointLight
    radius: 6
    energy: 1.5
    softness: 2
    autoRot: true
    offset: "0,-1.6"
  - type: Tag
    tags:
    - DoorBumpOpener

# ------------------------------------------------------------------ БТР

- type: entity
  abstract: true
  parent: DHVehicleBase
  id: DHVehicleAPCBase
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.15,-1.9,1.15,1.95"
        density: 5000
        mask:
        - Impassable
        - LowImpassable
        layer:
        - LargeMobLayer
      runover:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.2,-1.95,1.2,2"
        hard: false
        mask:
        - MobLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: DHVehicleAPCBase
  id: DHVehicleRAM45
  name: RAM-45 armoured personnel carrier
  description: A Republic command APC. Twin autocannon in the turret, a heavy machine gun in the bow, a radio relay mast on the roof and seats for a squad in the back.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/apc.rsi
    drawdepth: Mobs
    layers:
    - state: apc_base_com
      map: [ "base" ]
    - state: frontalcannon_0
      map: [ "secondary" ]
    - state: comms_relay_0
      map: [ "support" ]
    - state: dualcannon_0
      map: [ "primary" ]
    - state: wheels_0
      map: [ "wheels" ]
      loop: false
  # wheels_0 — целые колёса/гусеницы (анимированы), wheels_1 — разбитые. Стоя — один проход анимации и стоп.
  - type: SpriteMovement
    movementLayers:
      wheels:
        state: wheels_0
        loop: true
    noMovementLayers:
      wheels:
        state: wheels_0
        loop: false
  - type: DHVehicle
    interior: DHInteriorAPC
    hull: DHVehicleHullRAM45
    turretLayers: [ primary ]
    exitOffset: 0,2.6
    wreck: DHVehicleWreckRAM45
    weapons:
      primary: DHVehicleGunAutocannon30
      secondary: DHVehicleGunHMG
  - type: DHCommsRelay
    channels:
    - DHRepublic
    - DHRepublicCommand

- type: entity
  parent: DHVehicleAPCBase
  id: DHVehicleIM30
  name: IM-30 armoured personnel carrier
  description: An Imperial APC. A turret with an autocannon and a coaxial heavy machine gun, a relay set for the Imperial channels and seats for a squad in the back.
  components:
  # Корпус IM-30 крупнее RAM-45 (спрайт 160 px).
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.4,-2.25,1.4,2.3"
        density: 5000
        mask:
        - Impassable
        - LowImpassable
        layer:
        - LargeMobLayer
      runover:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.45,-2.3,1.45,2.35"
        hard: false
        mask:
        - MobLayer
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/sppapc.rsi
    drawdepth: Mobs
    layers:
    - state: sppapc_base
      map: [ "base" ]
    - state: spp_flare_launcher_0
      map: [ "support" ]
    - state: apc_turret_0
      map: [ "turret" ]
    - state: apc_autocannon_0
      map: [ "primary" ]
    - state: wheels_0
      map: [ "wheels" ]
      loop: false
  # wheels_0 — целые колёса/гусеницы (анимированы), wheels_1 — разбитые. Стоя — один проход анимации и стоп.
  - type: SpriteMovement
    movementLayers:
      wheels:
        state: wheels_0
        loop: true
    noMovementLayers:
      wheels:
        state: wheels_0
        loop: false
  - type: DHVehicle
    interior: DHInteriorAPC
    hull: DHVehicleHullIM30
    turretLayers: [ turret, primary ]
    exitOffset: 0,2.9
    wreck: DHVehicleWreckIM30
    weapons:
      primary: DHVehicleGunAutocannon30
      secondary: DHVehicleGunHMG
  - type: DHCommsRelay
    channels:
    - Syndicate
    - DHImperialCommand

