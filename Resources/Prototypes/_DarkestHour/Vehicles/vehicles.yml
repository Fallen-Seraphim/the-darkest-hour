      map: [ "base" ]
    - state: reactive_armor_0
      map: [ "armor" ]
    - state: tank_turret_0
      map: [ "turret" ]
    - state: p17702_0
      map: [ "primary" ]
    - state: t60p3m_0
      map: [ "secondary" ]
    - state: slauncher_0
      map: [ "support" ]
    - state: wheels_0
      map: [ "wheels" ]
