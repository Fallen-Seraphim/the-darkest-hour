    drawdepth: Mobs
    color: "#5a5a5a"
    layers:
    - state: apc_base_com
    - state: damaged_frame

- type: entity
  parent: DHVehicleWreckBase
  id: DHVehicleWreckIM30
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/sppapc.rsi
    drawdepth: Mobs
    color: "#5a5a5a"
    layers:
    - state: sppapc_base
    - state: damaged_frame

- type: entity
  parent: DHVehicleWreckBase
  id: DHVehicleWreckTankRepublic
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/spptank.rsi
