    - state: ballistic_armor_0
      map: [ "armor" ]
    - state: tank_turret_0
      map: [ "turret" ]
    - state: ltb_cannon_0
      map: [ "primary" ]
    - state: m56cupola_0
      map: [ "secondary" ]
    - state: slauncher_0
      map: [ "support" ]
    - state: wheels_0
      map: [ "wheels" ]
      loop: false
  # wheels_0 — целые колёса/гусеницы (анимированы), wheels_1 — разбитые. Стоя — один проход анимации и стоп.
  - type: SpriteMovement
    movementLayers:
      wheels:
        state: wheels_0
        loop: true
    noMovementLayers:
      wheels:
        state: wheels_0
        loop: false
  - type: DHVehicle
