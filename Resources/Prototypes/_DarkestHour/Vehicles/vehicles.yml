# ------------------------------------------------------------------ корпуса (о них упираются люди)

# Люди и машины — тела KinematicController, движок такие между собой не сталкивает. Поэтому у машины есть
# статичный дочерний «корпус» с её хитбоксом: слой Mid/HighImpassable (их ловит маска людей), но не тот, что
# в маске самой машины (Impassable, LowImpassable) — со своим корпусом она не сталкивается. Пули его не видят
# (нет BulletImpassable) и попадают в саму машину.

- type: entity
  abstract: true
  id: DHVehicleHullBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: true

- type: entity
  parent: DHVehicleHullBase
  id: DHVehicleHullRAM45
  components:
  - type: Fixtures
    fixtures:
      hull:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.15,-1.9,1.15,1.95"
        density: 1
        layer:
        - MidImpassable
        - HighImpassable

- type: entity
  parent: DHVehicleHullBase
  id: DHVehicleHullIM30
  components:
  - type: Fixtures
    fixtures:
      hull:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.4,-2.25,1.4,2.3"
        density: 1
        layer:
        - MidImpassable
        - HighImpassable

- type: entity
  parent: DHVehicleHullBase
  id: DHVehicleHullTank
  components:
  - type: Fixtures
    fixtures:
      hull:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.4,-1.85,1.4,1.95"
        density: 1
        layer:
        - MidImpassable
        - HighImpassable

