- type: entity
  parent: DHVehicleWreckBase
  id: DHVehicleWreckTankEmpire
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/tank.rsi
    drawdepth: Mobs
    color: "#5a5a5a"
    layers:
    - state: tank_base
    - state: damaged_frame

# ------------------------------------------------------------------ поддоны сброса (техника Империи)

- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: DHVehicleDropPalletBase
  description: A vehicle packed onto a drop pallet. Clip three parachutes to it and push it overboard from a ship hovering in the atmosphere — it unpacks on landing.
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/weapon.rsi
    layers:
    - state: base
    - state: closed
  - type: InteractionOutline
  - type: Pullable
  - type: DHParadroppable
    requiredParachutes: 3

- type: entity
  parent: DHVehicleDropPalletBase
  id: DHVehicleDropPalletIM30
  name: drop pallet (IM-30 APC)
  components:
  - type: DHDropPallet
    spawn: DHVehicleIM30

- type: entity
  parent: DHVehicleDropPalletBase
  id: DHVehicleDropPalletTankEmpire
  name: drop pallet (Imperial tank)
  components:
  - type: DHDropPallet
    spawn: DHVehicleTankEmpire

# ------------------------------------------------------------------ орудия (сидят в машине, стрелок — в отсеке)

- type: entity
  abstract: true
  id: DHVehicleGunBase
  categories: [ HideSpawnMenu ]
  components:
  - type: DHVehicleGun
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    minAngle: 0
    maxAngle: 2
    angleIncrease: 0
    angleDecay: 10

- type: entity
  parent: DHVehicleGunBase
  id: DHVehicleGunAutocannon30
  name: 30 mm autocannon
  components:
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/flak_fire.ogg
  - type: DHVehicleGun
    muzzleOffset: 2.2
  - type: BasicEntityAmmoProvider
    proto: DHVehicleBullet30mmAP
    capacity: 60
    count: 60
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2

- type: entity
  parent: DHVehicleGunBase
  id: DHVehicleGunHMG
  name: heavy machine gun
  components:
  - type: Gun
    fireRate: 7
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
  - type: DHVehicleGun
    muzzleOffset: 2.2
    turret: false
  - type: BasicEntityAmmoProvider
    proto: DHBullet127x105FMG
    capacity: 200
    count: 200
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.4

- type: entity
  parent: DHVehicleGunBase
  id: DHVehicleGunTankCannon
  name: tank main gun
  components:
  - type: Gun
    fireRate: 0.2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/cannon.ogg
  - type: DHVehicleGun
    muzzleOffset: 2.4
  - type: BasicEntityAmmoProvider
    proto: DHVehicleShellTankAP
    capacity: 24
    count: 24
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 15

- type: entity
  parent: DHVehicleGunBase
  id: DHVehicleGunCoaxMG
  name: coaxial machine gun
  components:
  - type: Gun
    fireRate: 8
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
  - type: DHVehicleGun
    muzzleOffset: 2.2
  - type: BasicEntityAmmoProvider
    proto: DHBullet127x105FMG
    capacity: 250
    count: 250
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.3

# ------------------------------------------------------------------ боеприпасы техники

- type: entity
  parent: DHShipBullet30mmAP
  id: DHVehicleBullet30mmAP
  categories: [ HideSpawnMenu ]
  components:
  - type: DHAntiArmor

- type: entity
  parent: DHShipBullet90mmHE
  id: DHVehicleShellTankAP
  name: tank shell
  categories: [ HideSpawnMenu ]
  components:
  - type: DHAntiArmor

# ------------------------------------------------------------------ отсек

- type: entity
  parent: ChairPilotSeat
  id: DHVehicleSeatPassenger
  name: troop seat
  description: A folding seat bolted to the hull.
  suffix: Vehicle
  categories: [ HideSpawnMenu ]
  components:
  - type: Anchorable
    flags: []
  - type: DHVehicleSeat
    role: Passenger

- type: entity
  parent: DHVehicleSeatPassenger
  id: DHVehicleSeatDriver
  name: driver's seat
  description: Take the controls and the periscopes — you see what is around the vehicle and drive it.
  components:
  - type: DHVehicleSeat
    role: Driver

- type: entity
  parent: DHVehicleSeatPassenger
  id: DHVehicleSeatGunner
  name: gunner's seat
  description: The main gun's sight and controls. Switch to combat mode to fire; the turret follows your aim.
  components:
  - type: DHVehicleSeat
    role: Gunner
    weapon: primary

- type: entity
  parent: DHVehicleSeatPassenger
  id: DHVehicleSeatCommander
  name: commander's seat
  description: The commander's cupola with the machine gun and the smoke discharger controls.
  components:
  - type: DHVehicleSeat
    role: Gunner
    weapon: secondary
    smokeControl: true

- type: entity
  id: DHVehicleHatch
  name: hatch
  description: The way out.
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
