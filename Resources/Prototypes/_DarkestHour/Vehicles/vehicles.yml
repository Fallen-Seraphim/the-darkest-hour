    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/tank.rsi
    state: hatch
    drawdepth: WallTops
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: DHVehicleHatch

- type: dhVehicleInterior
  id: DHInteriorAPC
  size: 7,11
  floor: FloorSteelMono
  entry: 3,8
  entities:
  - { proto: DHVehicleSeatDriver, pos: "2,1" }
  - { proto: DHVehicleSeatGunner, pos: "4,1" }
  - { proto: DHVehicleSeatCommander, pos: "3,2" }
  - { proto: DHVehicleSeatPassenger, pos: "1,4", rot: 90 }
  - { proto: DHVehicleSeatPassenger, pos: "1,5", rot: 90 }
  - { proto: DHVehicleSeatPassenger, pos: "1,6", rot: 90 }
  - { proto: DHVehicleSeatPassenger, pos: "1,7", rot: 90 }
  - { proto: DHVehicleSeatPassenger, pos: "5,4", rot: -90 }
  - { proto: DHVehicleSeatPassenger, pos: "5,5", rot: -90 }
  - { proto: DHVehicleSeatPassenger, pos: "5,6", rot: -90 }
  - { proto: DHVehicleSeatPassenger, pos: "5,7", rot: -90 }
  - { proto: DHVehicleHatch, pos: "3,10" }

- type: dhVehicleInterior
  id: DHInteriorTank
  size: 5,6
  floor: FloorSteelMono
  entry: 2,4
  entities:
  - { proto: DHVehicleSeatDriver, pos: "2,1" }
  - { proto: DHVehicleSeatGunner, pos: "1,2" }
  - { proto: DHVehicleSeatCommander, pos: "3,2" }
  - { proto: DHVehicleSeatPassenger, pos: "3,4", rot: -90 }
  - { proto: DHVehicleHatch, pos: "2,5" }

# ------------------------------------------------------------------ дымовая завеса

- type: entity
  parent: BaseAction
  id: DHActionVehicleSmoke
  name: Smoke screen
  description: Fire the smoke dischargers — a ring of smoke hides the vehicle for a while.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 60
  - type: Sprite
    sprite: Objects/Weapons/Grenades/smoke.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:DHVehicleSmokeActionEvent

- type: entity
  id: DHVehicleSmokeCharge
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnSpawn
  - type: SmokeOnTrigger
    duration: 25
    spreadAmount: 15
  - type: EmitSoundOnTrigger
    sound: /Audio/Items/smoke_grenade_smoke.ogg
    positional: true
  - type: DeleteOnTrigger
