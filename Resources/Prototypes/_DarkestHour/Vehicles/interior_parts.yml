  map: /Maps/_DarkestHour/Vehicles/Interiors/apc.yml
  entryPoint: 1.5,1.5
  light: "#b8b0a0"
  entities:
  - { proto: DHInteriorSeatCommander, at: "2.5,0.5", rot: 90 }
  - { proto: DHVehicleAmmoAutocannon, at: "-1.5,0.5" }
  - { proto: DHVehicleAmmoMG, at: "-0.5,0.5" }

- type: dhVehicleInterior
  id: DHInteriorIM30
  map: /Maps/_DarkestHour/Vehicles/Interiors/apc.yml
  entryPoint: 1.5,1.5
  light: "#b8b0a0"
  entities:
  - { proto: DHInteriorSeatCommander, at: "2.5,0.5", rot: 90 }
  - { proto: DHVehicleAmmoIM30Shell, at: "-1.5,0.5" }
  - { proto: DHVehicleAmmoIM30Shell, at: "-1.4,0.4" }
  - { proto: DHVehicleAmmoMG, at: "-0.5,0.5" }

- type: dhVehicleInterior
  id: DHInteriorHumvee
  map: /Maps/_DarkestHour/Vehicles/Interiors/humvee.yml
  entryPoint: 2.0,-1.7
  light: "#b8b0a0"
  entities:
  - { proto: DHVehicleAmmoMG, at: "2.0,-1.6" }

- type: dhVehicleInterior
  id: DHInteriorTruck
  map: /Maps/_DarkestHour/Vehicles/Interiors/truck.yml
  entryPoint: -2.5,-1.5
  light: "#b8b0a0"
