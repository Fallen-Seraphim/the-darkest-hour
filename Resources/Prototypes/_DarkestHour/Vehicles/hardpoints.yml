# Модули техники (hardpoints), как в CM-SS13 / RMC (решение автора 2026-11-11). Код — DHVehicleServerSystem.Hardpoints.
#  * поставить: модулем по машине (6 с); снять: гаечным ключом — пункт «Снять модуль» в меню машины (6 с);
#  * чинить: включённой сваркой — «Чинить модуль» в меню машины или сваркой по снятому модулю;
#  * каждый модуль получает долю урона по машине (damageShare), броня забирает свою долю на себя (armorAbsorb);
#  * разбитый модуль не работает: без колёс/гусениц машина стоит, орудие молчит, без гранатомётов нет дыма.
# Спрайты — cmss13 через RMC-14 (CC-BY-SA-3.0).

- type: entity
  abstract: true
  parent: BaseItem
  id: DHHardpointBase
  components:
  - type: Item
    size: Huge
  - type: StaticPrice
    price: 1500

# ------------------------------------------------------------------ RAM-45 (БТР Республики)

- type: entity
  parent: DHHardpointBase
  id: DHHardpointRAM45DualCannon
  name: RAM-45 twin autocannon
  description: The RAM-45 turret with a twin 30 mm autocannon.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/hardpoints/apc.rsi
    state: dual_cannon
  - type: DHHardpoint
    slot: Primary
    families: [ RAM45 ]
    maxIntegrity: 350
    integrity: 350
    damageShare: 0.1
    vehicleState: apc_autocannon_0 # на спрайте бывшего IM-30 (sppapc)
    damagedVehicleState: apc_autocannon_1
    gun: DHVehicleGunAutocannon30

- type: entity
  parent: DHHardpointBase
  id: DHHardpointRAM45FrontCannon
  name: RAM-45 bow machine gun
  description: A heavy machine gun in a ball mount on the RAM-45 bow.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/hardpoints/apc.rsi
    state: front_cannon
  - type: DHHardpoint
    slot: Secondary
    families: [ RAM45 ]
    maxIntegrity: 250
    integrity: 250
    damageShare: 0.1
    gun: DHVehicleGunHMG

- type: entity
  parent: DHHardpointBase
  id: DHHardpointRAM45CommsRelay
  name: RAM-45 radio mast
  description: The radio relay mast of the RAM-45.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/hardpoints/apc.rsi
    state: comms_relay
  - type: DHHardpoint
    slot: Support
    families: [ RAM45 ]
    maxIntegrity: 200
    integrity: 200
    damageShare: 0.08

- type: entity
  parent: DHHardpointBase
  id: DHHardpointRAM45Wheels
  name: RAM-45 wheel set
  description: Run-flat wheels and suspension for the RAM-45. Without them the APC goes nowhere.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/hardpoints/apc.rsi
    state: tires
  - type: DHHardpoint
    slot: Wheels
    families: [ RAM45 ]
    maxIntegrity: 500
    integrity: 500
    damageShare: 0.15
    vehicleState: wheels_0
    damagedVehicleState: wheels_1

