# ------------------------------------------------------------------ бортовые пулемёты, посты у портов, действия водителя

# Порт бьёт только в свой борт (сектор 120°). Патроны — ослабленные танковые пулемётные (как у спаренного).
- type: entity
  parent: DHVehicleGunBase
  id: DHVehicleGunPortLeft
  name: firing port machine gun
  components:
  - type: Gun
    fireRate: 6
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
  - type: DHVehicleGun
    muzzleOffset: 1.6
    turret: false
    arc: 120
    arcCenter: 90
  - type: BasicEntityAmmoProvider
    proto: DHVehicleBulletTankMG
    capacity: 150
    count: 150

- type: entity
  parent: DHVehicleGunPortLeft
  id: DHVehicleGunPortRight
  components:
  - type: DHVehicleGun
    muzzleOffset: 1.6
    turret: false
    arc: 120
    arcCenter: -90

- type: entity
  parent: DHVehicleConsoleBase
  id: DHVehicleConsolePortLeft
  name: firing port
  description: A firing port with a machine gun in a ball mount. Sit in the seat next to it and use it; in combat mode you fire out of the port, to this side only.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/apc.rsi
    layers:
    - state: m56_FPW
  - type: PointLight
    enabled: false
  - type: DHVehicleStation
    role: Gunner
    weapon: port_left

- type: entity
  parent: DHVehicleConsolePortLeft
  id: DHVehicleConsolePortRight
  components:
  - type: DHVehicleStation
    role: Gunner
    weapon: port_right

- type: entity
  parent: BaseAction
  id: DHActionVehicleHorn
  name: Horn
  description: Sound the horn.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 3
  - type: Sprite
    sprite: Objects/Fun/bikehorn.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:DHVehicleHornActionEvent

- type: entity
  parent: BaseAction
  id: DHActionVehicleLights
  name: Headlights
  description: Switch the headlights on or off.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1
  - type: Sprite
    sprite: Objects/Tools/flashlight.rsi
    layers:
    - state: flashlight
  - type: InstantAction
    event: !type:DHVehicleLightsActionEvent
