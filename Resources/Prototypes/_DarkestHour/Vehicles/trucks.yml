# Грузовики (решение автора 2026-11-04): по два у каждой стороны. Без вооружения и почти без брони; возят бойцов
# (места в кузове) и груз — ящики затаскивают внутрь (кого/что тащите — заходит с вами); буксируют пехотную пушку
# или зенитку (меню орудия → «Прицепить к грузовику», орудие должно стоять рядом и быть откреплено).
# Республика — на «Терминусе», Империя — по одному в каждом челноке десанта (или сбросом с парашютами).
# Спрайты (решение автора 2026-11-12) — cmss13 через CMU (CC-BY-SA-3.0): Республика — грузовой транспортёр
# (cargo_carrier, thwompa), Империя — «Бизон» (bison), LA-V («Восстание») — бронефургон (throoparmoredtruck, вид
# только сбоку). Вождение — как у БТР (DHGridDrive), но колёсное: рулит только на ходу, быстрее и резче.
# Ключи: грузовикам сторон не нужны, грузовику LA-V — ключ представителя корпорации.

- type: entity
  abstract: true
  parent: DHVehicleBase
  id: DHVehicleTruckBase
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-1,0.8,1"
        density: 2000
        mask:
        - Impassable
        - LowImpassable
        layer:
        - LargeMobLayer
      runover:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.85,-1.05,0.85,1.05"
        hard: false
        mask:
        - MobLayer
  - type: MovementSpeedModifier
    weightlessModifier: 0
    acceleration: 2
    friction: 2
    frictionNoInput: 4
    baseWalkSpeed: 4
    baseSprintSpeed: 6
  # Лёгкая броня: пули берут, но слабо (урон по постройкам ×0.3), обычный урон ÷2; бронебойные и взрывы — полностью.
  - type: DHFortified
    multiplier: 2
    bulletStructuralMultiplier: 0.3
    vehicleClass: Truck
    vehicleIntegrity: 600
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # Колёсное вождение (как у БТР RMC, но легче): на месте не разворачивается.
  - type: DHGridDrive
    maxSpeed: 5
    acceleration: 4
    deceleration: 10
    maxReverseSpeed: 3
    reverseAcceleration: 4
    maxRotationSpeedDegrees: 120
    rotationAccelerationDegrees: 240
    rotationDecelerationDegrees: 300
    alignmentAssistDegrees: 8
    smashDamage: 150
  - type: DHVehicleTow
    distance: 2
  - type: PointLight
    radius: 5
    energy: 1.2
    softness: 2
    autoRot: true
    offset: "0,-1"

- type: entity
  parent: DHVehicleTruckBase
  id: DHVehicleTruckRepublic
  name: Republic army truck
  description: A Republic cargo carrier. Six seats in the back, room for crates, and a tow hitch for an infantry gun or an anti-aircraft gun. Barely armoured.
  components:
  - type: Sprite
    sprite: _DarkestHour/Vehicles/cargo_carrier.rsi
    drawdepth: Mobs
    layers:
    - state: cargo_closed
      map: [ "base" ]
  - type: DHVehicle
    maxIntegrity: 600
    faction: Republic
    hullHalfSize: 0.8,1
    crewZoom: 1.25
    interior: DHInteriorTruck
    hull: DHVehicleHullTruck
    turretLayers: [ ]
    exitOffset: 0,1.7
    wreck: DHVehicleWreckTruck

- type: entity
  parent: DHVehicleTruckBase
  id: DHVehicleTruckEmpire
  name: Imperial army truck
  description: An Imperial "Bison" carrier. Six seats in the back, room for crates, and a tow hitch for an infantry gun. Barely armoured. Rides down in a landing craft or is dropped from the carrier on four parachutes.
  components:
  - type: Sprite
    sprite: _DarkestHour/Vehicles/bison.rsi
    drawdepth: Mobs
    layers:
    - state: base_closed
      map: [ "base" ]
  - type: DHVehicle
    maxIntegrity: 600
    faction: Empire
    hullHalfSize: 0.8,1
    crewZoom: 1.25
    interior: DHInteriorTruck
    hull: DHVehicleHullTruck
    turretLayers: [ ]
    exitOffset: 0,1.7
    wreck: DHVehicleWreckTruckEmpire
  - type: DHParadroppable
    requiredParachutes: 4

# Бронефургон корпорации LA-V («Восстание»): стоит у «Ворот», ключ — только у представителя корпорации.
- type: entity
  parent: DHVehicleTruckBase
  id: DHVehicleTruckLAV
  name: LA-V truck
  description: An armoured LA-V company van. Six seats in the back and room for crates. Only the corporate representative has the key.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.7,-1.3,0.7,1.3"
        density: 2000
        mask:
        - Impassable
        - LowImpassable
        layer:
        - LargeMobLayer
      runover:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.75,-1.35,0.75,1.35"
        hard: false
        mask:
        - MobLayer
  - type: Sprite
    sprite: _DarkestHour/Vehicles/throoparmoredtruck.rsi
    drawdepth: Mobs
    offset: 0.72,0.27
    noRot: true
    layers:
    - state: armored_truck_trr
      map: [ "base" ]
  # Немного крепче армейских: бронефургон.
  - type: DHFortified
    multiplier: 3
    bulletStructuralMultiplier: 0.2
    vehicleClass: Truck
    vehicleIntegrity: 800
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DHVehicle
    maxIntegrity: 800
    faction: Republic
    hullHalfSize: 0.7,1.3
    crewZoom: 1.25
    interior: DHInteriorTruck
    hull: DHVehicleHullTruckLAV
    turretLayers: [ ]
    exitOffset: 0,1.9
    wreck: DHVehicleWreckTruckLAV
    key: LAV
    sideView: true

- type: entity
  parent: DHVehicleHullBase
  id: DHVehicleHullTruck
  components:
  - type: Fixtures
    fixtures:
      hull:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-1,0.8,1"
        density: 1
        layer:
        - MidImpassable
        - HighImpassable

- type: entity
  parent: DHVehicleHullBase
  id: DHVehicleHullTruckLAV
  components:
  - type: Fixtures
    fixtures:
      hull:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.7,-1.3,0.7,1.3"
        density: 1
        layer:
        - MidImpassable
        - HighImpassable

- type: entity
  parent: DHVehicleWreckBase
  id: DHVehicleWreckTruck
  name: burnt-out truck
  description: What is left of a truck. Nothing to salvage but cover.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.75,-0.95,0.75,0.95"
        density: 5000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: Sprite
    sprite: _DarkestHour/Vehicles/cargo_carrier.rsi
    drawdepth: Mobs
    color: "#5a5a5a"
    layers:
    - state: cargo_closed

- type: entity
  parent: DHVehicleWreckTruck
  id: DHVehicleWreckTruckEmpire
  components:
  - type: Sprite
    sprite: _DarkestHour/Vehicles/bison.rsi
    drawdepth: Mobs
    color: "#ffffff"
    layers:
    - state: base_closed_damaged

- type: entity
  parent: DHVehicleWreckTruck
  id: DHVehicleWreckTruckLAV
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.65,-1.25,0.65,1.25"
        density: 5000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: Sprite
    sprite: _DarkestHour/Vehicles/throoparmoredtruck.rsi
    drawdepth: Mobs
    color: "#5a5a5a"
    offset: 0.72,0.27
    noRot: true
    layers:
    - state: armored_truck_trr

# Кузов: кабина водителя спереди, по три места вдоль бортов, у заднего борта — место под ящики, люк сзади.
- type: dhVehicleInterior
  id: DHInteriorTruck
  size: 5,9
  floor: FloorSteelMono
  entry: 2,7
  entities:
  - { proto: DHVehicleViewport, pos: "2,0", onWall: true }
  - { proto: DHVehicleConsoleDriver, pos: "1,1", rot: 180 }
  - { proto: DHVehicleTacticalMap, pos: "3,1" }
  - { proto: DHVehicleSeatCrew, pos: "1,2" }
  - { proto: DHVehicleInteriorLight, pos: "2,2" }
  - { proto: DHVehicleSeatPassenger, pos: "1,3", rot: 90 }
  - { proto: DHVehicleSeatPassenger, pos: "1,4", rot: 90 }
  - { proto: DHVehicleSeatPassenger, pos: "1,5", rot: 90 }
  - { proto: DHVehicleSeatPassenger, pos: "3,3", rot: -90 }
  - { proto: DHVehicleSeatPassenger, pos: "3,4", rot: -90 }
  - { proto: DHVehicleSeatPassenger, pos: "3,5", rot: -90 }
  - { proto: DHVehicleHatch, pos: "2,8" }
