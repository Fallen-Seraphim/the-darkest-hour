# Грузовики (решение автора 2026-11-04): по два у каждой стороны. Без вооружения и почти без брони; возят бойцов
# (места в кузове) и груз — ящики затаскивают внутрь (кого/что тащите — заходит с вами); буксируют пехотную пушку
# или зенитку (меню орудия → «Прицепить к грузовику», орудие должно стоять рядом и быть откреплено).
# Республика — на «Терминусе», Империя — по одному в каждом челноке десанта (или сбросом с парашютами).
# Спрайт — RMC-14 (vehicles2.rsi, CC-BY-SA-3.0): вид сбоку во всех направлениях.

- type: entity
  abstract: true
  parent: DHVehicleBase
  id: DHVehicleTruckBase
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.9,-0.9,0.9,0.9"
        density: 2000
        mask:
        - Impassable
        - LowImpassable
        layer:
        - LargeMobLayer
      runover:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.95,-0.95,0.95,0.95"
        hard: false
        mask:
        - MobLayer
  - type: MovementSpeedModifier
    weightlessModifier: 0
    acceleration: 2
    friction: 2
    frictionNoInput: 4
    baseWalkSpeed: 4
    baseSprintSpeed: 6
  # Лёгкая броня: пули берут, но слабо (урон по постройкам ×0.3), обычный урон ÷2; бронебойные и взрывы — полностью.
  - type: DHFortified
    multiplier: 2
    bulletStructuralMultiplier: 0.3
    vehicleClass: Truck
    vehicleIntegrity: 600
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/vehicles2.rsi
    drawdepth: Mobs
    layers:
    - state: crawler_covered_bed
      map: [ "base" ]
  - type: DHVehicleTow
    distance: 2
  - type: PointLight
    radius: 5
    energy: 1.2
    softness: 2
    autoRot: true
    offset: "0,-1"

- type: entity
  parent: DHVehicleTruckBase
  id: DHVehicleTruckRepublic
  name: Republic army truck
  description: A tracked Republic cargo carrier. Six seats in the back, room for crates, and a tow hitch for an infantry gun or an anti-aircraft gun. Barely armoured.
  components:
  - type: DHVehicle
    maxIntegrity: 600
    faction: Republic
    hullHalfSize: 0.9,0.9
    crewZoom: 1.25
    interior: DHInteriorTruck
    hull: DHVehicleHullTruck
    turretLayers: [ ]
    exitOffset: 0,1.6
    wreck: DHVehicleWreckTruck

- type: entity
  parent: DHVehicleTruckBase
  id: DHVehicleTruckEmpire
  name: Imperial army truck
  description: A tracked Imperial cargo carrier. Six seats in the back, room for crates, and a tow hitch for an infantry gun. Barely armoured. Rides down in a landing craft or is dropped from the carrier on four parachutes.
  components:
  - type: Sprite
    layers:
    - state: crawler_covered_bed
      map: [ "base" ]
      color: "#b9b4aa"
  - type: DHVehicle
    maxIntegrity: 600
    faction: Empire
    hullHalfSize: 0.9,0.9
    crewZoom: 1.25
    interior: DHInteriorTruck
    hull: DHVehicleHullTruck
    turretLayers: [ ]
    exitOffset: 0,1.6
    wreck: DHVehicleWreckTruck
  - type: DHParadroppable
    requiredParachutes: 4

- type: entity
  parent: DHVehicleHullBase
  id: DHVehicleHullTruck
  components:
  - type: Fixtures
    fixtures:
      hull:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.9,-0.9,0.9,0.9"
        density: 1
        layer:
        - MidImpassable
        - HighImpassable

- type: entity
  parent: DHVehicleWreckBase
  id: DHVehicleWreckTruck
  name: burnt-out truck
  description: What is left of a truck. Nothing to salvage but cover.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.85,-0.85,0.85,0.85"
        density: 5000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/vehicles2.rsi
    drawdepth: Mobs
    color: "#5a5a5a"
    layers:
    - state: crawler_covered_bed

# Кузов: кабина водителя спереди, по три места вдоль бортов, у заднего борта — место под ящики, люк сзади.
- type: dhVehicleInterior
  id: DHInteriorTruck
  size: 5,9
  floor: FloorSteelMono
  entry: 2,7
  entities:
  - { proto: DHVehicleViewport, pos: "2,0", onWall: true }
  - { proto: DHVehicleConsoleDriver, pos: "1,1", rot: 180 }
  - { proto: DHVehicleTacticalMap, pos: "3,1" }
  - { proto: DHVehicleSeatCrew, pos: "1,2" }
  - { proto: DHVehicleInteriorLight, pos: "2,2" }
  - { proto: DHVehicleSeatPassenger, pos: "1,3", rot: 90 }
  - { proto: DHVehicleSeatPassenger, pos: "1,4", rot: 90 }
  - { proto: DHVehicleSeatPassenger, pos: "1,5", rot: 90 }
  - { proto: DHVehicleSeatPassenger, pos: "3,3", rot: -90 }
  - { proto: DHVehicleSeatPassenger, pos: "3,4", rot: -90 }
  - { proto: DHVehicleSeatPassenger, pos: "3,5", rot: -90 }
  - { proto: DHVehicleHatch, pos: "2,8" }
