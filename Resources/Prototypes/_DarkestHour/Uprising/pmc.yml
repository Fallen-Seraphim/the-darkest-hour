    state: icon
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/PMC/commando_alt.rsi
  - type: DHPartArmor
    parts: [ Head ]
    armorClass: 2

- type: entity
  parent: DHLAVPmcClothingHeadHelmetBase
  id: DHLAVPmcClothingHeadHelmetHeavy
  name: LA-V PMC heavy helmet
  description: A heavy sealed helmet with a built-in gas mask. Class 3 protection for the head. Takes the mask slot too.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/PMC/heavy.rsi
    state: icon
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/PMC/heavy.rsi
  - type: DHPartArmor
    parts: [ Head ]
    armorClass: 3

- type: entity
  parent: DHLAVPmcClothingHeadHelmetBase
