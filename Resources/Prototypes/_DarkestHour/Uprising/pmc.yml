    sprite: _RMC14/Objects/Clothing/Head/PMC/helmet.rsi
    state: icon
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/PMC/helmet.rsi
  - type: DHPartArmor
    parts: [ Head ]
    armorClass: 2

- type: entity
