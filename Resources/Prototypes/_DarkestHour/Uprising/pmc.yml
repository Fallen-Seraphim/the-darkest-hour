# ЧВК LA-V (решение автора 2026-11-06): отряд из четырёх бойцов — командир, медик, специалист, стрелок — прилетает
# бортом «Аэронавтики» на ЗП-1 по вызову администрации (dhcalllavpmc, кнопка в админ-панели). Задача — вывезти
# представителя LA-V любой ценой, остальных — по возможности. Броня немодульная, но закрывает все конечности
# (DHPartArmor.classes): лёгкая K1 — торс 2, конечности 1; тяжёлая K3 — торс 3, конечности 2. Шлемы — со встроенным
# противогазом, занимают и слот маски. Спрайты — ЧВК Вейланд-Ютани из RMC-14 (CC-BY-SA), копирует rmc_skins.py.

# ---------------------------------------------------------------- форма

- type: entity
  parent: ClothingUniformBase
  id: DHLAVPmcClothingUniform
  name: LA-V PMC fatigues
  description: Grey combat fatigues of the Lost Angels—Vanguard private military contractors.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/PMC/standard.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Uniforms/PMC/standard.rsi

- type: entity
  parent: ClothingUniformBase
  id: DHLAVPmcClothingUniformCommander
  name: LA-V PMC commander fatigues
  description: Fatigues of an LA-V contractor team leader.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/PMC/officer.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Uniforms/PMC/officer.rsi

- type: entity
  parent: ClothingUniformBase
  id: DHLAVPmcClothingUniformSpecialist
  name: LA-V PMC specialist fatigues
  description: Dark fatigues of an LA-V contractor specialist.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/PMC/commando.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Uniforms/PMC/commando.rsi

# ---------------------------------------------------------------- броня

- type: entity
  abstract: true
  parent: DHClothingOuterVestBase
  id: DHLAVPmcClothingOuterArmorBase
  components:
  - type: Item
    size: Huge
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: StaticPrice
    price: 3000

- type: entity
  parent: DHLAVPmcClothingOuterArmorBase
  id: DHLAVPmcClothingOuterArmorLight
  name: LA-V K1 combat armour
  description: Non-modular corporate combat armour with plates over the chest, arms and legs. Class 2 for the torso, class 1 for the limbs.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/PMC/pmc.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/PMC/pmc.rsi
  - type: DHPartArmor
    classes:
      Torso: 2
      ArmLeft: 1
      ArmRight: 1
      LegLeft: 1
      LegRight: 1
  - type: ClothingSpeedModifier
    walkModifier: 0.97
    sprintModifier: 0.97
  - type: HeldSpeedModifier

- type: entity
  parent: DHLAVPmcClothingOuterArmorBase
  id: DHLAVPmcClothingOuterArmorHeavy
  name: LA-V K3 heavy armour
  description: Heavy non-modular corporate armour covering the whole body. Class 3 for the torso, class 2 for the limbs.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/PMC/commando.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/PMC/commando.rsi
  - type: DHPartArmor
    classes:
      Torso: 3
      ArmLeft: 2
      ArmRight: 2
      LegLeft: 2
      LegRight: 2
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier

# ---------------------------------------------------------------- шлемы со встроенным противогазом

- type: entity
  abstract: true
  parent: [ ClothingHeadBase, TemperatureProtection ]
  id: DHLAVPmcClothingHeadHelmetBase
  components:
  - type: Clothing
    quickEquip: false
    slots: [ HEAD ]
  - type: BreathMask
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: DHBioProtection
    airborne: 0.6
  # Встроенный противогаз: шлем занимает и слот маски.
  - type: DHIntegratedMask
  - type: SlotBlock
    slots: [ MASK ]
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
    - FacialHair
  - type: Tag
    tags:
    - WhitelistChameleon

- type: entity
  parent: DHLAVPmcClothingHeadHelmetBase
  id: DHLAVPmcClothingHeadHelmet
  name: LA-V PMC helmet
  description: A sealed corporate combat helmet with a built-in gas mask. Class 2 protection for the head. Takes the mask slot too.
  components:
