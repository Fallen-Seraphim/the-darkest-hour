    visible: false

- type: entity
  parent: DHBombTargetBase
  id: DHBombTargetTransformer
  name: bomb target (transformer)
  components:
  - type: DHBombTarget
    targetName: dh-bomb-target-transformer
    radius: 4

- type: entity
  parent: DHBombTargetBase
  id: DHBombTargetMetro
  name: bomb target (metro)
  components:
  - type: DHBombTarget
    targetName: dh-bomb-target-metro
    radius: 7

- type: entity
  parent: DHBombTargetBase
  id: DHBombTargetClinic
  name: bomb target (clinic)
  components:
  - type: DHBombTarget
    targetName: dh-bomb-target-clinic
    radius: 7

- type: entity
  parent: DHBombTargetBase
  id: DHBombTargetLAVOffice
  name: bomb target (LA-V office)
  components:
  - type: DHBombTarget
    targetName: dh-bomb-target-lav-office
    radius: 7

- type: entity
  parent: DHBombTargetBase
  id: DHBombTargetLAVWarehouse
  name: bomb target (LA-V warehouse)
  components:
  - type: DHBombTarget
    targetName: dh-bomb-target-lav-warehouse
