- type: entity
  id: DHFrontLair
  name: LFFC lair marker
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: DHFrontLair
    radius: 5
  - type: Sprite
    sprite: Markers/cross.rsi
    state: pink
    visible: false
