# Компьютер склада LA-V: заказ за деньги корпорации, лифт рядом.
- type: entity
  parent: DHComputerSupply
  id: DHComputerSupplyLAV
  name: LA-V warehouse console
  description: "Orders goods from the LA-V logistics hub. Paid from the corporate account; the freight lift brings them up."
  suffix: LA-V
  components:
  - type: DHSupplyConsole
    catalog: DHSupplyLAV
  - type: AccessReader
    access: [["DHLAVanguard"]]
  - type: ApcPowerReceiver
    needsPower: false
