# DarkestHour: RMC-образная одежда Лост-Энджелса (решение автора 2026-11-05) — гражданские колонисты RMC-14 и
# патрульная форма Военной Полиции в духе военной полиции USCM. Спрайты — RMC-14 (CC-BY-SA-3.0), копируются
# Tools/_DarkestHour/rmc_skins.py.

# --- Военная Полиция: патруль ---

- type: entity
  parent: ClothingUniformBase
  id: DHLAMPClothingUniformPatrol
  name: Military Police patrol fatigues
  description: "Field fatigues with the red armband of the Republic Military Police."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Uniforms/MP/standard.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Uniforms/MP/standard.rsi

- type: entity
  parent: ClothingHeadBase
  id: DHLAMPClothingHeadHelmetPatrol
  name: Military Police patrol helmet
  description: "A combat helmet with the Military Police markings. Class 2 protection for the head."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/Helmets/m10/mp.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/Helmets/m10/mp.rsi
  - type: DHPartArmor
    parts: [ Head ]
    armorClass: 2

- type: entity
  parent: ClothingHeadBase
  id: DHLAMPClothingHeadCapPatrol
  name: Military Police cap
  description: "A peaked cap of the Military Police. No protection."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/Hats/mp_cap.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/Hats/mp_cap.rsi

- type: entity
  parent: DHClothingOuterVestBase
  id: DHLAMPClothingOuterVestPatrol
  name: Military Police patrol armour
  description: "Light body armour of the Military Police patrols. Class 2 protection for the torso only."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/Armor/m2/mp.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/Armor/m2/mp.rsi
  - type: DHPartArmor
    parts: [ Torso ]
    armorClass: 2

