    - id: DHMagazineLAVR90LM
      amount: 3
    - id: DHMagazineLAVR90LAP
    - id: DHWeaponSMGLAVSMG23
    - id: DHMagazineLAVSMG23LS
      amount: 3
    - id: DHMagazineLAVR55LAP
      amount: 3
    - id: DHAttachmentKitMarksman
    - id: DHAttachmentKitClose
    - id: DHAttachmentKitRifle
      amount: 2
