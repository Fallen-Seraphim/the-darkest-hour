# ---------------------------------------------------------------- документы ОФСК (решение автора 2026-11-12)
# Свои жетоны с должностью ОФСК (в слоте документа) и поддельный паспорт жителя на настоящее имя — в сумке, чтобы
# сменить жетоны на паспорт и сойти за мирного. Паспорт заполняется при появлении (DHCitySystem.FillPassport).

- type: entity
  parent: DHDogtags
  id: DHLFDogtags
  name: LFFC dog tags
  description: Dog tags of a fighter of the Liberation Front's combat squads. The squad position is stamped on them.
  suffix: LFFC

- type: entity
  parent: DHLFDogtags
  id: DHLFDogtagsLeader
  suffix: LFFC squad leader
  components:
  - type: PresetIdCard
    job: DHLAFrontLeader

- type: entity
  parent: DHLFDogtags
  id: DHLFDogtagsSaboteur
  suffix: LFFC saboteur
  components:
  - type: PresetIdCard
    job: DHLAFrontSaboteur

- type: entity
  parent: DHLFDogtags
  id: DHLFDogtagsSpecialist
  suffix: LFFC specialist
  components:
  - type: PresetIdCard
    job: DHLAFrontSpecialist

- type: entity
  parent: DHLFDogtags
  id: DHLFDogtagsMachinegunner
  suffix: LFFC machinegunner
  components:
  - type: PresetIdCard
    job: DHLAFrontMachinegunner

- type: entity
  parent: DHLFDogtags
  id: DHLFDogtagsRebel
  suffix: LFFC rebel
  components:
  - type: PresetIdCard
    job: DHLAFrontRebel

# Поддельный паспорт: как настоящий паспорт жителя, выписан на настоящее имя бойца.
- type: entity
  parent: DHLAIDCardResident
  id: DHLFPassportForged
  suffix: Forged, LFFC
  components:
  - type: DHPassport
    forged: true

