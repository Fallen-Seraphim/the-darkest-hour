# «Восстание»: удостоверения и стартовое снаряжение должностей (Uprising/jobs.yml).
# Мирные — гражданская одежда без оружия. LA-V — одежда корпорации (Uprising/clothing.yml).
# Военпол и ОФСК — ВРЕМЕННОЕ снаряжение до решения автора (сказал: «про экипировку позже»).

- type: entity
  parent: IDCardStandard
  id: DHLAIDCardBase
  name: Lost Angels ID card
  description: A Republican citizen card of Lost Angels.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
    state: default

