# Облачко брызг на человеке при попадании (по направлению пули), красится в цвет крови.
- type: entity
  id: DHBloodImpactEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _DarkestHour/Effects/blood_impact.rsi
    state: cmubloodsplatter1
    drawdepth: Effects
    noRot: false
  - type: TimedDespawn
    lifetime: 0.4
