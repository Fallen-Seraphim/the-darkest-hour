- type: soundCollection
  id: DHImpactGlass
  files:
  - /Audio/_DarkestHour/Impacts/hit_on_shattered_glass.ogg

# Брызги крови на полу (белые спрайты CMU, красятся в цвет крови; смываются как обычные пятна).
- type: decal
  id: DHBloodSplatter1
  tags: [ "dh-blood" ]
  showMenu: false
  defaultCleanable: true
  defaultCustomColor: true
  sprite:
    sprite: _DarkestHour/Effects/blood_splatter.rsi
