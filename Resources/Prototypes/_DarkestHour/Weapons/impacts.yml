# Звуки попаданий пуль по материалам и по броне, брызги крови (план осады п. 15, решения автора 2026-11-20).
# Механика — DHImpactSystem. Звуки — cmss13 через RMC-14 и CMU (CC-BY-SA-3.0); металл и броня — звуки от автора (RMC-14).

- type: soundCollection
  id: DHImpactFlesh
  files:
  - /Audio/_DarkestHour/Impacts/impact_flesh_1.ogg
  - /Audio/_DarkestHour/Impacts/impact_flesh_2.ogg
  - /Audio/_DarkestHour/Impacts/impact_flesh_3.ogg
  - /Audio/_DarkestHour/Impacts/impact_flesh_4.ogg
  - /Audio/_DarkestHour/Impacts/impact_flesh_5.ogg # пробитие (звук от автора, 2026-11-26)

# Броня не пробита: пуля бьёт о пластину. Металл, броня и металлические стены — одни звуки (от автора, 2026-11-26).
- type: soundCollection
  id: DHImpactArmor
  files:
  - /Audio/_DarkestHour/Impacts/impact_metal_bullet.ogg
  - /Audio/_DarkestHour/Impacts/impact_metal_thud.ogg
  - /Audio/_DarkestHour/Impacts/impact_metal_strike.ogg

- type: soundCollection
