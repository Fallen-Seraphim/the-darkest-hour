# DarkestHour: Metallistick Group corporate security weapons (ported from Monolith, own sprites).
- type: entity
  id: DHCrateSecurityVympel
  parent: CrateWeaponSecure
  name: Vympel carbine crate
  description: Two Vympel 5.56x45mm bullpup carbines with four spare magazines. Requires armory access to open.
  components:
  - type: StorageFill
    contents:
    - id: DHWeaponRifleVympel
      amount: 2
    - id: DHMagazine556x45FMG
      amount: 4

- type: entity
  id: DHCrateSecurityWSPR
  parent: CrateWeaponSecure
  name: WSPR rifle crate
  description: Two integrally suppressed WSPR 9x51mm rifles with four spare magazines of subsonic DZ rounds. Requires armory access to open.
  components:
  - type: StorageFill
    contents:
    - id: DHWeaponRifleWSPR
      amount: 2
    - id: DHMagazine9x51DZ
      amount: 4

