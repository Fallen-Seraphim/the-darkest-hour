  components:
  - type: StorageFill
    contents:
    - id: DHAmmoBox9x51DZ
      amount: 2
    - id: DHAmmoBox9x51EB
    - id: DHAmmoBox9x51FMG

- type: entity
  id: DHCrateSecurityAttachments
  parent: CrateWeaponSecure
  name: weapon attachments crate
  description: Suppressors, grips and optics for station weapons. Requires armory access to open.
  components:
  - type: StorageFill
    contents:
    - id: DHAttachmentSuppressor
      amount: 2
    - id: DHAttachmentFlashHider
    - id: DHAttachmentCompensator
    - id: DHAttachmentVerticalGrip
    - id: DHAttachmentAngledGrip
    - id: DHAttachmentOptic2x
      amount: 2
    - id: DHAttachmentOptic4x
