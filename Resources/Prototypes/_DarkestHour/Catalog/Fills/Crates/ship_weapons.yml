  components:
  - type: StorageFill
    contents:
    - id: DHShipShell155mmAP
      amount: 2
    - id: DHShipShell155mmHE
      amount: 2

- type: entity
  id: DHCrateShipShells220mm
  parent: CrateWeaponSecure
  name: 220mm shell crate
