# Соединённая Республика: точки появления призраков отряда зачистки (ставятся на шаттл RAC Cordon).

- type: entity
  id: DHSpawnerRepublicCommander
  name: Republic sweep commander
  suffix: Ghost role
  components:
  - type: Sprite
    layers:
    - sprite: _DarkestHour/Clothing/OuterClothing/ModularArmor/rmb1_body.rsi
      state: icon
    - sprite: _DarkestHour/Objects/Weapons/Guns/rar_m11_2.rsi
      state: icon
      scale: 0.75, 0.75
  - type: RandomHumanoidSpawner
    settings: DHRepublicCommander

- type: randomHumanoidSettings
  id: DHRepublicCommander
  parent: EventHumanoidCentcomm
  components:
  - type: GhostRole
    name: dh-ghost-role-republic-commander-name
    description: dh-ghost-role-republic-commander-desc
    rules: dh-ghost-role-republic-rules
    raffle:
      settings: short
    job: DHRepublicCommander
  - type: Loadout
    prototypes: [ DHRepublicCommanderGear ]
    roleLoadout: [ RoleSurvivalMilitaryDouble ]
  - type: RandomMetadata
    nameSegments:
    - NamesMilitaryLast
    nameFormat: dh-name-format-republic-commander

