# DarkestHour: свои должности. Снаряжение и лоадауты пока взяты у ванильных аналогов, форма — ванильная.

- type: job
  id: DHCaptain
  name: dh-job-captain-name
  description: dh-job-captain-description
  playTimeTracker: JobDHCaptain
  startingGear: DHCaptainGear
  icon: JobIconDHCaptain
  supervisors: dh-job-supervisors-metallistick
  joinNotifyCrew: true
  guides: [ Command ]
  accessGroups:
  - AllAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff

- type: startingGear
  id: DHCaptainGear
  equipment:
    shoes: ClothingShoesBootsLaceup
    eyes: ClothingEyesGlassesCommand
    gloves: ClothingHandsGlovesCaptain
    id: DHDogtags
    ears: ClothingHeadsetAltCommand
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: DHCaptainChameleonOutfit
  job: DHCaptain
  hasMindShield: true
  equipment:
    head: ClothingHeadHatCapcap
    eyes: ClothingEyesGlassesCommand
    mask: ClothingMaskGasCaptain
    neck: ClothingNeckCloakCap

