# DarkestHour: свои должности. Снаряжение и лоадауты пока взяты у ванильных аналогов, форма — ванильная.

- type: job
  id: DHChiefPhysician
  name: dh-job-chief-physician-name
  description: dh-job-chief-physician-description
  playTimeTracker: JobDHChiefPhysician
  startingGear: DHChiefPhysicianGear
  icon: JobIconDHChiefPhysician
  supervisors: dh-job-supervisors-captain
  guides: [ Command ]
  access:
  - Medical
  - Command
  - Maintenance
  - Chemistry
  - ChiefMedicalOfficer
  - Brig
  - Cryogenics
  special:
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff

- type: startingGear
  id: DHChiefPhysicianGear
  equipment:
    id: DHDogtags
    ears: ClothingHeadsetCMO
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: DHChiefPhysicianChameleonOutfit
  job: DHChiefPhysician
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretCmo
    eyes: ClothingEyesHudMedical
    mask: ClothingMaskSterile
    neck: ClothingCloakCmo
    outerClothing: ClothingOuterCoatLabCmo
    gloves: ClothingHandsGlovesNitrile

