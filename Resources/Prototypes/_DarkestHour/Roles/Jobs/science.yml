# DarkestHour: свои должности. Снаряжение и лоадауты пока взяты у ванильных аналогов, форма — ванильная.

- type: job
  id: DHResearchDirector
  name: dh-job-research-director-name
  description: dh-job-research-director-description
  playTimeTracker: JobDHResearchDirector
  startingGear: DHResearchDirectorGear
  icon: JobIconDHResearchDirector
  supervisors: dh-job-supervisors-captain
  guides: [ Command ]
  access:
  - Research
  - Command
  - Maintenance
  - ResearchDirector
  - Brig
  - Cryogenics
  special:
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff

- type: startingGear
  id: DHResearchDirectorGear
  equipment:
    id: DHDogtags
    ears: ClothingHeadsetRD
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: DHResearchDirectorChameleonOutfit
  job: DHResearchDirector
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretRND
    eyes: ClothingEyesGlasses
    mask: ClothingMaskGas
    neck: ClothingNeckCloakRd
    outerClothing: ClothingOuterCoatRD
    gloves: ClothingHandsGlovesColorPurple

