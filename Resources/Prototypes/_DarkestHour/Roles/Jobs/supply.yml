# DarkestHour: свои должности. Снаряжение и лоадауты пока взяты у ванильных аналогов, форма — ванильная.

- type: job
  id: DHQuartermaster
  name: dh-job-quartermaster-name
  description: dh-job-quartermaster-description
  playTimeTracker: JobDHQuartermaster
  startingGear: DHQuartermasterGear
  icon: JobIconDHQuartermaster
  supervisors: dh-job-supervisors-captain
  guides: [ Command ]
  access:
  - Cargo
  - Salvage
  - Quartermaster
  - Maintenance
  - External
  - Command
  - Brig
  - Cryogenics
  special:
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff

- type: startingGear
  id: DHQuartermasterGear
  equipment:
    id: DHDogtags
    ears: ClothingHeadsetQM
    belt: BoxFolderClipboardThreePapers
    pocket1: AppraisalTool
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: DHQuartermasterChameleonOutfit
  job: DHQuartermaster
  hasMindShield: true
  equipment:
    head: ClothingHeadHatQMsoft
    eyes: ClothingEyesGlassesSunglasses
    mask: ClothingMaskBreath
    outerClothing: ClothingOuterWinterQM
    neck: ClothingNeckCloakQm
    gloves: ClothingHandsKnuckleDustersQM

