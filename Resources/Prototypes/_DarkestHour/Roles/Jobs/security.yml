# DarkestHour: свои должности. Снаряжение и лоадауты пока взяты у ванильных аналогов, форма — ванильная.

- type: job
  id: DHSecurityChief
  name: dh-job-security-chief-name
  description: dh-job-security-chief-description
  playTimeTracker: JobDHSecurityChief
  startingGear: DHSecurityChiefGear
  icon: JobIconDHSecurityChief
  supervisors: dh-job-supervisors-captain
  guides: [ Command ]
  access:
  - HeadOfSecurity
  - Command
  - Brig
  - Security
  - Armory
  - Maintenance
  - External
  - Detective
  - Cryogenics
  - GenpopEnter
  - GenpopLeave
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff

- type: startingGear
  id: DHSecurityChiefGear
  equipment:
    eyes: ClothingEyesGlassesSecurity
    id: DHDogtags
    gloves: ClothingHandsGlovesCombat
    ears: DHClothingHeadsetAltSecurityChief
    pocket1: WeaponPistolMk58
  storage:
    back:
    - Flash
    - DHMagazine10x24ShortE

- type: chameleonOutfit
  id: DHSecurityChiefChameleonOutfit
  job: DHSecurityChief
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretHoS
    mask: ClothingMaskGasSecurity
    neck: ClothingNeckCloakHos

