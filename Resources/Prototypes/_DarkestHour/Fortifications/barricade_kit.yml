- type: entity
  parent: DHBarricadePlasteel
  id: DHBarricadePlasteelBiohazard
  suffix: Biohazard
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: plasteel
    - sprite: _RMC14/Structures/Walls/Barricades/burn_barricade_cracks.rsi
