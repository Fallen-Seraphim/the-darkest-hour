# Складные баррикады и улучшения металлических баррикад — порт RMC-14 / CM-SS13 (решение автора 2026-11-12).
# Спрайты RMC-14 (CC-BY-SA-3.0, из cmss13).

- type: damageModifierSet
  id: DHBarricadeFolding
  coefficients:
    Heat: 0.85
    Shock: 0.85
    Cold: 0.85
    Caustic: 0.85

- type: damageModifierSet
  id: DHBarricadeBiohazard
  coefficients:
    Heat: 0.75
    Shock: 0.75
    Cold: 0.75
    Caustic: 0.75

- type: damageModifierSet
  id: DHBarricadeReinforced
  coefficients:
    Blunt: 0.75
    Slash: 0.75
    Piercing: 0.75

# --- Улучшенные баррикады: стальная и пласталевая × композит / биозащита / усиление ---

- type: entity
  parent: DHBarricadeMetal
  id: DHBarricadeMetalComposite
  suffix: Composite
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: metal
    - sprite: _RMC14/Structures/Walls/Barricades/explosive_barricade_cracks.rsi
      state: AdditionalDamageOverlay_0
    - state: metal_wire
      map: [ "wire" ]
      visible: false
    drawdepth: WallTops
  - type: DHBarricadeUpgradeable
    upgrades: []
  - type: DHBarricadeUpgraded
    base: DHBarricadeMetal
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: DHBarricade
    blockChance: 0.8

- type: entity
  parent: DHBarricadeMetal
  id: DHBarricadeMetalBiohazard
  suffix: Biohazard
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: metal
    - sprite: _RMC14/Structures/Walls/Barricades/burn_barricade_cracks.rsi
      state: AdditionalDamageOverlay_0
    - state: metal_wire
      map: [ "wire" ]
      visible: false
    drawdepth: WallTops
  - type: DHBarricadeUpgradeable
    upgrades: []
  - type: DHBarricadeUpgraded
    base: DHBarricadeMetal
  - type: Damageable
    damageModifierSet: DHBarricadeBiohazard

- type: entity
  parent: DHBarricadeMetal
  id: DHBarricadeMetalReinforced
  suffix: Reinforced
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: metal
    - sprite: _RMC14/Structures/Walls/Barricades/brute_barricade_cracks.rsi
      state: AdditionalDamageOverlay_0
    - state: metal_wire
      map: [ "wire" ]
      visible: false
    drawdepth: WallTops
  - type: DHBarricadeUpgradeable
    upgrades: []
  - type: DHBarricadeUpgraded
    base: DHBarricadeMetal
  - type: Damageable
    damageModifierSet: DHBarricadeReinforced

- type: entity
