# Полевые укрепления «Штурма» по образцу RMC-14: мешки с песком и палатки. Механика — DHFortificationSystem,
# укрытие за баррикадами — DHBarricadeCoverSystem. Спрайты — RMC-14 (cmss13, CC-BY-SA-3.0/4.0, см. meta.json).

# --- Мешки с песком ---

- type: stack
  parent: BaseMediumStack
  id: DHSandbagsEmpty
  name: dh-stack-sandbags-empty
  icon: { sprite: "/Textures/_RMC14/Objects/Misc/sandbags.rsi", state: sandbag_stack }
  spawn: DHSandbagsEmpty

- type: stack
  parent: BaseMediumStack
  id: DHSandbagsFull
  name: dh-stack-sandbags-full
  icon: { sprite: "/Textures/_RMC14/Objects/Misc/sandbags.rsi", state: sandbag_pile }
  spawn: DHSandbagsFull

- type: entity
  parent: BaseItem
  id: DHSandbagsEmpty
  name: empty sandbags
  description: Empty sandbags. Fill them with a shovel while standing on bare ground.
  components:
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Misc/sandbags.rsi
    inhandVisuals:
      left:
      - state: stack-inhand-left
      right:
      - state: stack-inhand-right
  - type: Sprite
    sprite: _RMC14/Objects/Misc/sandbags.rsi
    state: sandbag_stack
  - type: Stack
    stackType: DHSandbagsEmpty
    count: 1
  - type: DHSandbagsEmpty

- type: entity
  parent: DHSandbagsEmpty
  id: DHSandbagsEmpty25
  suffix: "25"
  components:
  - type: Stack
    stackType: DHSandbagsEmpty
    count: 25

- type: entity
  parent: BaseItem
  id: DHSandbagsFull
  name: sandbags
  description: Bags filled with sand. Use them in hand to build a barricade facing where you look (five bags).
  components:
  - type: Item
    size: Large
    sprite: _RMC14/Objects/Misc/sandbags.rsi
    inhandVisuals:
      left:
      - state: pile-inhand-left
      right:
      - state: pile-inhand-right
  - type: Sprite
    sprite: _RMC14/Objects/Misc/sandbags.rsi
    state: sandbag_pile
  - type: Stack
    stackType: DHSandbagsFull
    count: 1
  - type: DHSandbagsFull

- type: entity
  parent: DHSandbagsFull
  id: DHSandbagsFull25
  suffix: "25"
  components:
  - type: Stack
    stackType: DHSandbagsFull
    count: 25

- type: damageModifierSet
  id: DHSandbag
  coefficients:
    Blunt: 0.5
    Slash: 0.3
    Piercing: 0.15
    Heat: 0.2
    Structural: 1.0

# --- Баррикады (общая система, решение автора 2026-11-11) ---
# Тонкая стенка по переднему краю тайла, как в CM-SS13 / RMC: спереди держит пули с шансом (DHBarricade.blockChance),
# из-за неё стреляют; перелезть можно; колючка — DHWireable; трещины по урону; ремонт у каждого вида свой.

- type: entity
  abstract: true
  parent: BaseStructure
  id: DHBarricadeBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.38"
        density: 500
        mask:
        - FullTileMask
        layer:
        - TableLayer
        - BulletImpassable
  - type: Climbable
  - type: InteractionOutline
  - type: Injurable
    damageContainer: Inorganic
  - type: DHBarricade
    blockChance: 0.6
  - type: DHWireable
    wireDamage:
      types:
        Slash: 10
  - type: Tag
    tags:
    - Structure

- type: entity
  parent: DHBarricadeBase
  id: DHSandbagBarricade
  name: sandbag barricade
  description: A low wall of sandbags. Stops most bullets coming from the front; you can shoot over it from behind and climb across. Barbed wire can be strung on top of it (whoever climbs over gets cut). Patch it with filled sandbags, dig it up with a shovel, cut the wire with wirecutters.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/sandbag_barricade.rsi
    layers:
    - state: sandbag
    - state: sandbag_wire
      map: [ "wire" ]
      visible: false
    drawdepth: WallTops
  - type: GenericVisualizer
    visuals:
      enum.DHWireVisuals.Wired:
        wire:
          True: { visible: true }
          False: { visible: false }
  # Трещины поверх мешков — оверлеем, как у окон (targetLayers ждёт enum-ключи слоёв, строка не парсится).
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 28.125
    trackAllDamage: true
    damageOverlay:
      sprite: _RMC14/Structures/Walls/Barricades/sandbag_cracks.rsi
  - type: Damageable
    damageModifierSet: DHSandbag
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DHSandbagBarricade
    refund: 5

- type: damageModifierSet
  id: DHBarricadeMetal
  coefficients:
    Heat: 1.15
    Shock: 1.15
    Cold: 1.15
    Caustic: 1.15

# Металлическая (4 листа стали) и пласталевая (4 листа пластали) — как в CM-SS13 / RMC. Строятся через меню
# строительства, чинятся сваркой, разбираются отвёрткой и ломом (сначала срезать колючку).
- type: entity
  abstract: true
  parent: DHBarricadeBase
  id: DHBarricadeMetalBase
  components:
  - type: Anchorable
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_RMC14/Structures/metalhit.ogg
  - type: Damageable
    damageModifierSet: DHBarricadeMetal

- type: entity
  parent: DHBarricadeMetalBase
  id: DHBarricadeMetal
  name: metal barricade
  description: A sturdy, quickly assembled barricade of metal plates. Stops most bullets coming from the front; you can shoot over it from behind. Weld it to repair; screwdriver and crowbar to take it apart.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: metal
    - state: metal_wire
      map: [ "wire" ]
      visible: false
    drawdepth: WallTops
  - type: GenericVisualizer
    visuals:
      enum.DHWireVisuals.Wired:
        wire:
          True: { visible: true }
          False: { visible: false }
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 28.125
    trackAllDamage: true
    damageOverlay:
      sprite: _RMC14/Structures/Walls/Barricades/metal_barricade_cracks.rsi
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 10
    damageValue: 200
  - type: DHBarricade
    blockChance: 0.7
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: DHBarricadeMetal
    node: barricade
  - type: StaticPrice
    price: 40

- type: entity
  parent: DHBarricadeMetalBase
  id: DHBarricadePlasteel
  name: plasteel barricade
  description: A heavy barricade of reinforced plasteel plates — the pinnacle of strongpoints. Stops nearly every bullet from the front; you can shoot over it from behind. Weld it to repair; screwdriver and crowbar to take it apart.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Walls/Barricades/barricade.rsi
    layers:
    - state: plasteel
    - state: plasteel_wire
      map: [ "wire" ]
      visible: false
    drawdepth: WallTops
  - type: GenericVisualizer
    visuals:
      enum.DHWireVisuals.Wired:
        wire:
          True: { visible: true }
          False: { visible: false }
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 56.25
    trackAllDamage: true
    damageOverlay:
      sprite: _RMC14/Structures/Walls/Barricades/plasteel_barricade_cracks.rsi
  - type: Repairable
    fuelCost: 20
    doAfterDelay: 10
    damageValue: 200
  - type: DHBarricade
    blockChance: 0.85
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 3
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: DHBarricadePlasteel
    node: barricade
  - type: StaticPrice
    price: 120

# --- Палатки ---

- type: entity
  abstract: true
  parent: BaseItem
  id: DHTentFoldedBase
  components:
  - type: Item
    size: Huge
    sprite: _RMC14/Objects/Tents/folded_tents.rsi
  - type: Sprite
    sprite: _RMC14/Objects/Tents/folded_tents.rsi
    state: base_tent

- type: entity
  abstract: true
  parent: BaseStructure
  id: DHTentBase
  name: field tent
  description: A field tent. The entrance is to the south. Fold it with an alternative action.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    sprite: _RMC14/Objects/Tents/deployed_tents.rsi
    offset: 1,0
    drawdepth: Overdoors
    layers:
    - state: standard_frame
    - state: standard_canvas
      map: [ "canvas" ]
    - state: standard_roof
      map: [ "roof" ]
  - type: SpriteFade
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1: # левая стенка
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-2.5,-1.4,1"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
      fix-2: # правая стенка
        shape:
          !type:PhysShapeAabb
          bounds: "0.4,-2.5,0.5,1"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
      fix-3: # задняя стенка
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,0.4,0.5,1.5"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
  - type: Injurable
    damageContainer: Inorganic
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

