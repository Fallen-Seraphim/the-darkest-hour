# --- Строительство металлической и пласталевой баррикад ---

- type: construction
  id: DHBarricadeMetal
  name: dh-construction-barricade-metal
  description: dh-construction-barricade-metal-desc
  graph: DHBarricadeMetal
  startNode: start
  targetNode: barricade
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked

- type: construction
  id: DHBarricadePlasteel
  name: dh-construction-barricade-plasteel
  description: dh-construction-barricade-plasteel-desc
  graph: DHBarricadePlasteel
  startNode: start
  targetNode: barricade
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked

- type: constructionGraph
  id: DHBarricadeMetal
  start: start
  graph:
  - node: start
    edges:
    - to: barricade
      completed:
      - !type:SnapToGrid
      steps:
      - material: Steel
        amount: 4
        doAfter: 2
  - node: barricade
    entity: DHBarricadeMetal
    edges:
    - to: start
      completed:
      - !type:DHDropWire
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 3
      - !type:DeleteEntity
      steps:
      - tool: Screwing
        doAfter: 1
      - tool: Prying
        doAfter: 2

- type: constructionGraph
  id: DHBarricadePlasteel
  start: start
  graph:
  - node: start
    edges:
    - to: barricade
      completed:
      - !type:SnapToGrid
      steps:
      - material: Plasteel
        amount: 4
        doAfter: 4
  - node: barricade
    entity: DHBarricadePlasteel
    edges:
    - to: start
      completed:
      - !type:DHDropWire
      - !type:SpawnPrototype
        prototype: SheetPlasteel1
        amount: 3
      - !type:DeleteEntity
      steps:
      - tool: Screwing
        doAfter: 2
      - tool: Prying
        doAfter: 4
