# DarkestHour: RMC-образная форма фракций (решение автора 2026-11-05). Республика — в духе USCM (камуфляж «джунгли»),
# Империя — в духе Королевской морской пехоты TWE. Спрайты — RMC-14 (CC-BY-SA-3.0), копируются
# Tools/_DarkestHour/rmc_skins.py. Защита и вместимость — как у ванильных родителей, меняется только вид.

# --- Республика ---

