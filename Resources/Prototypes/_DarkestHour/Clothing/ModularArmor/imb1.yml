  - type: Item
    size: Huge
    shape:
    - 0,0,3,3
  - type: DHWeight
    weight: 14
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.8
  # Физическую защиту дают только пластины (классы брони); комбинезон — от радиации и кислоты.
  - type: Armor
    modifiers:
      coefficients:
        Radiation: 0.6
        Caustic: 0.6
  # Скорость задаёт класс экзоскелета (DHExoskeleton), пластины её не меняют.
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    slot: head
    verbText: toggle-clothing-verb-helmet
    action: ActionToggleSuitPiece
