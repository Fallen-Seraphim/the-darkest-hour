# DarkestHour: модульная броня IMB-1 (Imperial Marine Corps) — экзоскелеты и пластины. Сгенерировано
# Tools/_DarkestHour/modular_armor/gen_yaml.py — правьте генератор. Спрайты — exo_sprites.py.

- type: entity
  parent: [ ClothingOuterBase, BaseSyndicateContraband ]
  id: DHClothingOuterExoIMB1Light
  name: IMB-1 light exoskeleton
  description: "A light open-frame exoskeleton worn over the uniform: struts along the limbs, actuators in the joints. Takes composite plates only, carries itself and its plates and even quickens the step. Not sealed; no mount for a special system."
  components:
  - type: Sprite
    sprite: _DarkestHour/Clothing/OuterClothing/ModularArmor/imb1_exo_light.rsi
    state: icon
  - type: Clothing
    sprite: _DarkestHour/Clothing/OuterClothing/ModularArmor/imb1_exo_light.rsi
  - type: Item
    size: Huge
    shape:
    - 0,0,3,3
  - type: DHWeight
    weight: 8
  # Скорость задаёт класс экзоскелета (DHExoskeleton), пластины её не меняют.
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    slot: head
    verbText: toggle-clothing-verb-helmet
    action: ActionToggleSuitPiece
    clothingPrototype: DHClothingHeadHelmetExoIMB1Light
  - type: DHExoskeleton
    class: Light
    plates: [ Composite ]
    speed: 1.05
    loadFactor: 0.85
    meleeMultiplier: 1.1
    special: false
  # Пока экзоскелет надет, пластины рук и ног занимают слоты правой/левой руки и ноги (DHArmorLimbCover).
  - type: DHModularArmor
    faction: imb1
    covers:
      ArmLeft: DHArmorCoverIMB1ArmLeft
      ArmRight: DHArmorCoverIMB1ArmRight
      LegLeft: DHArmorCoverIMB1LegLeft
      LegRight: DHArmorCoverIMB1LegRight
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      dh_armor_torso: !type:ContainerSlot {}
      dh_armor_armleft: !type:ContainerSlot {}
      dh_armor_armright: !type:ContainerSlot {}
      dh_armor_legleft: !type:ContainerSlot {}
      dh_armor_legright: !type:ContainerSlot {}
      dh_armor_special: !type:ContainerSlot {}
  - type: GroupExamine
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: StaticPrice
    price: 2500

- type: entity
  parent: [ ClothingHeadBase, BaseSyndicateContraband ]
  id: DHClothingHeadHelmetExoIMB1Light
  name: IMB-1 light exoskeleton helmet
  description: "A combat helmet over an integrated panoramic gas mask: a wide visor, a round speech diaphragm and a cheek filter. The light exoskeleton is not sealed."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DarkestHour/Clothing/Head/ModularArmor/imb1_helmet_light.rsi
    state: icon
  - type: Clothing
    sprite: _DarkestHour/Clothing/Head/ModularArmor/imb1_helmet_light.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    quickEquip: false
    slots: [ HEAD ]
  - type: BreathMask
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: HideLayerClothing
  - type: GroupExamine
  # Шлем защищает только голову (часть тела выбирают травмы), общей брони у него нет.
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 1
        Slash: 1
        Piercing: 1
        Heat: 1
        Radiation: 1
  - type: DHPartArmor
    parts: [ Head ]
    armorClass: 1
  # Встроенный противогаз занимает и слот маски (решение автора 2026-11-06).
  - type: DHIntegratedMask
  - type: SlotBlock
    slots: [ MASK ]

- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseSyndicateContraband ]
  id: DHClothingOuterExoIMB1Medium
  name: IMB-1 medium exoskeleton
  description: "A sealed exoskeleton over a black pressure suit. Takes composite and light plates and carries them exactly: the wearer moves as if unarmoured. A special system mounts on the back power unit."
  components:
  - type: Sprite
    sprite: _DarkestHour/Clothing/OuterClothing/ModularArmor/imb1_exo_medium.rsi
    state: icon
  - type: Clothing
