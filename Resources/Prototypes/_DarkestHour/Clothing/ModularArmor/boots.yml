  id: DHClothingShoesMagArmoredLightRepublic
  name: light armoured magboots
  description: RMB-1 magnetic boots with plated toecaps. Protection class 2 for the feet. Can hold 0.75 L of gas for the thrusters.
  components:
  - type: Sprite # DarkestHour: RMC-вид (2026-11-05), Tools/_DarkestHour/rmc_skins.py
    sprite: _DarkestHour/Clothing/RMC/magboots_republic.rsi
  - type: Clothing
    sprite: _DarkestHour/Clothing/RMC/magboots_republic.rsi
  - type: DHPartArmor
    parts: [ FootLeft, FootRight ]
    armorClass: 2

