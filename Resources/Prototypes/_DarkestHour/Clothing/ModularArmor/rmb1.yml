    class: Medium
    plates: [ Composite, Light ]
    speed: 1.0
    loadFactor: 0.7
    meleeMultiplier: 1.25
    special: true
  # Пока экзоскелет надет, пластины рук и ног занимают слоты правой/левой руки и ноги (DHArmorLimbCover).
