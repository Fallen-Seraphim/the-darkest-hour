# DarkestHour: модульная броня RMB-1 (Republican Army Corps). Сгенерировано Tools/_DarkestHour/modular_armor/gen_yaml.py —
# правьте генератор. Спрайты — Tools/_DarkestHour/modular_armor/build.py.

- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseTaskForceContraband ]
  id: DHClothingOuterModularRMB1
  name: RMB-1 body suit
  description: "The sealed green body suit of the RMB-1 modular armour of the Republican Army Corps. Khaki armour modules lock onto it at the arms, legs and torso; a special system fits on the back."
  components:
  - type: Sprite
    sprite: _DarkestHour/Clothing/OuterClothing/ModularArmor/rmb1_body.rsi
  - type: Clothing
    sprite: _DarkestHour/Clothing/OuterClothing/ModularArmor/rmb1_body.rsi
  - type: Item
    size: Huge
    shape:
    - 0,0,3,3
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.8
  # Физическую защиту дают только модули (классы брони); корпус — от радиации и кислоты.
  - type: Armor
    modifiers:
      coefficients:
        Radiation: 0.6
        Caustic: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: DHClothingHeadHelmetModularRMB1
  - type: DHModularArmor
    faction: rmb1
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      dh_armor_torso: !type:ContainerSlot {}
      dh_armor_armleft: !type:ContainerSlot {}
      dh_armor_armright: !type:ContainerSlot {}
      dh_armor_legleft: !type:ContainerSlot {}
      dh_armor_legright: !type:ContainerSlot {}
      dh_armor_special: !type:ContainerSlot {}
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
  - type: StaticPrice
    price: 4000

- type: entity
  parent: [ ClothingHeadHardsuitBase, BaseTaskForceContraband ]
  id: DHClothingHeadHelmetModularRMB1
  name: RMB-1 helmet
  description: "The RMB-1 helmet: a khaki combat helmet over a twin-filter gas mask. Seals the suit."
  components:
  - type: Sprite
    sprite: _DarkestHour/Clothing/Head/ModularArmor/rmb1_helmet.rsi
  - type: Clothing
    sprite: _DarkestHour/Clothing/Head/ModularArmor/rmb1_helmet.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  # Шлем защищает только голову (часть тела выбирают травмы), общей брони у него нет.
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 1
        Slash: 1
        Piercing: 1
        Heat: 1
        Radiation: 1
  - type: DHPartArmor
    parts: [ Head ]
    armorClass: 1

