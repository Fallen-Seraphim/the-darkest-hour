# Полный комплект десантника: экспериментальные пластины, автоаптечка в слоте спецсистемы.
- type: entity
  parent: DHClothingOuterExoEMB5
  id: DHClothingOuterModularEMB5
  suffix: Full
  components:
  - type: DHModularArmor
    faction: emb5
    covers:
      ArmLeft: DHArmorCoverEMB5ArmLeft
      ArmRight: DHArmorCoverEMB5ArmRight
      LegLeft: DHArmorCoverEMB5LegLeft
      LegRight: DHArmorCoverEMB5LegRight
    startingModules:
      Torso: DHArmorModuleEMB5Torso
      ArmLeft: DHArmorModuleEMB5ArmLeft
      ArmRight: DHArmorModuleEMB5ArmRight
      LegLeft: DHArmorModuleEMB5LegLeft
      LegRight: DHArmorModuleEMB5LegRight
      Special: DHArmorSpecialAutoMed

# Поле пехотного щита на носителе: состояние и свет. Сам щит клиент рисует голубым контуром по силуэту носителя
# (шейдер DHInfantryShieldOutline, как старый щит Monolith — решение автора 2026-11-26).
- type: entity
  id: DHInfantryShieldField
  name: infantry shield field
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    radius: 1.4
    energy: 0.6
    color: "#00AAFF"
    netsync: false
  - type: DHInfantryShieldField

# Контур пехотного щита: обводка по силуэту, цвет и толщину выставляет DHInfantryShieldVisualsSystem.
- type: shader
  id: DHInfantryShieldOutline
  kind: source
  path: "/Textures/Shaders/outline.swsl"
  params:
    outline_color: "#00AAFFCF"
    light_boost: 3
    light_gamma: 1.25
    light_whitepoint: 48
