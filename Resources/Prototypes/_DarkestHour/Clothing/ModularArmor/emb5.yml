  description: "An experimental Association armour plate, protection class 2: stops ordinary rounds and holds far longer than a light plate at the weight of a composite one. Fits only EMB-5 exoskeletons; can be swapped in the field."
  components:
  - type: Sprite
    sprite: _DarkestHour/Clothing/OuterClothing/ModularArmor/emb5_experimental.rsi
    state: icon_torso
  - type: Item
    size: Normal
  - type: DHWeight
    weight: 5.0
  - type: DHArmorModule
    slot: Torso
    class: Experimental
    faction: emb5
    maxIntegrity: 330
    integrity: 330
    equippedRsi: _DarkestHour/Clothing/OuterClothing/ModularArmor/emb5_experimental.rsi
    equippedState: torso
  - type: StaticPrice
    price: 1100

