# DarkestHour: ящики снабжения для ПВО, ПКО, корабельной артиллерии, ПЗРК и штурмовика (авиация, этап 4, 2026-11-12).
# Каталоги — catalogs.yml. Тяжёлые снаряды и авиабоеприпасы лежат в ящике как есть (ящик — EntityStorage).

- type: entity
  parent: CrateGenericSteel
  id: DHSupplyCrateInterceptorMissiles
  name: interceptor missile crate
  description: "Two interceptor missiles for a point-defence launcher or a missile silo."
  components:
  - type: Icon
    sprite: Structures/Storage/Crates/weapon.rsi
  - type: Sprite
    sprite: Structures/Storage/Crates/weapon.rsi
  - type: StorageFill
    contents:
    - id: DHInterceptorMissile
      amount: 2

