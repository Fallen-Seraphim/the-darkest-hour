# DarkestHour: каталоги снабжения сторон (решение автора 2026-11-11). Не за деньги: в начале раунда лежит initial.
# Само не пополняется (решение автора 2026-11-19): пополнение раздела покупается за очки командования (restocks) —
# каждой позиции раздела добавляется refill, не выше max. Позиции, закрытые узлами древа (command_tree.yml),
# появляются со стартовым запасом, когда командование откроет узел. Код — DHSupplySystem, DHCommandPointsSystem.

- type: dhSupplyCatalog
  id: DHSupplyEmpire
  faction: Empire
  startPoints: 150
  restocks:
  - { category: dh-supply-category-ammo, price: 30 }
  - { category: dh-supply-category-medical, price: 30 }
  - { category: dh-supply-category-engineering, price: 40 }
  - { category: dh-supply-category-air-defence, price: 60 }
  - { category: dh-supply-category-aviation, price: 80 }
  - { category: dh-supply-category-artillery, price: 100 }
  - { category: dh-supply-category-naval, price: 100 }
  - { category: dh-supply-category-misc, price: 20 }
  - { category: dh-supply-category-vehicles, price: 150 }
  entries:
  # Хамви — после узла «Хамви» (план осады п. 3): поддон в карго, дальше — лифт техники или сброс на маяк.
  - { id: humvee, proto: DHVehicleDropPalletHumveeEmpire, category: dh-supply-category-vehicles, initial: 1, refill: 1, max: 2 }
  - { id: mortar-he, proto: DHSupplyCrateMortarHE, category: dh-supply-category-artillery, initial: 3, refill: 2, max: 6 }
  - { id: mortar-frag, proto: DHSupplyCrateMortarFrag, category: dh-supply-category-artillery, initial: 2, refill: 1, max: 4 }
  - { id: mortar-special, proto: DHSupplyCrateMortarSpecial, category: dh-supply-category-artillery, initial: 1, refill: 1, max: 3 }
  - { id: mortar, proto: DHCrateMortar, category: dh-supply-category-artillery, initial: 1, refill: 0, max: 1 }
  # ПТ-оружие пехоты (план осады п. 13): трубы — со старта, ПТУР и ракеты к нему — после узла «ПТУР».
  - { id: at-tubes, proto: DHSupplyCrateATTubes, category: dh-supply-category-artillery, initial: 2, refill: 1, max: 4 } # 4 трубы
  - { id: atgm, proto: DHCrateATGM, category: dh-supply-category-artillery, initial: 1, refill: 1, max: 2 } # ПТУР + 2 ракеты
  - { id: atgm-missiles, proto: DHSupplyCrateATGMMissiles, category: dh-supply-category-artillery, initial: 1, refill: 1, max: 3 }
  - { id: field-gun-75, proto: DHCrateFieldGun75, category: dh-supply-category-artillery, initial: 2, refill: 1, max: 4 }
  - { id: ammo-imps, proto: DHSupplyCrateAmmoImpS, category: dh-supply-category-ammo, initial: 4, refill: 2, max: 8 }
  - { id: ammo-impr, proto: DHSupplyCrateAmmoImpR, category: dh-supply-category-ammo, initial: 2, refill: 1, max: 4 }
  - { id: ammo-impb, proto: DHSupplyCrateAmmoImpB, category: dh-supply-category-ammo, initial: 2, refill: 1, max: 4 }
  - { id: ammo-14g, proto: DHSupplyCrateAmmo14g, category: dh-supply-category-ammo, initial: 2, refill: 1, max: 4 }
  - { id: ammo-145, proto: DHSupplyCrateAmmo145, category: dh-supply-category-ammo, initial: 2, refill: 1, max: 4 }
  - { id: ammo-ihmg, proto: DHSupplyCrateAmmoIHMG, category: dh-supply-category-ammo, initial: 2, refill: 1, max: 4 } # ленты IHMG-17
  - { id: medical, proto: DHSupplyCrateMedical, category: dh-supply-category-medical, initial: 3, refill: 2, max: 6 }
  - { id: ozk, proto: DHCrateOZK, category: dh-supply-category-medical, initial: 1, refill: 1, max: 3 }
  - { id: prosthetics, proto: DHCrateProsthetics, category: dh-supply-category-medical, initial: 1, refill: 1, max: 2 } # протезы
  - { id: sandbags, proto: DHSupplyCrateSandbags, category: dh-supply-category-engineering, initial: 2, refill: 1, max: 4 }
  - { id: folding-barricades, proto: DHSupplyCrateFoldingBarricades, category: dh-supply-category-engineering, initial: 1, refill: 1, max: 3 }
  - { id: barbed-wire, proto: DHSupplyCrateBarbedWire, category: dh-supply-category-engineering, initial: 2, refill: 1, max: 4 }
  - { id: pontoons, proto: DHCratePontoons, category: dh-supply-category-engineering, initial: 1, refill: 1, max: 2 }
  - { id: boats, proto: DHCrateBoatInflatable, category: dh-supply-category-engineering, initial: 1, refill: 1, max: 2 } # 2 надувные лодки
  - { id: steel, proto: CrateMaterialSteel, category: dh-supply-category-engineering, initial: 2, refill: 1, max: 4 }
  - { id: plasteel, proto: CrateMaterialPlasteel, category: dh-supply-category-engineering, initial: 1, refill: 1, max: 2 }
  - { id: fusion-fuel, proto: DHCrateFusionFuel, category: dh-supply-category-engineering, initial: 1, refill: 1, max: 2 }
  - { id: carrier-repair, proto: DHCrateCarrierRepair, category: dh-supply-category-engineering, initial: 2, refill: 1, max: 4 }
  - { id: parachutes, proto: DHCrateParachutes, category: dh-supply-category-misc, initial: 1, refill: 1, max: 2 }
  - { id: interceptor-missiles, proto: DHSupplyCrateInterceptorMissiles, category: dh-supply-category-air-defence, initial: 2, refill: 1, max: 4 }
  - { id: shells-300, proto: DHSupplyCrateShells300, category: dh-supply-category-naval, initial: 2, refill: 1, max: 4 }
  - { id: shells-570, proto: DHSupplyCrateShells570, category: dh-supply-category-naval, initial: 1, refill: 1, max: 3 }
  - { id: aircraft-bombs-he, proto: DHSupplyCrateAircraftBombsHE, category: dh-supply-category-aviation, initial: 2, refill: 1, max: 4 }
  - { id: aircraft-bombs-area, proto: DHSupplyCrateAircraftBombsArea, category: dh-supply-category-aviation, initial: 1, refill: 1, max: 3 }
  - { id: aircraft-bombs-magnesium, proto: DHSupplyCrateAircraftBombsMagnesium, category: dh-supply-category-aviation, initial: 1, refill: 1, max: 2 }
  - { id: aircraft-guided-bombs, proto: DHSupplyCrateAircraftGuidedBombs, category: dh-supply-category-aviation, initial: 1, refill: 1, max: 2 }
  - { id: aircraft-missiles-at, proto: DHSupplyCrateAircraftMissilesAT, category: dh-supply-category-aviation, initial: 1, refill: 1, max: 3 }
  - { id: aircraft-missiles-he, proto: DHSupplyCrateAircraftMissilesHE, category: dh-supply-category-aviation, initial: 1, refill: 1, max: 3 }
  - { id: aircraft-cannon-ammo, proto: DHSupplyCrateAircraftCannonAmmo, category: dh-supply-category-aviation, initial: 2, refill: 1, max: 4 }
  - { id: aircraft-cannon-pod, proto: DHSupplyCrateAircraftCannonPod, category: dh-supply-category-aviation, initial: 1, refill: 0, max: 1 }
  - { id: aircraft-flares, proto: DHSupplyCrateAircraftFlares, category: dh-supply-category-aviation, initial: 2, refill: 1, max: 4 }

