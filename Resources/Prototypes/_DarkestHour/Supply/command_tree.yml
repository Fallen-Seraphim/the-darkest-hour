# --- Компьютеры штаба ---

- type: entity
  abstract: true
  parent: BaseComputer
  id: DHComputerCommandTreeBase
  components:
  - type: ComputerVisuals
    stateScreen: rdcomp
    stateKeys: tech_key
  - type: ActivatableUI
    key: enum.DHCommandTreeUiKey.Key
  - type: ActivatableUIRequiresVision
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.DHCommandTreeUiKey.Key:
        type: DHCommandTreeBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0

- type: entity
  parent: DHComputerCommandTreeBase
  id: DHComputerCommandTreeRepublic
  name: garrison staff computer
  description: The garrison command spends command points here to develop the base's supply. Only the command can use it.
  components:
  - type: DHCommandTreeConsole
    faction: Republic
  - type: AccessReader
    access: [ [ "DHRepublicCommand" ] ]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#8fd66b"

- type: entity
  parent: DHComputerCommandTreeBase
  id: DHComputerCommandTreeEmpire
  name: operation staff computer
  description: The Imperial Command spends command points here to develop the landing force's supply. Only the command can use it.
  components:
  - type: DHCommandTreeConsole
    faction: Empire
  - type: AccessReader
    access: [ [ "DHImperialCommand" ] ]
  - type: ComputerVisuals
    stateScreen: rdcomp
    stateKeys: syndie_key
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#e8604a"
