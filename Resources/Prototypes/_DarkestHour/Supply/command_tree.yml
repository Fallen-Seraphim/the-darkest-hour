# DarkestHour: древо командования «Осады» (план осады п. 3, решения автора 2026-11-19). Узлы открывает командование
# за очки командования на компьютере штаба (DHComputerCommandTree*); открытый узел даёт позиции каталога снабжения
# (со стартовым запасом) или улучшает снабжение. Пока здесь только то, что уже есть в игре; новые вещи (хамви, дроны,
# ПТУР, импланты…) добавляются узлами по мере появления. Хамви — ветка «Техника» (план осады п. 5). Код — DHCommandPointsSystem.

