# Места рождения (решения автора 2026-11-11 и 2026-11-27): известные миры TDH по волнам заселения и обобщённые
# варианты. Только миры, где рождались люди: без пространства Аринталов и Имперского Мандата, Ксайрекса, Аргонов,
# Махоров, без Поражённых миров и автоматических станций (Энцелад). founded — год заселения, until — последний год,
# когда там рождались; polities — государство по годам (до Коллапса — только ЗГА и ОНК), now — чей мир в 2318 году.
# designation — индекс мира при этом государстве (решение автора 2026-11-27): ЗГА — KL, Республика — REP, Империя — EMP
# (в Объединительные войны 2302–2307 — ещё KL), Федерация — FED, ОНК — ONK. Из списка автора: KL-1xx…2xx, 417, 433,
# 534, 535, 563, 611, 911; REP-10…17; EMP-001/002 (у автора IMP-, решено — EMP для всех), EMP-055…057; FED-032, 033,
# 047; ONK-001, 016. Придуманы Claude (предложение, решение автора — «придумай сам»): KL у миров Четвёртой Волны
# (Скай 842, Озур 846, Мемория 851, Элей 724, Фукс 727, Миола 763, Ронейро 936), спутники Арианы KL-153a…c /
# REP-11a…c, Фогг REP-10a, Солярис FED-001, Шайн FED-002, Дорнан FED-005, Миола при ОНК ONK-031.
# Лор — claude/lore.md.

