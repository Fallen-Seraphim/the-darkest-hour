# Улучшенный огнемёт специалиста по вооружению: дальше бьёт, по умолчанию с напалмом.
- type: entity
  parent: DHWeaponFlamer
  id: DHWeaponFlamerImperial
  name: IFL-17 incinerator
  description: An Imperial Marine Corps incinerator with a high-pressure pump and a long nozzle. Throws burning fuel twice as far as a civilian unit. Alt-click to light the pilot flame.
  components:
  - type: DHFlamer
    maxRange: 9
    igniteSound:
      path: /Audio/_RMC14/Weapons/Guns/Flamer/surv_flamer_ignite.ogg
  - type: Gun
    fireRate: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Tank
        startingItem: DHFlamerTankNapalm
        insertSound: /Audio/_RMC14/Weapons/Handling/flamer_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Handling/flamer_unload.ogg
        priority: 2
        whitelist:
          tags:
          - DHFlamerTank
  - type: StaticPrice
    price: 2500

