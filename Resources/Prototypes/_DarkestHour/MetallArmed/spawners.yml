# ОБР Metall Armed: точки появления призраков (ставятся на шаттл ОБР).

- type: entity
  id: DHSpawnerMetallArmedCommander
  name: Metall Armed commander
  suffix: Ghost role
  components:
  - type: Sprite
    sprite: _DarkestHour/Clothing/OuterClothing/Hardsuits/metall_armed_commander.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: DHMetallArmedCommander

- type: randomHumanoidSettings
  id: DHMetallArmedCommander
  parent: DHEventHumanoidMetallArmed
  components:
  - type: GhostRole
    name: dh-ghost-role-metall-armed-commander-name
    description: dh-ghost-role-metall-armed-commander-desc
    rules: ghost-role-information-nonantagonist-rules
    raffle:
      settings: short
    job: DHMetallArmedCommander
  - type: Loadout
    prototypes: [ DHMetallArmedCommanderGear ]
    roleLoadout: [ RoleSurvivalMilitaryDouble ]
  - type: RandomMetadata
    nameSegments:
    - NamesMilitaryLast
    nameFormat: dh-name-format-metall-armed-commander

