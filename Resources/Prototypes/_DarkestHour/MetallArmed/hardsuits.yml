  components:
  - type: Sprite
    sprite: _DarkestHour/Clothing/OuterClothing/Hardsuits/metall_armed_medic.rsi
  - type: Clothing
    sprite: _DarkestHour/Clothing/OuterClothing/Hardsuits/metall_armed_medic.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.85
  - type: StaminaResistance
    damageCoefficient: 0.9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.8
        Heat: 0.6
        Radiation: 0.35
        Caustic: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 1.05
    sprintModifier: 1.1
  - type: ToggleableClothing
    clothingPrototype: DHClothingHeadHelmetHardsuitMetallArmedMedic
  - type: DHSuitWeapon
    weapon: DHWeaponFlamerSuit
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      dh_suit_weapon: !type:ContainerSlot {}

- type: entity
  parent: DHClothingHeadHelmetHardsuitMetallArmedBase
  id: DHClothingHeadHelmetHardsuitMetallArmedMedic
  name: Metall Armed combat medic's hardsuit helmet
  description: The helmet of a Metall Armed combat medic.
