# --- Встроенный мини-огнемёт медика (выдвигается действием, бак на 20 единиц, заправляется как обычный бак)
- type: entity
  parent: BaseAction
  id: DHActionToggleSuitWeapon
  name: Deploy built-in weapon
  description: Extend the weapon built into your hardsuit into your hand, or retract it.
  components:
  - type: Action
    itemIconStyle: BigItem
    useDelay: 1
  - type: InstantAction
    event: !type:DHToggleSuitWeaponEvent

- type: entity
  parent: BaseItem
  id: DHWeaponFlamerSuit
  name: forearm incinerator
  description: A compact incinerator built into a combat medic's hardsuit. Holds 20 units of fuel; refill it from a fuel tank like any incinerator tank. Alt-click to light the pilot flame.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/colony.rsi
    scale: 0.8,0.8
    layers:
    - state: base
    - state: lit
      map: [ "enum.DHFlamerVisuals.Ignited" ]
      visible: false
      shader: unshaded
  - type: Item
    sprite: _RMC14/Objects/Weapons/Guns/Flamethrower/colony.rsi
    size: Huge
  - type: Gun
    fireRate: 0.75
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    minAngle: 0
    maxAngle: 4
    angleIncrease: 0
    cameraRecoilScalar: 0
    soundGunshot:
      collection: DHFlamerShoot
    soundEmpty:
      path: /Audio/_RMC14/Weapons/Guns/Flamer/gun_flamethrower_empty.ogg
  - type: AmmoCounter
  - type: DHFlamer
    maxRange: 4
    igniteSound:
      path: /Audio/_RMC14/Weapons/Guns/Flamer/surv_flamer_ignite.ogg
  - type: DHFlamerTank
  - type: Solution
    id: tank
    solution:
      maxVol: 20
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 20
  - type: ExaminableSolution
    solution: tank
    exactVolume: true
  - type: RefillableSolution
    solution: tank
  - type: Unremoveable
    deleteOnDrop: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DHFlamerVisuals.Ignited:
        enum.DHFlamerVisuals.Ignited:
          True: { visible: true }
          False: { visible: false }
