# ОБР Metall Armed (этап 6): скафандры отряда. Спрайты — ERT-скафандры Monolith (CC-BY-SA-3.0), перекрашены в
# цвета Metallistick генератором Tools/_DarkestHour/hardsuits. Характеристики: командир — хорошая защита;
# специалист по вооружению — быстрый, защиты меньше; боевой медик — самый быстрый, слабая защита, встроенный
# мини-огнемёт; стрелок — средний.

- type: entity
  abstract: true
  parent: [ ClothingOuterHardsuitBase, BaseTaskForceContraband ]
  id: DHClothingOuterHardsuitMetallArmedBase
  components:
  - type: Item
    size: Huge
    shape:
    - 0,0,3,3
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: HeldSpeedModifier
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
  - type: StaticPrice
    price: 6000

- type: entity
  abstract: true
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase, BaseTaskForceContraband ]
  id: DHClothingHeadHelmetHardsuitMetallArmedBase
  components:
  - type: PointLight
    color: "#e8dcbf"
    radius: 5
    energy: 2.5
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9

# --- Командир отряда
- type: entity
  parent: DHClothingOuterHardsuitMetallArmedBase
  id: DHClothingOuterHardsuitMetallArmedCommander
  name: Metall Armed commander's hardsuit
  description: A heavy command hardsuit of a Metall Armed response team. Brass trim marks the squad leader.
  components:
  - type: Sprite
    sprite: _DarkestHour/Clothing/OuterClothing/Hardsuits/metall_armed_commander.rsi
  - type: Clothing
    sprite: _DarkestHour/Clothing/OuterClothing/Hardsuits/metall_armed_commander.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.55
  - type: StaminaResistance
    damageCoefficient: 0.7
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.45
        Heat: 0.55
        Radiation: 0.4
        Caustic: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ToggleableClothing
    clothingPrototype: DHClothingHeadHelmetHardsuitMetallArmedCommander

- type: entity
  parent: DHClothingHeadHelmetHardsuitMetallArmedBase
  id: DHClothingHeadHelmetHardsuitMetallArmedCommander
  name: Metall Armed commander's hardsuit helmet
  description: The helmet of a Metall Armed squad leader.
  components:
  - type: Sprite
    sprite: _DarkestHour/Clothing/Head/Hardsuits/metall_armed_commander.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85

