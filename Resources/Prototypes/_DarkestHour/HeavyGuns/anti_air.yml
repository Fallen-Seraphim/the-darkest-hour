# Зенитки Республики (решение автора 2026-11-04): подвижное ПВО — как спаренная 30-мм автопушка ПВО планеты, но
# прикрывает и бьёт по воздушным целям (авианосец/челноки в атмосфере, будущая авиация) в радиусе 50 м. На базе — две.
# Стреляет, только закреплённая ключом; открепить — и её можно катить (медленно) или тащить грузовиком, как пушку.
# Заряжается ящиками снарядов 30-мм автопушки ПВО. Механика — DHHeavyGunSystem (ПВО), буксировка — DHFieldGunTowSystem.

- type: entity
  parent: [ BaseStructureDynamic, StructureWheeled ]
  id: DHAntiAirGun
  name: towed anti-aircraft gun
  description: A Republican twin 30 mm anti-aircraft gun on a wheeled carriage. Wrench it down to fire — it puts up flak against shells falling within 50 m and fires at ships and aircraft in the sky within 50 m. Unwrench it to roll it to a new position or hitch it to a truck. Takes 30 mm autocannon ammunition boxes.
  components:
  - type: DHHitchable # буксировка грузовиком
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _DarkestHour/Structures/HeavyGuns/interceptors.rsi
    state: autocannon
    noRot: false
    drawdepth: Objects
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
    delay: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 400
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Injurable
    damageContainer: Inorganic
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DHInterceptor
    kind: Autocannon
    ammo: 12
    maxAmmo: 12
    chance: 0.25
    radius: 50
    cooldown: 3
    airRange: 50
    airChance: 0.45
    airDamage: 1.5
  - type: DHTowable
    towSpeed: 0.5
  - type: DHScanTarget # глобальный скан: зенитка (не видна под маскировочной сетью)
    kind: AntiAir
    faction: Republic
