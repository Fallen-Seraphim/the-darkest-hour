# Взрывы артиллерии (корабельные орудия, полевые пушки, миномёты). Как Default / FireBomb, но с уроном по
# постройкам (Structural): стены и скалы стали в 5 раз прочнее (DHFortified), а этот урон не ослабляется —
# артиллерия ломает их как раньше. Людей Structural не ранит.

- type: explosion
  id: DHArtillery
  damagePerIntensity:
    types:
      Heat: 5
      Blunt: 5
      Piercing: 5
      Structural: 15
  tileBreakChance: [ 0, 0.5, 1 ]
  tileBreakIntensity: [ 0, 50, 75 ]
  tileBreakRerollReduction: 25
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3
  temperature: 800

- type: explosion
  id: DHArtilleryFire
  damagePerIntensity:
    types:
      Heat: 1
      Blunt: 2
      Piercing: 3
      Structural: 6
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3
  fireStacks: 2
  temperature: 1500
