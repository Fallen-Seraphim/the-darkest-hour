# Тяжёлые орудия «Штурма» (решения автора 2026-10-24). Орудие собирается из частей: казённик + ствол того же
# калибра на соседнем тайле перед казёнником (повёрнут так же); наводят с консоли, сидя на стуле. Снаряды — тяжёлые,
# в две руки. Механика — DHHeavyGunSystem, спрайты — Tools/_DarkestHour/heavy_guns/build.py.
# Авианосец: 570 мм ×1 и 300 мм ×2 (артиллерия по планете). Планета: 700 мм ×1 и 400 мм ×2 (ПКО по кораблям на
# орбите; калибр больше — снаряду ещё преодолевать тяготение). ПВО: на авианосце 4 ракетные установки, на планете
# 2 ракетные шахты и 2 спаренные 30-мм автопушки.

- type: entity
  abstract: true
  parent: BaseStructure
  id: DHHeavyGunPartBase
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: false
  - type: Anchorable
    delay: 6
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 500
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable

- type: entity
  abstract: true
  parent: DHHeavyGunPartBase
  id: DHHeavyGunBreechBase
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/HeavyGuns/breech.rsi
    noRot: false
    layers:
    - state: medium
      map: [ "base" ]
    - state: assembled
      map: [ "assembled" ]
      shader: unshaded
      visible: false
    - state: loaded
      map: [ "loaded" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DHHeavyGunVisuals.Assembled:
        assembled:
          True: { visible: true }
          False: { visible: false }
      enum.DHHeavyGunVisuals.Loaded:
        loaded:
          True: { visible: true }
          False: { visible: false }
  - type: ContainerContainer
    containers:
      breech: !type:ContainerSlot

- type: entity
  abstract: true
  parent: DHHeavyGunPartBase
  id: DHHeavyGunBarrelBase
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/HeavyGuns/barrel_medium.rsi
    state: icon
    noRot: false
    drawdepth: Overdoors

- type: entity
