  name: IG-300 naval gun breech
  description: A 300 mm naval gun of the Imperial Fleet. Fires on surface coordinates from orbit. The breech holds one shell; the barrel goes on the tile in front of it.
  components:
  - type: Sprite
    layers:
    - state: medium
      map: [ "base" ]
    - state: assembled
      map: [ "assembled" ]
      shader: unshaded
      visible: false
    - state: loaded
      map: [ "loaded" ]
      shader: unshaded
      visible: false
  - type: DHHeavyGunBreech
    caliber: 300
    role: Artillery
    reloadTime: 45
    flightTime: 10
    spread: 3
    hitChance: 0.5
    hullDamage: 0
    loadTime: 4

