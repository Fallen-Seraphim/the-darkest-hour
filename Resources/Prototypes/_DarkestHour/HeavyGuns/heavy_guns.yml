# --- Консоли наведения: работают, только если оператор сидит на стуле ---

- type: entity
  parent: BaseComputer
  id: DHComputerNavalArtillery
  name: naval artillery console
  description: Lays the guns of the ship on coordinates on the surface of the world below. The gunner has to be seated.
  components:
  - type: ComputerVisuals
    stateScreen: explosive
    stateKeys: syndie_key
  - type: DHHeavyGunConsole
    role: Artillery
  - type: ActivatableUI
    key: enum.DHHeavyGunUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DHHeavyGunUiKey.Key:
        type: DHHeavyGunBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: DHNavalArtilleryComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#e8b04a"

- type: entity
  parent: BaseComputer
  id: DHComputerAntiOrbital
  name: anti-orbital fire control console
  description: Lays the anti-orbital guns on ships in orbit above. The gunner has to be seated.
  components:
  - type: ComputerVisuals
    stateScreen: explosive
    stateKeys: security_key
  - type: DHHeavyGunConsole
    role: AntiOrbital
  - type: ActivatableUI
    key: enum.DHHeavyGunUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DHHeavyGunUiKey.Key:
        type: DHHeavyGunBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: DHAntiOrbitalComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#7fae46"

- type: entity
  parent: BaseComputerCircuitboard
  id: DHNavalArtilleryComputerCircuitboard
  name: naval artillery console board
  description: A computer printed circuit board for a naval artillery console.
  components:
  - type: Sprite
    state: cpu_security
  - type: ComputerBoard
    prototype: DHComputerNavalArtillery

- type: entity
  parent: BaseComputerCircuitboard
  id: DHAntiOrbitalComputerCircuitboard
  name: anti-orbital fire control console board
  description: A computer printed circuit board for an anti-orbital fire control console.
  components:
  - type: Sprite
    state: cpu_security
  - type: ComputerBoard
    prototype: DHComputerAntiOrbital

# --- ПВО: перехват тяжёлых снарядов противника ---

- type: entity
  abstract: true
  parent: DHHeavyGunPartBase
  id: DHInterceptorBase
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/HeavyGuns/interceptors.rsi
    noRot: false

- type: entity
  parent: DHInterceptorBase
  id: DHMissileLauncher
  name: point-defence missile launcher
  description: An Imperial launcher of interceptor missiles. Tries to shoot down anti-orbital shells flying at its ship; each attempt costs a missile.
  components:
  - type: Sprite
    state: launcher
  - type: DHInterceptor
    kind: Missile
    ammo: 4
    maxAmmo: 4
    chance: 0.3
    cooldown: 5

- type: entity
  parent: DHInterceptorBase
  id: DHMissileSilo
  name: interceptor missile silo
  description: A Republican silo of interceptor missiles. Shoots down artillery shells falling within 150 m and fires at a carrier hovering in the atmosphere within 1.5 km; each shot costs a missile.
  components:
  - type: Sprite
    state: silo
  - type: DHInterceptor
    kind: Missile
    ammo: 6
    maxAmmo: 6
    chance: 0.4
    radius: 150
    cooldown: 6
    airRange: 1500
    airChance: 0.5
    airDamage: 4

- type: entity
  parent: DHInterceptorBase
  id: DHAutocannonTwin30
  name: twin 30 mm autocannon
  description: A Republican twin 30 mm air-defence autocannon. Puts up flak against artillery shells falling within 100 m and fires at a carrier hovering in the atmosphere within 700 m; each burst costs one charge, a box holds four.
  components:
  - type: Sprite
    state: autocannon
  - type: DHInterceptor
    kind: Autocannon
    ammo: 12
    maxAmmo: 12
    chance: 0.25
    radius: 100
    cooldown: 3
    airRange: 700
    airChance: 0.4
    airDamage: 1.5

- type: entity
  parent: BaseItem
  id: DHInterceptorMissile
  name: interceptor missile
  description: "An interceptor missile for a launcher or a silo. Heavy: carry it with both hands."
  components:
  - type: Sprite
    sprite: _DarkestHour/Objects/Weapons/HeavyGuns/interceptor_ammo.rsi
    state: missile
  - type: Item
    size: Ginormous
    sprite: _DarkestHour/Objects/Weapons/HeavyGuns/interceptor_ammo.rsi
  - type: MultiHandedItem
  - type: HeldSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: DHInterceptorAmmo
    kind: Missile
    amount: 1
  - type: StaticPrice
    price: 300

- type: entity
  parent: BaseItem
  id: DHAutocannonAmmoBox30
  name: 30 mm flak ammunition box
  description: Belted 30 mm flak rounds for a twin autocannon. Enough for four bursts (four charges).
  components:
  - type: Sprite
    sprite: _DarkestHour/Objects/Weapons/HeavyGuns/interceptor_ammo.rsi
    state: box
  - type: Item
    size: Large
    sprite: _DarkestHour/Objects/Weapons/HeavyGuns/interceptor_ammo.rsi
  - type: DHInterceptorAmmo
    kind: Autocannon
    amount: 4
  - type: StaticPrice
    price: 100

# --- Метка удара: красный прицел за несколько секунд до падения снаряда ---

- type: entity
  id: DHStrikeMarker
  name: incoming strike
  description: Something very heavy is about to land here. Run.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/HeavyGuns/strike_marker.rsi
    state: marker
    shader: unshaded
    drawdepth: Effects
  - type: PointLight
    radius: 3
    energy: 2
    color: "#ff3020"
  - type: TimedDespawn
    lifetime: 5.5

# --- Маяк высадки: включённый на поверхности — парашютисты из корабля в атмосфере приземляются у него ---

- type: entity
  parent: BaseItem
  id: DHDropBeacon
  name: paradrop beacon
  description: A tripod radio beacon of the Imperial Marine Corps. Switched on and set down on the surface, it guides paratroopers jumping from a ship in the atmosphere above to land next to it.
  components:
  - type: Sprite
    sprite: _DarkestHour/Objects/Weapons/HeavyGuns/drop_beacon.rsi
    layers:
    - state: icon
    - state: light
      map: [ "light" ]
      shader: unshaded
      visible: false
  - type: Item
    size: Normal
    sprite: _DarkestHour/Objects/Weapons/HeavyGuns/drop_beacon.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DHDropBeaconVisuals.Active:
        light:
          True: { visible: true }
          False: { visible: false }
  - type: DHDropBeacon
  - type: StaticPrice
    price: 200
