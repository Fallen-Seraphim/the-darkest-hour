# Пехотные пушки (решение автора 2026-10-25). Механика — DHHeavyGunSystem.FieldGun, буксировка — DHFieldGunTowSystem.
# Чтобы стрелять, пушку ставят на позицию ключом (закрепить); чтобы катить — открепляют и тянут (медленно).
# Направление лафета меняется поворотом, пока пушка не закреплена; ствол ходит в секторе ±30° от него.

- type: entity
  abstract: true
  parent: [ BaseStructureDynamic, StructureWheeled ]
  id: DHFieldGunBase
  components:
  - type: Sprite
    state: deployed
    noRot: false
    drawdepth: Objects
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
    delay: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 400
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Injurable
    damageContainer: Inorganic
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ActivatableUI
    key: enum.DHFieldGunUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DHFieldGunUiKey.Key:
        type: DHFieldGunBoundUserInterface

- type: entity
  parent: DHFieldGunBase
  id: DHFieldGun75
  name: 75 mm infantry gun
  description: "A light Imperial infantry gun on a wheeled carriage. Wrench it down to fire; the gunner sets the traverse and elevation, a second crewman loads faster. Up to 10° it fires point-blank, higher — over obstacles. Can be dropped by parachute from a ship hovering in the atmosphere."
  components:
  - type: Sprite
    sprite: _DarkestHour/Objects/Weapons/FieldGuns/field_gun_75.rsi
  - type: DHFieldGun
    caliber: 75
    towSpeed: 0.6
  - type: DHParadroppable
    requiredParachutes: 3

- type: entity
  parent: DHFieldGunBase
  id: DHFieldGun90
  name: 90 mm infantry gun
  description: "A heavy Republican infantry gun on a wheeled carriage. Wrench it down to fire; the gunner sets the traverse and elevation, a second crewman loads faster. Up to 10° it fires point-blank, higher — over obstacles. It can be rolled, slowly."
  components:
  - type: Sprite
    sprite: _DarkestHour/Objects/Weapons/FieldGuns/field_gun_90.rsi
  - type: DHFieldGun
    caliber: 90
    towSpeed: 0.35
    loadTime: 2.5
    soloLoadTime: 6
    reloadTime: 4

# --- Снаряды ---

- type: entity
  abstract: true
  parent: BaseItem
  id: DHFieldGunShellBase
  components:
  - type: Sprite
    sprite: _DarkestHour/Objects/Weapons/FieldGuns/shells.rsi
  - type: Item
    size: Large
    shape:
    - 0,0,1,1

- type: entity
  parent: DHFieldGunShellBase
  id: DHFieldShell75HE
  name: 75 mm HE-frag shell
  description: A high-explosive fragmentation shell for the 75 mm infantry gun.
  components:
  - type: Sprite
    state: he
  - type: DHFieldGunShell
    caliber: 75
    warhead: HighExplosive
    maxRange: 100
    directSpeed: 32
    projectile: DHFieldShellFlightHE

- type: entity
  parent: DHFieldGunShellBase
  id: DHFieldShell75Incendiary
  name: 75 mm incendiary shell
  description: An incendiary shell for the 75 mm infantry gun.
  components:
  - type: Sprite
    state: incendiary
  - type: DHFieldGunShell
    caliber: 75
    warhead: Incendiary
    maxRange: 90
    directSpeed: 30
    projectile: DHFieldShellFlightIncendiary

- type: entity
  parent: DHFieldGunShellBase
  id: DHFieldShell75APFSDS
  name: 75 mm APFSDS shell
  description: An armour-piercing fin-stabilised discarding-sabot round for the 75 mm infantry gun. Flat and fast, it punches through several obstacles, but is useless for lobbing.
  components:
  - type: Sprite
    state: apfsds
  - type: DHFieldGunShell
    caliber: 75
    warhead: ArmorPiercing
    maxRange: 240
    directSpeed: 60
