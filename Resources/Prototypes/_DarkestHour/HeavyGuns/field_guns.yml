  components:
  - type: Sprite
    state: incendiary
  - type: DHFieldGunShell
    caliber: 90
    warhead: Incendiary
    maxRange: 110
    directSpeed: 32
    projectile: DHFieldShellFlightIncendiary

- type: entity
  parent: DHFieldGunShellBase
