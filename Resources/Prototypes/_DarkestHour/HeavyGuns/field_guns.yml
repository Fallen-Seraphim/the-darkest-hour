# --- Снаряд в полёте (прямая наводка); урон дан для 75 мм, у 90 мм умножается на 1.2 ---

- type: entity
  abstract: true
  parent: BaseBullet
  id: DHFieldShellFlightBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DarkestHour/Objects/Weapons/FieldGuns/shells.rsi
    layers:
    - state: flight
  - type: Reflective
    reflective: None

- type: entity
  parent: DHFieldShellFlightBase
  id: DHFieldShellFlightHE
  name: HE shell
  components:
  - type: DHBallistics
    penetrationClass: 3
  - type: Projectile
    damage:
      types:
        Blunt: 40
        Piercing: 30
        Structural: 150

- type: entity
  parent: DHFieldShellFlightBase
  id: DHFieldShellFlightIncendiary
  name: incendiary shell
  components:
  - type: DHBallistics
    penetrationClass: 3
  - type: Projectile
    damage:
      types:
        Blunt: 30
        Heat: 30
        Structural: 80

- type: entity
  parent: DHFieldShellFlightBase
  id: DHFieldShellFlightAPFSDS
  name: APFSDS dart
  components:
  - type: DHBallistics
    penetrationClass: 3
  - type: Projectile
    damage:
      types:
        Piercing: 120
        Structural: 400
    # прошивает цели, пока не отдаст столько урона (2–3 препятствия)
    penetrationThreshold: 900

