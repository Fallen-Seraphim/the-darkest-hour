# Зоны захвата «Осады». Флагшток ставится картой в центре локации (раньше — терминал захвата, решение автора
# 2026-10-30). С 2026-11-26 точки берут флагами: свой флаг в зоне, чужих нет 30 с — точка твоя; флаг ЧВК LA-V глушит
# точку. Поставок с точек больше нет. Механика — DHControlPointSystem, спрайт — Tools/_DarkestHour/control_points/build.py.

- type: entity
  abstract: true
  parent: BaseStructure
  id: DHControlPointBase
  name: flagpole
  description: The flagpole of a capture area. Plant your side's flag in the area and keep enemy flags out of it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _DarkestHour/Structures/control_point.rsi
    offset: 0,0.5
    drawdepth: Overdoors
    noRot: true
    layers:
    - state: base
    - state: flag_neutral
      map: [ "flag" ]
  - type: Icon
    sprite: _DarkestHour/Structures/control_point.rsi
    state: icon
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DHControlPointVisuals.Owner:
        flag:
          0: { state: flag_neutral }
          1: { state: flag_republic }
          2: { state: flag_empire }
          3: { state: flag_lav }
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.45,0.1,-0.2"
        density: 500
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: DHControlPointBase
  id: DHControlPointVillage
  suffix: Village
  components:
  - type: DHControlPoint
    pointId: village
    pointsPerMinute: 2 # очки командования за удержание (решение автора 2026-11-19)
    pointName: dh-control-point-village
    pointDescription: dh-control-point-village-desc
    radius: 16

- type: entity
  parent: DHControlPointBase
  id: DHControlPointSpaceport
  suffix: Spaceport
  components:
  - type: DHControlPoint
    pointId: spaceport
    pointsPerMinute: 5 # очки командования за удержание (решение автора 2026-11-19)
    pointName: dh-control-point-spaceport
    pointDescription: dh-control-point-spaceport-desc
    radius: 20

- type: entity
  parent: DHControlPointBase
  id: DHControlPointConstruction
  suffix: Construction site
  components:
  - type: DHControlPoint
    pointId: construction
    pointsPerMinute: 3 # очки командования за удержание (решение автора 2026-11-19)
    pointName: dh-control-point-construction
    pointDescription: dh-control-point-construction-desc
    radius: 14

- type: entity
  parent: DHControlPointBase
  id: DHControlPointPowerPlant
  suffix: Power plant
  components:
  - type: DHControlPoint
    pointId: npp
    pointsPerMinute: 5 # очки командования за удержание (решение автора 2026-11-19)
    pointName: dh-control-point-npp
    pointDescription: dh-control-point-npp-desc
    radius: 18
    holder: Republic

- type: entity
  parent: DHControlPointBase
  id: DHControlPointDam
  suffix: Dam
  components:
  - type: DHControlPoint
    pointId: dam
    pointsPerMinute: 3 # очки командования за удержание (решение автора 2026-11-19)
    pointName: dh-control-point-dam
    pointDescription: dh-control-point-dam-desc
    radius: 14

# --- Цепочка целей (план осады п. 1, решения автора 2026-11-19): военные объекты гарнизона, со старта у Республики.
# Захват не даёт Империи объект — он просто молчит, пока Республика не отобьёт точку.

- type: entity
  parent: DHControlPointBase
  id: DHControlPointAntiOrbital
  suffix: Anti-orbital battery
  components:
  - type: DHControlPoint
    pointId: pko
    pointsPerMinute: 4
    pointName: dh-control-point-pko
    pointDescription: dh-control-point-pko-desc
    radius: 16
    holder: Republic

- type: entity
  parent: DHControlPointBase
  id: DHControlPointAirDefence
  suffix: Air defence site
  components:
  - type: DHControlPoint
    pointId: pvo
    pointsPerMinute: 4
    pointName: dh-control-point-pvo
    pointDescription: dh-control-point-pvo-desc
    radius: 20
    holder: Republic

- type: entity
  parent: DHControlPointBase
  id: DHControlPointRadar
  suffix: Radar and comms post
  components:
  - type: DHControlPoint
    pointId: rls
    pointsPerMinute: 4
    pointName: dh-control-point-rls
    pointDescription: dh-control-point-rls-desc
    radius: 18
    holder: Republic
    # Пока точка не у Республики, общий канал гарнизона слышно только вблизи.
    jamChannels: [ DHRepublic ]
    jamFaction: Republic
    jamRange: 15

# Большой Терминус (решения автора 2026-11-27): нефтяной терминал с танкером и завод (вместо стройки).
- type: entity
  parent: DHControlPointBase
  id: DHControlPointTerminal
  suffix: Oil terminal
  components:
  - type: DHControlPoint
    pointId: terminal
    pointsPerMinute: 3
    pointName: dh-control-point-terminal
    pointDescription: dh-control-point-terminal-desc
    radius: 18

- type: entity
  parent: DHControlPointBase
  id: DHControlPointFactory
  suffix: Factory
  components:
  - type: DHControlPoint
    pointId: factory
    pointsPerMinute: 3
    pointName: dh-control-point-factory
    pointDescription: dh-control-point-factory-desc
    radius: 18
