# Отряды «Штурма» (решение автора 2026-11-05). Механика — DHSquadSystem: консоль отрядов (командование стороны)
# назначает бойца в отряд, в его гарнитуре отрядный ключ меняется на ключ нового отряда (нет — добавляется).
# Рации отрядов: Республика — :1 Альфа, :2 Браво, :3 Чарли, :4 Дельта; Империя — :5 Тау, :6 Эпсилон, :7 Омега.
# Каналы отрядов, как и основные, работают только в зоне живого ретранслятора стороны (DHCommsSystem).

- type: radioChannel
  id: DHSquadAlpha
  name: dh-chat-radio-squad-alpha
  keycode: '1'
  frequency: 148.1
  color: "#5fb0ff"
  longRange: true

- type: entity
  parent: [ EncryptionKey, BaseCentcommContraband ]
  id: DHEncryptionKeySquadAlpha
  name: Alpha squad encryption key
  description: An encryption key for the Alpha squad net. Squad keys are swapped by the squad console.
  components:
  - type: EncryptionKey
    channels:
    - DHSquadAlpha
    defaultChannel: DHSquadAlpha
  - type: Sprite
    layers:
    - state: crypt_rusted
    - state: nano_label

- type: dhSquad
  id: Alpha
  name: dh-squad-name-alpha
  faction: Republic
  channel: DHSquadAlpha
  key: DHEncryptionKeySquadAlpha
  color: "#5fb0ff"
  order: 0
  trackerAlert: DHSquadTrackerAlpha

