# --- Консоли отрядов ---

- type: entity
  abstract: true
  parent: BaseComputer
  id: DHComputerSquadsBase
  components:
  - type: ComputerVisuals
    stateScreen: id
    stateKeys: tech_key
  - type: ActivatableUI
    key: enum.DHSquadConsoleUiKey.Key
  - type: ActivatableUIRequiresVision
  - type: UserInterface
    interfaces:
      enum.DHSquadConsoleUiKey.Key:
        type: DHSquadConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0

- type: entity
  parent: DHComputerSquadsBase
  id: DHComputerSquadsRepublic
  name: garrison squad console
  description: The garrison command's squad roster. Assign soldiers to the Alpha, Bravo, Charlie and Delta squads; their headsets get the squad key at once.
  components:
  - type: DHSquadConsole
    faction: Republic
  # Только командование гарнизона (командир, офицеры, арт. офицер).
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [ [ "DHRepublicCommand" ] ]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#8fd66b"

- type: entity
  parent: DHComputerSquadsBase
  id: DHComputerSquadsEmpire
  name: landing force squad console
  description: The landing force command's squad roster. Assign marines to the Tau, Epsilon and Omega squads; their headsets get the squad key at once.
  components:
  - type: DHSquadConsole
    faction: Empire
  - type: ComputerVisuals
    stateScreen: id
    stateKeys: syndie_key
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#e8604a"
