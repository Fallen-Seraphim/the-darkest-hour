# Шлюзы RMC-14 (спрайты cmss13, звуки RMC) для Терминуса и бункера: доступ, болты и провода — от наших шлюзов.
# Спрайты: Tools/_DarkestHour/reskin/rmc_airlocks.py. Направление 0 — дверь в стене запад-восток,
# поворот 90° — в стене север-юг (генератор карт ставит поворот сам).

- type: entity
  parent: Airlock
  id: DHAirlockRMCColony
  suffix: RMC, Colony
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/Doors/Airlocks/RMC/hybrisa_door.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseUnlit"]
      visible: true
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: bolted_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
    - state: emergency_unlit
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
    - state: panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: sparks
      shader: unshaded
      visible: false
      map: ["enum.DoorVisualLayers.BaseEmagging"]
  - type: Icon
    sprite: _DarkestHour/Structures/Doors/Airlocks/RMC/hybrisa_door.rsi
    state: closed
  - type: Door
    crushDamage:
      types:
        Blunt: 15
    openSound:
      path: /Audio/_RMC14/Machines/airlock.ogg
    closeSound:
      path: /Audio/_RMC14/Machines/airlock.ogg
    denySound:
      path: /Audio/_RMC14/Machines/buzz_two.ogg
  - type: Paintable
    group: null

