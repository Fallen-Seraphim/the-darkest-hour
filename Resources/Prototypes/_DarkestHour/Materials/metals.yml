# DarkestHour: жилы базовых металлов в астероидах (магнит утилизаторов).

- type: entity
  abstract: true
  id: DHBaseVeinAluminium
  suffix: Aluminium
  description: An ore vein rich with bauxite.
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreAluminium
  - type: Sprite
    layers:
    - state: rock_bauxite
      sprite: _DarkestHour/Structures/Walls/stone-ore.rsi
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

- type: entity
  parent: [ DHBaseVeinAluminium, AsteroidRock ]
  id: DHAsteroidRockAluminium

- type: oreDunGen
  id: DHOreAluminium
  replacement: AsteroidRock
