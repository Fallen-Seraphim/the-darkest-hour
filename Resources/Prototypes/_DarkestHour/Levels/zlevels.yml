# Z-уровни: переходы без ключа — ведут в ту же точку XY на соседнем уровне стопки (DHZLevelComponent на карте).
# Механика — DHZLadderSystem (лестницы), DHZTransitSystem (падение, взгляд) и DHLevelSystem (лифты, люки с ключом).

# --- Универсальная лестница (решение автора 2026-11-27): вместо маршей, проёмов, «лестниц наверх» и «люков вниз».
# Ставится на каждом уровне в одной точке; ведёт туда, где в той же точке на соседнем уровне стоит другая. Спрайт
# (RMC-14) выбирается сам: низ — лестница вверх, середина — сквозная, верх — проём с лестницей вниз.

- type: entity
  abstract: true
  parent: BaseStructure
  id: DHZLadderBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: DHZLadder
  - type: Appearance
  - type: Tag
    tags:
    - Structure

- type: entity
  parent: DHZLadderBase
  id: DHZLadder
  name: ladder
  description: A steel ladder between levels. Click to climb up (or down if there's nothing above); more in the alternative actions.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/ladder.rsi
    drawdepth: Objects
    layers:
    - state: ladder11
      map: [ "base" ]
  - type: GenericVisualizer
    visuals:
      enum.DHZLadderVisuals.Connections:
        base:
          None: { state: ladder10 }
          Up: { state: ladder10 }
          Down: { state: ladder01 }
          Both: { state: ladder11 }

- type: entity
  parent: DHZLadderBase
  id: DHZManhole
  name: manhole
  description: A heavy cast-iron cover over a shaft into the sewers. Use it to climb down.
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/Levels/levels.rsi
    state: manhole
    drawdepth: FloorObjects
  - type: DHZLadder
    delay: 3

- type: entity
  parent: DHLiftPlatformBase
  id: DHZLiftPlatform
  name: lift platform
  description: A lift platform. Platforms in the same spot on other levels make up one shaft; whatever stands on it rides along.
  components:
  - type: DHLift

- type: entity
  parent: DHLiftPanelBase
  id: DHZLiftPanel
  name: lift panel
  description: Opens the floor panel of the shaft. Send what's on the platform to any floor, or call the cargo from there.
  components:
  - type: DHLiftPanel
  - type: ActivatableUI
    key: enum.DHLiftPanelUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DHLiftPanelUiKey.Key:
        type: DHLiftPanelBoundUserInterface

# --- Взгляд на соседние уровни ---

- type: entity
  id: DHZLevelCamera
  name: level view
  categories: [ HideSpawnMenu ]
  components:
  - type: Eye
  - type: DHZCamera

- type: entity
  parent: BaseAction
  id: DHActionLookUp
  name: Look up
  description: Toggle looking at the level above — in the open, or by a ladder or lift shaft. You can walk while looking. Press again to stop (with a wielded x8/x16 scope — to look higher first).
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    sprite: _DarkestHour/Interface/Actions/zlevels.rsi
    layers:
    - state: look_up
  - type: InstantAction
    event: !type:DHLookUpActionEvent

- type: entity
  parent: BaseAction
  id: DHActionLookDown
  name: Look down
  description: Toggle looking at the level below — over an edge, or by a ladder, manhole or lift shaft. You can walk while looking. Press again to stop (with a wielded x8 scope — 3 levels, x16 — all, deeper first).
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    sprite: _DarkestHour/Interface/Actions/zlevels.rsi
    layers:
    - state: look_down
  - type: InstantAction
    event: !type:DHLookDownActionEvent

- type: entity
  id: DHZLevelProbe
  name: level probe
  categories: [ HideSpawnMenu ]
  components:
  - type: Eye

- type: entity
  parent: BaseAction
  id: DHActionGhostLevelUp
  name: Level up
  description: Move to the same spot one Z-level higher.
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _DarkestHour/Interface/Actions/zlevels.rsi
    layers:
    - state: look_up
  - type: InstantAction
    event: !type:DHGhostLevelUpActionEvent

- type: entity
  parent: BaseAction
  id: DHActionGhostLevelDown
  name: Level down
  description: Move to the same spot one Z-level lower.
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _DarkestHour/Interface/Actions/zlevels.rsi
    layers:
    - state: look_down
  - type: InstantAction
    event: !type:DHGhostLevelDownActionEvent
