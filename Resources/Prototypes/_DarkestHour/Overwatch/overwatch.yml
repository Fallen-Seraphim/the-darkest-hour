# Наблюдение («оверватч», по образцу RMC-14): бойцы своей стороны, вид их глазами и приказы — по отрядам (выбор
# отряда на консоли, решение автора 2026-11-26); всей стороне — с компьютеров наблюдения и командных планшетов.
# Механика — DHOverwatchSystem. Работает между картами: с авианосца видно десант на поверхности.

- type: entity
  abstract: true
  id: DHOverwatchBase
  components:
  - type: ActivatableUI
    key: enum.DHOverwatchUiKey.Key
  - type: ActivatableUIRequiresVision
  - type: UserInterface
    interfaces:
      enum.DHOverwatchUiKey.Key:
        type: DHOverwatchBoundUserInterface

# --- Стационарные консоли ---

- type: entity
  parent: [ BaseComputer, DHOverwatchBase ]
  id: DHComputerOverwatchRepublic
  name: garrison overwatch computer
  description: Shows every soldier of the garrison, their condition and position, and the view from their helmet cameras. Pick a squad to see its soldiers and order it, or order the whole garrison.
  components:
  - type: DHScanTarget # глобальный скан: база Республики (КП; виден всегда, в бункере — не на поверхности)
    kind: Base
    faction: Republic
    alwaysVisible: true
  - type: ComputerVisuals
    stateScreen: cameras
    stateKeys: tech_key
  - type: DHOverwatchConsole
    faction: Republic
    factionOrders: true
  - type: UserInterface
    interfaces:
      enum.DHOverwatchUiKey.Key:
        type: DHOverwatchBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: DHOverwatchRepublicComputerCircuitboard
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#8fd66b"

- type: entity
  parent: [ BaseComputer, DHOverwatchBase ]
  id: DHComputerOverwatchEmpire
  name: landing overwatch computer
  description: Shows every Imperial marine and crewman, their condition and position, and the view from their helmet cameras, even on the surface below. Pick a squad to see its marines and order it, or order the whole landing force.
  components:
  - type: ComputerVisuals
    stateScreen: cameras
    stateKeys: syndie_key
  - type: DHOverwatchConsole
    faction: Empire
    factionOrders: true
  - type: UserInterface
    interfaces:
      enum.DHOverwatchUiKey.Key:
        type: DHOverwatchBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: DHOverwatchEmpireComputerCircuitboard
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#e8b04a"

- type: entity
  parent: BaseComputerCircuitboard
  id: DHOverwatchRepublicComputerCircuitboard
  name: garrison overwatch computer board
  description: A computer printed circuit board for a garrison overwatch computer.
  components:
  - type: Sprite
    state: cpu_security
  - type: ComputerBoard
    prototype: DHComputerOverwatchRepublic

- type: entity
  parent: BaseComputerCircuitboard
  id: DHOverwatchEmpireComputerCircuitboard
  name: landing overwatch computer board
  description: A computer printed circuit board for a landing overwatch computer.
  components:
  - type: Sprite
    state: cpu_security
  - type: ComputerBoard
    prototype: DHComputerOverwatchEmpire

# --- Полевые планшеты командиров ---

- type: entity
  abstract: true
  parent: [ BaseItem, DHOverwatchBase ]
  id: DHOverwatchTabletBase
  components:
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Devices/command_tablet.rsi
  - type: ActivatableUI
    key: enum.DHOverwatchUiKey.Key
    inHandsOnly: true
  # Командный планшет RMC-14 (решение автора 2026-11-27: спрайт для всех планшетов).
  - type: Sprite
    sprite: _RMC14/Objects/Devices/command_tablet.rsi
    state: cotablet

- type: entity
  parent: DHOverwatchTabletBase
  id: DHOverwatchTabletRepublic
  name: garrison command tablet
  description: A field tablet linked to the helmet cameras of the garrison. Orders typed here reach the chosen squad.
  components:
  - type: DHOverwatchConsole
    faction: Republic

- type: entity
  parent: DHOverwatchTabletBase
  id: DHOverwatchTabletEmpire
  name: landing command tablet
  description: A field tablet linked to the helmet cameras of the landing force. Orders typed here reach the chosen squad.
  components:
  - type: DHOverwatchConsole
    faction: Empire

# Командные планшеты: приказы и всей стороне (командир базы, командующий операцией, капитан авианосца).
- type: entity
  parent: DHOverwatchTabletRepublic
  id: DHOverwatchTabletRepublicCommand
  name: garrison commander's tablet
  description: The base commander's field tablet linked to the helmet cameras of the whole garrison. Orders typed here reach the chosen squad or every soldier of the base.
  components:
  - type: DHOverwatchConsole
    faction: Republic
    factionOrders: true

- type: entity
  parent: DHOverwatchTabletEmpire
  id: DHOverwatchTabletEmpireCommand
  name: operation command tablet
  description: The operation command's field tablet linked to the helmet cameras of the whole landing force. Orders typed here reach the chosen squad or every marine and crewman.
  components:
  - type: DHOverwatchConsole
    faction: Empire
    factionOrders: true

# Командный планшет командующего (решение автора 2026-11-27): командный планшет и планшет объявлений в одном —
# кнопка «Объявление» в окне планшета открывает объявления всей стороне. У командира базы и командующего операцией.
- type: entity
  parent: DHOverwatchTabletRepublicCommand
  id: DHCommandTabletRepublic
  name: garrison commander's tablet
  description: The base commander's field tablet linked to the helmet cameras of the whole garrison. Orders typed here reach the chosen squad or every soldier of the base; announcements go to the whole garrison.
  components:
  - type: UserInterface
    interfaces:
      enum.DHOverwatchUiKey.Key:
        type: DHOverwatchBoundUserInterface
      enum.DHFactionAnnouncerUiKey.Key:
        type: DHFactionAnnouncerBoundUserInterface
  - type: DHFactionAnnouncer
    faction: Republic
    sender: dh-faction-announce-sender-republic

- type: entity
  parent: DHOverwatchTabletEmpireCommand
  id: DHCommandTabletEmpire
  name: operation commander's tablet
  description: The operation commander's field tablet linked to the helmet cameras of the whole landing force. Orders typed here reach the chosen squad or every marine and crewman; announcements go to the whole landing force.
  components:
  - type: UserInterface
    interfaces:
      enum.DHOverwatchUiKey.Key:
        type: DHOverwatchBoundUserInterface
      enum.DHFactionAnnouncerUiKey.Key:
        type: DHFactionAnnouncerBoundUserInterface
  - type: DHFactionAnnouncer
    faction: Empire
    sender: dh-faction-announce-sender-empire

# Командный планшет ЧВК LA-V (решение автора 2026-11-26): у командира отряда — бойцы LA-V, вид их глазами, тактическая
# карта (только общеизвестное: зоны, ЗП, ориентиры) и приказы отряду крупно на экран.
- type: entity
  parent: DHOverwatchTabletBase
  id: DHOverwatchTabletLAV
  name: LA-V command tablet
  description: A corporate tablet linked to the body cameras of the LA-V squad. Shows the contract and how the operation goes; orders typed here appear before the eyes of every contractor.
  components:
  - type: DHOverwatchConsole
    lav: true
    orderSender: dh-overwatch-order-sender-lav
