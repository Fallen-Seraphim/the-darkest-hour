# Местность нарисованных вручную планет (DHPlanetBase mapped: true): край карты, вода, ЛЭП и подстанция, фонари от сети АЭС.

# Край района операции: неразрушимый песчаник по границе карты. Ставится и обновляется скриптом
# Tools/_DarkestHour/planet_map/prepare.py — вручную не расставлять.
- type: entity
  parent: BaseWall
  id: DHWorldEdgeSand
  name: sandstone cliff
  description: A sheer cliff of solid sandstone. The operation area ends here.
  suffix: world edge, indestructible
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Structures/Walls/stone-sand.rsi
  - type: Icon
    sprite: Structures/Walls/stone-sand.rsi
    state: full
  - type: IconSmooth
    key: stone
    states:
    - !type:CornerSpriteSmoothing
      mask: [ stone, doors ]
      base: stone
      index: 0

# --- Вода ---
# Своя вода без раствора и регенерации (на карте её тысячи клеток). Набрать воды —
# ёмкостью по клетке (DHWaterSource, запас бесконечный); на воде не горит огонь; горящий, зайдя в воду, гаснет.

- type: entity
  abstract: true
  id: DHWaterBase
  name: water
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  # Решение автора 2026-11-26: вода как в RuCM — тайлы моря cmss13 (через RMC-14), погружение в воду и волны вокруг
  # (DHWaterDepth, DHWaterVisualsSystem), шаги вброд.
  - type: Sprite
    sprite: _RMC14/Tiles/planet/water.rsi
    state: seashallow
    drawdepth: BelowFloor
  - type: Physics
    bodyType: Static
  - type: FootstepModifier
    footstepSoundCollection:
      collection: RMCWaterShallowWading
  - type: DHWaterDepth
    depth: 8
  - type: PlacementReplacement
    key: tileOverlay
  - type: DHWaterSource

- type: entity
  parent: DHWaterBase
  id: DHWaterShallow
  name: shallow water
  description: Knee-deep water. Wading through it is slow.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: DHTacticalTerrain
    kind: Water
  # Горящий боец, зайдя в воду, гаснет (как в ванильной воде); вода смывает кровь с одежды и снаряжения (решение
  # автора 2026-11-26).
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
  - type: TileEntityEffect
    effects:
    - !type:Extinguish
    - !type:DHWashEquipment

- type: entity
  parent: DHWaterBase
  id: DHWaterDeep
  name: deep water
  description: Too deep and cold to cross on foot. Bullets fly over it just fine.
  components:
  - type: Sprite
    state: seadeep
  - type: FootstepModifier
    footstepSoundCollection:
      collection: RMCWaterDeepWading
  - type: DHWaterDepth
    depth: 18
  - type: Fixtures
    fixtures:
      # Как стол: люди не проходят, пули и брошенные вещи пролетают.
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
        - LowImpassable
        density: 1000
  - type: DHTacticalTerrain
    kind: DeepWater

# --- Кромки мелководья (решение автора 2026-11-26) ---
# Мелководье у берега — с волнами и пеной, суша на спрайте прозрачна, и под кромкой видна земля клетки; у глубокой
# воды — плавный переход. Спрайты desert_water cmss13 (через RMC-14 / RuCM), перекрашенные под наше море. Исходный кадр
# смотрит сушей (глубиной) на юг или в юго-западный угол; генератор карты поворачивает сущность.

- type: entity
  abstract: true
  parent: DHWaterShallow
  id: DHWaterShoreBase
  suffix: shore
  components:
  - type: Sprite
    sprite: _DarkestHour/Tiles/shore.rsi
    state: shore1
  - type: DHWaterDepth
    depth: 4

- type: entity
  parent: DHWaterShoreBase
  id: DHWaterShore1
  components:
  - type: Sprite
    state: shore1

- type: entity
  parent: DHWaterShoreBase
  id: DHWaterShore2
  components:
  - type: Sprite
    state: shore2

- type: entity
  parent: DHWaterShoreBase
  id: DHWaterShore3
  components:
  - type: Sprite
    state: shore3

- type: entity
  parent: DHWaterShoreBase
  id: DHWaterShoreInner
  components:
  - type: Sprite
    state: shore_inner

- type: entity
  parent: DHWaterShoreBase
  id: DHWaterShoreOuter1
  components:
  - type: Sprite
    state: shore_outer1

- type: entity
  parent: DHWaterShoreBase
  id: DHWaterShoreOuter2
  components:
  - type: Sprite
    state: shore_outer2

- type: entity
  parent: DHWaterShoreBase
  id: DHWaterDeepEdge
  components:
  - type: Sprite
    state: deep_edge
  - type: DHWaterDepth
    depth: 8

- type: entity
  parent: DHWaterShoreBase
  id: DHWaterDeepInner
  components:
  - type: Sprite
    state: deep_inner
  - type: DHWaterDepth
    depth: 8

- type: entity
  parent: DHWaterShoreBase
  id: DHWaterDeepOuter
  components:
  - type: Sprite
    state: deep_outer
  - type: DHWaterDepth
    depth: 8

# --- ЛЭП и подстанция (декор) ---

- type: entity
  parent: BaseStructure
  id: DHPowerPylon
  name: power line pylon
  description: A lattice steel pylon carrying high-voltage lines from the power plant.
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/Power/power_line.rsi
    state: pylon
    offset: 0,1
    drawdepth: LargeObjects
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.45,0.35,0.3"
        density: 500
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 4
            max: 8
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: DHPowerLineWire
  name: high-voltage line
  description: Overhead high-voltage wires. Best not to touch.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _DarkestHour/Structures/Power/power_line_wire.rsi
    state: wire
    drawdepth: Overdoors
  - type: Icon
    sprite: _DarkestHour/Structures/Power/power_line_wire.rsi
    state: icon

- type: entity
  parent: BaseStructure
  id: DHPowerTransformer
  name: power transformer
  description: A huge oil-filled step-down transformer. It hums with barely contained power.
  components:
  - type: Sprite
    sprite: _DarkestHour/Structures/Power/transformer.rsi
    state: transformer
    drawdepth: LargeObjects
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.45,-1.45,1.45,1.3"
        density: 2000
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: AmbientSound
    volume: -6
    range: 6
    sound:
      path: /Audio/Ambience/Objects/emf_buzz.ogg

# --- Фонари от сети АЭС ---

- type: entity
  parent: LightPostSmall
  id: DHLightPostGrid
  name: post light
  suffix: NPP grid
  description: A street light fed by the power plant grid. Goes dark when the plant is lost.
  components:
  - type: DHControlPointPowered
    point: npp

# --- Свет и резерв «Терминуса» (решение автора 2026-11-12) ---
# Постройки карты питаются от сети АЭС без проводки: лампы и машины гаснут, когда Республика теряет АЭС.
# У военных объектов (ПКО, ПВО, РЛС) — резервный дизель: после потери сети ещё 10 минут работы.

- type: entity
  parent: AlwaysPoweredWallLight
  id: DHGridWallLight
  suffix: NPP grid
  description: A ceiling light fed by the power plant grid. Goes dark when the plant is lost.
  components:
  - type: DHControlPointPowered
    point: npp

- type: entity
  parent: AlwaysPoweredWallLight
  id: DHBunkerWallLight
  suffix: NPP grid, backup diesel
  description: A ceiling light fed by the power plant grid, with a backup diesel for when the plant is lost.
  components:
  - type: DHControlPointPowered
    point: npp
    backup: 600

- type: entity
  parent: BaseStructure
  id: DHBackupDiesel
  name: backup diesel generator
  description: Keeps the post running for about ten minutes after the power plant grid is lost.
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/portable_generator.rsi
    state: portgen1on
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 400
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: AmbientSound
    volume: -8
    range: 5
    sound:
      path: /Audio/Ambience/Objects/engine_hum.ogg
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
