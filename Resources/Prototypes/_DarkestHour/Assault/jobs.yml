# «Штурм» (базовый режим, решение автора 2026-10-24): должности двух сторон.
# Гарнизон Республики — станция-база на планете (gameMap DHTerminus), Империя — станция-авианосец (правило DHAssaultRule).
# Снаряжение — наборы отряда зачистки Республики (Republic/gear.yml) и Имперского Рейда (ImperialRaid/raid.yml),
# но жетоны и иконки у гарнизона и десанта свои (Assault/assault.yml, StatusIcon/job.yml).

- type: job
  id: DHGarrisonCommander
  name: dh-job-garrison-commander-name
  description: dh-job-garrison-commander-desc
  playTimeTracker: JobDHGarrisonCommander
  startingGear: DHGarrisonCommanderGear
  icon: JobIconDHGarrisonCommander
  supervisors: dh-job-garrison-supervisors
  joinNotifyCrew: true
  access:
  - DHRepublic
  - DHRepublicCommand
  # ranks: build_ranks.py
  ranks:
    DHRankRepublicColonel:
    - !type:RoleTimeRequirement
      role: JobDHGarrisonCommander
      time: 360000 # 100 ч
    DHRankRepublicLieutenantColonel:
    - !type:RoleTimeRequirement
      role: JobDHGarrisonCommander
      time: 108000 # 30 ч
    DHRankRepublicMajor: []
  # /ranks

