# Награды командиров «Осады» (план п. 6, решение автора 2026-11-20). Наградной лист — у командира базы (Республика),
# командующего операцией и капитана авианосца (Империя): выбрать бойца своей стороны, медаль и формулировку; не больше
# трёх наград с листа за раунд. Награда объявляется стороне и попадает в итоги раунда. Код — DHMedalSystem.

- type: entity
  parent: BaseItem
  id: DHMedalTabletBase
  abstract: true
  name: award sheet
  description: A commander's award sheet. Pick a soldier of your side, a decoration and write the citation — the award is announced to your side and goes into the after-action report. Up to three awards per sheet.
  components:
  - type: Sprite
    sprite: Objects/Misc/clipboard.rsi
    layers:
    - state: clipboard
    - state: clipboard_paper
    - state: clipboard_pen
  - type: Item
    size: Small
  - type: ActivatableUI
    key: enum.DHMedalTabletUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.DHMedalTabletUiKey.Key:
        type: DHMedalTabletBoundUserInterface

- type: entity
  parent: DHMedalTabletBase
  id: DHMedalTabletEmpire
  suffix: Empire
  components:
  - type: DHMedalTablet
    faction: Empire

- type: entity
  parent: DHMedalTabletBase
  id: DHMedalTabletRepublic
  suffix: Republic
  components:
  - type: DHMedalTablet
    faction: Republic

