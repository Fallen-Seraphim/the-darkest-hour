# «Штурм» — базовый режим (решение автора 2026-10-24): имперский десантный авианосец прыгает из соседней системы
# и штурмует военную базу Республики на планете REP-27-7, чтобы вывезти экспериментальный образец.
# Механика — DHAssaultRuleSystem (правило), DHPlanetBaseSystem (база на поверхности планеты).

