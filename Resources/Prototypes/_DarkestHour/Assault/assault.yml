# --- Станции сторон ---

# Военная база Республики на поверхности REP-27-7 (gameMap DHTerminus задаёт должности гарнизона).
- type: entity
  id: DHStationRepublicBase
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationRecords
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: DHPlanetBase
    system: DHSystemREP27
    body: P7
    underground: /Maps/_DarkestHour/Assault/terminus_bunker.yml
    # Шахтёрский городок: вторые этажи бараков (решение автора 2026-11-12).
    levels:
      1: /Maps/_DarkestHour/Assault/terminus_p1.yml
    # Поверхность — один грид карты, без биома. Собирается генератором
    # Tools/_DarkestHour/planet_map/terminus_build.py (план автора 2026-11-12); база — из снимка terminus_base.snapshot.
    mapped: true
    groundTile: FloorAsteroidSand
    groundTiles:
    - FloorAsteroidSandBorderless
    - FloorAsteroidSandRed
    - FloorDesert
    - FloorLowDesert
    - FloorDirt
    - FloorPlanetDirt
    - FloorPlanetGrass
    - FloorGrass
  - type: DHAssaultFactionStation
    faction: Republic

