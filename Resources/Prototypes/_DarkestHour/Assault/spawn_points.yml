# Точки появления «Штурма» по должностям (решение автора 2026-11-13): командование Республики — в комендатуре,
# пехота — в казармах бункера, медики — в медблоке, зенитчики — у ПВО, сапёры и расчёты — в арсенале, экипажи — в
# ангарах. Командование Империи — в своих каютах, экипаж авианосца — на постах (пилоты у челнока, пилот штурмовика у
# лифта самолёта, артиллеристы у орудий, техники в инженерном), десант — в казармах, медики — в лаборатории, расчёты и
# экипажи — у своей техники на ВПП. Точки ставят генераторы terminus_build.py и build_carrier.py.
# job_id обязателен: точка без него принимает любую должность.

# --- Республика: командование — комендатура

- type: entity
  parent: SpawnPointJobBase
  id: DHSpawnPointRepublicCommand
  name: garrison command spawn point
  components:
  - type: SpawnPoint
    spawn_type: Job
    job_id: DHGarrisonCommander
    jobs:
    - DHGarrisonOfficer
    - DHGarrisonArtilleryOfficer
  - type: Sprite
    layers:
    - state: green
    - sprite: _DarkestHour/Interface/Misc/job_icons.rsi
      state: RepublicCommander

