# DarkestHour: вещества этапа 4 переработки химии (claude/chemistry-rework.md) — кислоты, основания и соли, оксиды,
# органика. Промежуточные звенья: из них синтезируются лекарства, удобрения, растворители. Ванильные: серная и
# ортофосфорная кислоты, гидроксид натрия, сода, щёлок, аммиак, бензол, фенол, ацетон, этанол, CO₂ и элементы.

# SO₂ — сернистый газ: удушливый, едкий. Ступень к серной кислоте.
- type: reagent
  id: DHSulfurDioxide
  name: reagent-name-dh-sulfurdioxide
  group: Toxins
  desc: reagent-desc-dh-sulfurdioxide
  physicalDesc: reagent-physical-desc-pungent
  flavor: acid
  color: "#e8e2b0"
  boilingPoint: -10
  meltingPoint: -72
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1
            Asphyxiation: 1.5
      - !type:Emote
        emote: Cough
        probability: 0.3

# SO₃ — серный ангидрид: с водой бурно даёт серную кислоту.
- type: reagent
  id: DHSulfurTrioxide
  name: reagent-name-dh-sulfurtrioxide
  group: Toxins
  desc: reagent-desc-dh-sulfurtrioxide
  physicalDesc: reagent-physical-desc-acrid
  flavor: acid
  color: "#f4f0e0"
  boilingPoint: 45
  meltingPoint: 17
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Caustic: 0.15
      - !type:Emote
        emote: Scream
        probability: 0.1
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 3
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.33

