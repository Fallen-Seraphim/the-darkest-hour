# DarkestHour: лекарства медицины DH (этап 2). Спейсациллин — антибиотик широкого спектра (бактериальные болезни,
# в т.ч. раневая инфекция после нестерильной операции); Вирацид — противовирусное (сдерживает вирус и ускоряет иммунитет).

- type: reagent
  id: DHSpacecillin
  name: reagent-name-dh-spacecillin
  group: Medicine
  desc: reagent-desc-dh-spacecillin
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#d8d0a8"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DHTreatDisease
        group: Bacteria
        amount: 0.08
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: DHSpacecillin
          min: 30
        damage:
          types:
            Poison: 1

# Морфин — сильное обезболивающее: подавляет боль (болевой шок, потерю сознания от боли). Передозировка угнетает дыхание.
- type: reagent
  id: DHMorphine
  name: reagent-name-dh-morphine
  group: Medicine
  desc: reagent-desc-dh-morphine
  physicalDesc: reagent-physical-desc-translucent
  flavor: bitter
  color: "#e8e4f0"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      - !type:DHSuppressPain
        amount: 70
        duration: 4
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.9
        sprintSpeedModifier: 0.9
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: DHMorphine
          min: 20
        damage:
          types:
            Asphyxiation: 2

- type: reagent
  id: DHViracide
  name: reagent-name-dh-viracide
  group: Medicine
  desc: reagent-desc-dh-viracide
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#9fd6c8"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DHTreatDisease
        group: Virus
        amount: 0.01
        immunity: 0.02
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: DHViracide
          min: 30
        damage:
          types:
            Poison: 1

# Хроносорб — связывает и выводит хронит. Сам токсичен: давать вместе с Dylovene. На последней стадии бессилен.
- type: reagent
  id: DHChronosorb
  name: reagent-name-dh-chronosorb
  group: Medicine
  desc: reagent-desc-dh-chronosorb
  physicalDesc: reagent-physical-desc-glowing
  flavor: bitter
  color: "#7b3fd6"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DHReduceDose
        kind: Chronite
        amount: 0.6
      - !type:HealthChange
        damage:
          types:
            Poison: 1

# Вакцины (рецепт печатает компьютер вирусолога; готовят химики). Иммунитет к болезни; идущую болезнь сильно сбивают.
- type: reagent
  id: DHVaccineCold
  name: reagent-name-dh-vaccine-cold
  group: Medicine
  desc: reagent-desc-dh-vaccine
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#c9e8d0"
  metabolisms:
    Bloodstream:
      effects:
      - !type:DHVaccinate
        disease: DHDiseaseCold

