# Боевые кличи (решение автора 2026-11-13).
# «Боевой клич» — порт эмоции Warcry из Colonial Marines Universe (AU-14, через RuCM) для Республики и военпола.
# «Имперский боевой клич» — своя эмоция Первой Империи; звук — шотландский голос Jordan («за славу», «в атаку», «вперёд»)
# и прочие атакующие кличи CMU. Свою запись «За Императора!» можно положить в Voice/Warcry/Imperial и добавить в DHImperialMaleWarcry.
# Кто может кричать — метки DHRepublicWarcry / DHImperialWarcry, их выдаёт dhComponents отдела (Assault/jobs.yml, Uprising/jobs.yml).

- type: emote
  id: DHWarcry
  name: dh-emote-name-warcry
  category: Vocal
  icon: _DarkestHour/Interface/Emotes/warcry.png
  whitelist:
    requireAll: true
    components:
    - Vocal
    - DHRepublicWarcry
  blacklist:
    components:
    - BorgChassis
  chatMessages: ["dh-chat-emote-msg-warcry"]
  chatTriggers:
  - боевой клич
  - клич
  - выкрикивает боевой клич
  - выкрикивает боевой клич!
  - warcry
  - warcry!
  - warcries

- type: emote
  id: DHImperialWarcry
  name: dh-emote-name-imperial-warcry
  category: Vocal
  icon: _DarkestHour/Interface/Emotes/imperial_warcry.png
  whitelist:
    requireAll: true
    components:
    - Vocal
    - DHImperialWarcry
  blacklist:
    components:
    - BorgChassis
  chatMessages: ["dh-chat-emote-msg-imperial-warcry"]
  chatTriggers:
  - имперский боевой клич
  - имперский клич
  - за императора
  - за императора!
  - imperial warcry
  - for the emperor
  - for the emperor!

