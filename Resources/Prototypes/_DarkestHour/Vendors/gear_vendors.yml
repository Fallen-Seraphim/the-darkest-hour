# Вендоматы снаряжения в духе морпехов RMC/CMU (решение автора 2026-11-11): вместо кейсов выбора комплекта
# бойцы берут оружие, патроны, модули и снаряжение в автоматах своей стороны. Лимит выборов — на бойца,
# общий для всех автоматов одной группы; чужие должности свои разделы не видят (медик — медицину и т. п.).
# Механика — DHGearVendorSystem. Спрайты — ColMarTech из RMC-14 (CC-BY-SA-3.0, CM-SS13).

- type: entity
  abstract: true
  id: DHGearVendorBase
  name: gear vendor
  description: An automated requisition rack. Pick your loadout; each soldier gets a limited number of choices.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/gear.rsi
    state: base
    noRot: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ActivatableUI
    key: enum.DHGearVendorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DHGearVendorUiKey.Key:
        type: DHGearVendorBoundUserInterface
  - type: Tag
    tags:
    - Structure

# --- Республика (гарнизон базы REP-27-7) ---

- type: entity
  parent: DHGearVendorBase
  id: DHGearVendorRepublicWeapons
  name: RAC weapons rack
  description: "Republican Army Corps arsenal: primary kit and spare ammunition."
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/guns.rsi
    state: base
  - type: AccessReader
    access: [["DHRepublic"]]
  - type: DHGearVendor
    group: Republic
    sections:
    - id: primary
      name: dh-gear-section-primary
      jobs: [ DHGarrisonRifleman ]
      entries:
      - set: DHRepublicSetRiflemanRifle
      - set: DHRepublicSetRiflemanMarksman
      - set: DHRepublicSetRiflemanSmg
    - id: primary
      name: dh-gear-section-primary
      jobs: [ DHGarrisonMachinegunner ]
      entries:
      - set: DHRepublicSetMachinegunnerLight
      - set: DHRepublicSetMachinegunnerHeavy
    - id: primary
      name: dh-gear-section-primary
      jobs: [ DHGarrisonSniper ]
      entries:
      - set: DHRepublicSetSniperAntiMateriel
      - set: DHRepublicSetSniperMarksman
    - id: primary
      name: dh-gear-section-primary
      jobs: [ DHGarrisonMedic ]
      entries:
      - set: DHRepublicSetMedicSmg
      - set: DHRepublicSetMedicRifle
    - id: primary
      name: dh-gear-section-primary
      jobs: [ DHGarrisonOfficer ]
      entries:
      - set: DHRepublicSetOfficerRifle
      - set: DHRepublicSetOfficerSmg
    - id: ammo
      name: dh-gear-section-ammo
      choices: 2
      entries:
      - proto: DHMagazine556x45FMG
        count: 2
        jobs: [ DHGarrisonRifleman, DHGarrisonMedic, DHGarrisonSapper ]
      - proto: DHMagazine762x51FMG
        count: 2
        jobs: [ DHGarrisonRifleman, DHGarrisonOfficer ]
      - proto: DHMagazine10x24E
        count: 2
        jobs: [ DHGarrisonRifleman, DHGarrisonMedic, DHGarrisonOfficer, DHGarrisonAAGunner, DHGarrisonCommander ]
      - proto: DHMagazineBox556x45FMG
