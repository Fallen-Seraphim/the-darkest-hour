      - proto: DHMagazineBelt762x51FMG
        jobs: [ DHGarrisonMachinegunner ]
      - proto: DHMagazine10x51FMG
        count: 2
        jobs: [ DHGarrisonSniper ]
      - proto: DHMagazine127x105SVP
        jobs: [ DHGarrisonSniper ]

