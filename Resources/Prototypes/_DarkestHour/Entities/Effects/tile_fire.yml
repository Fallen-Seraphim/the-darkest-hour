# DarkestHour: огонь на тайле (механика по образцу RMC-14, спрайт RMC-14 / CM-SS13).
- type: entity
  id: DHTileFire
  name: fire
  description: Something is burning here. Water will put it out.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Effects/fire.rsi
    noRot: true
    drawdepth: WallTops
    layers:
    - state: dynamic_4
      map: [ "enum.DHTileFireLayers.Base" ]
      shader: unshaded
  - type: Clickable
  - type: PointLight
    radius: 3.5
    energy: 2
    color: "#ee6515"
    castShadows: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DHTileFireVisuals.Level:
        enum.DHTileFireLayers.Base:
          1: { state: dynamic_1 }
          2: { state: dynamic_2 }
          3: { state: dynamic_3 }
          4: { state: dynamic_4 }
  - type: DHTileFire

# Магниевый огонь: белое пламя RMC-14 / CM-SS13 (white_*), яркий холодный свет. Реагент DHMagnesium.
- type: entity
  parent: DHTileFire
  id: DHTileFireMagnesium
  name: magnesium fire
  description: Blinding white magnesium flame. Water barely touches it.
  components:
  - type: Sprite
    sprite: _RMC14/Effects/fire.rsi
    noRot: true
    drawdepth: WallTops
    layers:
    - state: white_4
      map: [ "enum.DHTileFireLayers.Base" ]
      shader: unshaded
  - type: PointLight
    radius: 5
    energy: 4
    color: "#e4ecff"
    castShadows: false
  - type: GenericVisualizer
    visuals:
      enum.DHTileFireVisuals.Level:
        enum.DHTileFireLayers.Base:
          1: { state: white_1 }
          2: { state: white_2 }
          3: { state: white_3 }
          4: { state: white_4 }
