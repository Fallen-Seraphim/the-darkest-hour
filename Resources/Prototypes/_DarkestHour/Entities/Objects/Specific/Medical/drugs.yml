- type: entity
  parent: ChemicalMedipen
  id: DHMedipenOmnireazin
  name: omnireazine auto-injector
  description: "An army omnireazine auto-injector, the same drug as in the modular armour's auto-medkit. Knits light and moderate wounds and dulls the pain. The soldier is still wounded; they can just keep fighting. For now."
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#5bcaca"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#5bcaca"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: morphen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: morphen_empty
  - type: Solution
    solution:
      reagents:
      - ReagentId: DHOmnireazin
        Quantity: 15

- type: entity
  parent: ChemicalMedipen
  id: DHMedipenMorphine
  name: morphine auto-injector
  description: "A morphine auto-injector: strong pain relief. Do not use two in a row, it depresses breathing."
