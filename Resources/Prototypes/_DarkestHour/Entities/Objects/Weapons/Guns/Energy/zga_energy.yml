# DarkestHour: энергетическое оружие Земной Генеральной Ассоциации — ячейки, лучи, импульсы (стволы — в weapons.yml,
# генератор Tools/_DarkestHour/weapons). PRO/LR-17 — новое поколение (Процион), EAR-20/LR — довоенная винтовка
# (до Коллапса), на кейновом картридже. Обе: 20 выстрелов на ячейку.

- type: Tag
  id: DHEnergyCellPRO

- type: Tag
  id: DHKaneCartridgeEAR

- type: Tag
  id: DHBatteryAMR16

# --- ячейки (заряжаются в обычных зарядниках) ---

- type: entity
  parent: BasePowerCell
  id: DHEnergyCellPRO
  name: PRO energy cell
  description: A Procyon energy cell for the PRO/LR-17. Twenty shots per charge.
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: high
      color: "#6aa6ff"
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Tag
    tags:
    - PowerCell
    - DHEnergyCellPRO
  - type: StaticPrice
    price: 250

- type: entity
  parent: BasePowerCell
  id: DHKaneCartridgeEAR
  name: Kane cartridge
  description: A pre-Collapse Kane-crystal cartridge for the EAR-20/LR. Twenty shots per charge.
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: hyper
      color: "#8ff5e8"
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Tag
    tags:
    - PowerCell
    - DHKaneCartridgeEAR
  - type: PointLight
    radius: 1
    energy: 0.5
    color: "#6ff0e1"
  - type: StaticPrice
    price: 300

- type: entity
  parent: BasePowerCell
  id: DHBatteryAMR16
  name: PRO/AMR-16 battery pack
  description: A battery pack for the electromagnetic stage of the PRO/AMR-16. Five shots per charge.
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: medium
      color: "#8fa2c0"
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Tag
    tags:
    - PowerCell
    - DHBatteryAMR16
  - type: StaticPrice
    price: 300

# --- лучи и импульсы ---

- type: entity
  parent: LaserHitscanBase
  id: DHLaserLR17
  name: PRO/LR-17 beam
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 30
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_blue
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_blue
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_blue

# Выжигание: термический удар — страшен для пехоты без брони, пластсталь его держит (тепло снимает броня).
- type: entity
  parent: LaserHitscanBase
  id: DHLaserEARBurn
  name: EAR-20/LR thermal pulse
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 28

# Стан: парализующий импульс — выносливость и замедление, без урона.
- type: entity
  id: DHBoltEARStun
  name: EAR-20/LR stun pulse
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser
      shader: unshaded
  - type: Physics
    bodyType: Dynamic # без этого импульс висел на месте
  - type: TileFrictionModifier
    modifier: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Opaque
        - Impassable
        - BulletImpassable
  - type: Ammo
  - type: StunOnCollide
    slowdownAmount: 2.5
    walkSpeedModifier: 0.6
    sprintSpeedModifier: 0.6
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Heat: 0
    soundHit:
      collection: WeakHit
    forceSound: true
  - type: StaminaDamageOnCollide
    damage: 35
  - type: TimedDespawn
    lifetime: 3
