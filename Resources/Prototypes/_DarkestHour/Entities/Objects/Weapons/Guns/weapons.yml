    - 0,0,3,1
  - type: Clothing
    sprite: _DarkestHour/Objects/Weapons/Guns/rar_m11_1_inhands.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: GunWieldBonus
    minAngle: -3
    maxAngle: -30
  - type: Gun
    fireRate: 7.5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - SemiAuto
    minAngle: 4
    maxAngle: 40
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: "Magazine"
        startingItem: DHMagazine556x45FMG
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - DHMagazine556x45
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: "Chamber"
        startingItem: DHCartridge556x45FMG
        priority: 1
        whitelist:
          tags:
          - DHCartridge556x45
      attachment_barrel:
        insertSound: /Audio/Items/screwdriver2.ogg
        ejectSound: /Audio/Items/screwdriver2.ogg
        priority: 0
        whitelist:
          tags:
          - DHAttachmentBarrel
      attachment_grip:
        insertSound: /Audio/Items/screwdriver2.ogg
        ejectSound: /Audio/Items/screwdriver2.ogg
        priority: 0
        whitelist:
          tags:
          - DHAttachmentGrip
      attachment_optic:
        insertSound: /Audio/Items/screwdriver2.ogg
        ejectSound: /Audio/Items/screwdriver2.ogg
        priority: 0
        whitelist:
          tags:
          - DHAttachmentOptic
