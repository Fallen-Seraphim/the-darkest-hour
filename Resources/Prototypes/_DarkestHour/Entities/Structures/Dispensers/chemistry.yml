# Раздатчик химика: только элементы и базовые вещества (вода, спирт, сахар, соль, масло). Кислоты, щёлочи и
# органику синтезируют сами или заказывают ящиками в карго.
- type: entity
  id: DHChemDispenser
  parent: ChemDispenserEmpty
  suffix: DH, элементы
  components:
  - type: ReagentDispenser
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: JugAluminium
        - id: JugCarbon
        - id: JugChlorine
        - id: JugCopper
        - id: JugFluorine
        - id: JugHydrogen
        - id: JugIodine
        - id: JugIron
        - id: JugLithium
        - id: JugMercury
        - id: JugNitrogen
        - id: JugOxygen
        - id: JugPhosphorus
        - id: JugPotassium
        - id: JugSilicon
        - id: JugSilver
        - id: JugSodium
        - id: JugSulfur
        - id: DHJugZinc
        - id: JugWater
        - id: JugEthanol
        - id: JugSugar
        - id: DHJugTableSalt
        - id: DHJugOil

- type: entity
  parent: CrateChemistrySecure
  id: DHCrateChemistryAcids
  name: chemicals crate (acids)
  description: Jugs of acids for the chemistry lab. Requires Chemistry access to open.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: DHJugSulfuricAcid
        - id: DHJugNitricAcid
        - id: DHJugHydrochloricAcid
        - id: DHJugPhosphoricAcid

- type: cargoProduct
  id: DHChemistryAcids
  icon:
    sprite: Objects/Specific/Chemistry/jug.rsi
    state: icon_empty
  product: DHCrateChemistryAcids
  cost: 2000
  category: cargoproduct-category-name-medical
  group: market

- type: entity
  parent: CrateChemistrySecure
  id: DHCrateChemistryBases
  name: chemicals crate (bases and salts)
  description: Jugs of bases and salts for the chemistry lab. Requires Chemistry access to open.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: DHJugSodiumHydroxide
        - id: DHJugAmmonia
        - id: DHJugTableSalt
        - id: DHJugZinc

- type: cargoProduct
  id: DHChemistryBases
  icon:
    sprite: Objects/Specific/Chemistry/jug.rsi
