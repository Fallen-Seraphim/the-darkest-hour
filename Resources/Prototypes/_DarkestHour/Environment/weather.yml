# Погода планеты (решение автора 2026-11-01): песчаные бури REP-27-7. Расписание — DHWeatherSchedule на карте
# поверхности (DHPlanetBaseSystem), опасности — DHWeatherSystem: под открытым небом буря замедляет, сильная ещё и
# сечёт песком. Под крышей и в машинах — безопасно. Вид и звук — ванильные.

- type: entity
  parent: WeatherSandstorm
  id: DHWeatherSandstorm
  components:
  - type: DHWeatherHazard
    speedMultiplier: 0.88
    startMessage: dh-weather-sandstorm-start

- type: entity
  parent: WeatherSandstormHeavy
  id: DHWeatherSandstormHeavy
  components:
  - type: DHWeatherHazard
    speedMultiplier: 0.72
    damage:
      types:
        Slash: 0.25
    startMessage: dh-weather-sandstorm-heavy-start

# Дождь Лост-Энджелса (решение автора 2026-11-05): почти всё время идёт дождь, иногда ливень с грозой.
# Дождь не мешает, ливень немного замедляет под открытым небом.
# Спрайты — косой мелкий дождь Гибриссы из RMC-14 (CC-BY-SA-3.0, из CM-SS13).
- type: entity
  parent: WeatherRain
  id: DHWeatherRain
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_RMC14/Effects/weather.rsi
      state: hybrisa_rain_light
  - type: DHWeatherHazard
    startMessage: dh-weather-rain-start

- type: entity
  parent: WeatherStorm
  id: DHWeatherDownpour
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_RMC14/Effects/weather.rsi
      state: hybrisa_rain
  - type: DHWeatherHazard
    speedMultiplier: 0.92
    startMessage: dh-weather-downpour-start
