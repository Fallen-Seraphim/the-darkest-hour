# DarkestHour: события болезней (этап 2, шаг 6). Вспышка — случайный «нулевой пациент» без объявления; утечка из
# лаборатории — трескается одна из банок с культурой (если на станции есть банки). Лучевая и хронитовая — не события.

- type: entity
  parent: BaseGameRule
  id: DHDiseaseOutbreak
  components:
  - type: StationEvent
    weight: 6
    earliestStart: 15
    reoccurrenceDelay: 25
    minimumPlayers: 5
    duration: 1
  - type: DHDiseaseOutbreakRule
    diseases:
    - DHDiseaseCold
    - DHDiseaseCold
    - DHDiseaseFluTaurus
    - DHDiseaseDysentery
    - DHDiseasePneumonia
    - DHDiseaseHelminths
    - DHDiseaseBlackMold

# Тяжёлая вспышка — редкая и поздняя: опасные болезни (лихорадка Келвина, MRS-14, серая парша), один нулевой пациент.
- type: entity
  parent: BaseGameRule
  id: DHDiseaseOutbreakSevere
  components:
  - type: StationEvent
    weight: 2
    earliestStart: 40
    reoccurrenceDelay: 45
    minimumPlayers: 10
    duration: 1
  - type: DHDiseaseOutbreakRule
    minPatients: 1
    maxPatients: 1
    diseases:
    - DHDiseaseKelvinFever
    - DHDiseaseMRS14
    - DHDiseaseGreyScab

- type: entity
  parent: BaseGameRule
  id: DHLabLeak
  components:
  - type: StationEvent
    weight: 3
    earliestStart: 20
    reoccurrenceDelay: 30
    duration: 1
  - type: DHLabLeakRule
