# Навыки (план осады п. 12, решения автора 2026-11-26), по образцу RMC-14. Уровни: 0 — не обучен, 1 — базовая
# подготовка, 2 — специалист, 3 — мастер. delayMultipliers — длительность действий по уровням 0–3.
# Без навыка нельзя: пилотировать (штурмовик, челноки), водить и наводить танк и БТР, оперировать (и импланты),
# стрелять из ОБ, ПКО, полевых орудий и миномёта. Остальное — медленнее.

- type: dhSkill
  id: DHSkillMedical
  name: dh-skill-medical
  description: dh-skill-medical-desc
  delayMultipliers: [ 1.5, 1, 0.75, 0.5 ]

