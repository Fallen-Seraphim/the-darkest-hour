# Навыки (план осады п. 12, решения автора 2026-11-26), по образцу RMC-14. Уровни: 0 — не обучен, 1 — базовая
# подготовка, 2 — специалист, 3 — мастер. delayMultipliers — длительность действий по уровням 0–3.
# Без навыка нельзя: пилотировать (штурмовик, челноки), водить и наводить танк и БТР, оперировать (и импланты),
# стрелять из ОБ, ПКО, полевых орудий и миномёта. Остальное — медленнее.

- type: dhSkill
  id: DHSkillMedical
  name: dh-skill-medical
  description: dh-skill-medical-desc
  delayMultipliers: [ 1.5, 1, 0.75, 0.5 ]

- type: dhSkill
  id: DHSkillSurgery
  name: dh-skill-surgery
  description: dh-skill-surgery-desc
  delayMultipliers: [ 1.5, 1.25, 1, 0.75 ]

- type: dhSkill
  id: DHSkillEngineering
  name: dh-skill-engineering
  description: dh-skill-engineering-desc
  delayMultipliers: [ 1.5, 1, 0.75, 0.5 ]

- type: dhSkill
  id: DHSkillDemolitions
  name: dh-skill-demolitions
  description: dh-skill-demolitions-desc
  delayMultipliers: [ 1.5, 1, 0.75, 0.5 ]

- type: dhSkill
  id: DHSkillHeavyWeapons
  name: dh-skill-heavy-weapons
  description: dh-skill-heavy-weapons-desc
  delayMultipliers: [ 1.5, 1, 0.75, 0.6 ]

- type: dhSkill
  id: DHSkillVehicles
  name: dh-skill-vehicles
  description: dh-skill-vehicles-desc

- type: dhSkill
  id: DHSkillPiloting
  name: dh-skill-piloting
  description: dh-skill-piloting-desc

- type: dhSkill
  id: DHSkillArtillery
  name: dh-skill-artillery
  description: dh-skill-artillery-desc
  delayMultipliers: [ 1.5, 1, 0.8, 0.6 ]

- type: dhSkill
  id: DHSkillCommand
  name: dh-skill-command
  description: dh-skill-command-desc
  delayMultipliers: [ 2, 1, 0.85, 0.7 ]

# --- Брошюры (решение автора 2026-11-26), как в RMC-14: прочитать в руке — навык +1, не выше «специалиста» (2);
# одна брошюра на бойца за раунд. Навыков-запретов (пилотирование, бронетехника, хирургия, артиллерия) в брошюрах нет.

- type: entity
  abstract: true
  parent: BaseItem
  id: DHSkillPamphletBase
  name: instructional pamphlet
  description: A pamphlet used to quickly impart vital knowledge. One is enough to remember; two would be a blur.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/pamphlets.rsi
    state: pamphlet_written
  - type: Item
    size: Tiny

- type: entity
  parent: DHSkillPamphletBase
  id: DHSkillPamphletMedical
  name: field medicine pamphlet
  components:
  - type: Sprite
    state: pamphlet_medical
  - type: DHSkillPamphlet
    skill: DHSkillMedical

- type: entity
  parent: DHSkillPamphletBase
  id: DHSkillPamphletEngineering
  name: field engineering pamphlet
  components:
  - type: Sprite
    state: pamphlet_engineering
  - type: DHSkillPamphlet
    skill: DHSkillEngineering

- type: entity
  parent: DHSkillPamphletBase
  id: DHSkillPamphletDemolitions
  name: demolitions pamphlet
  components:
  - type: Sprite
    state: pamphlet_construction
  - type: DHSkillPamphlet
    skill: DHSkillDemolitions

- type: entity
  parent: DHSkillPamphletBase
  id: DHSkillPamphletHeavyWeapons
  name: heavy weapons pamphlet
  components:
  - type: Sprite
    state: pamphlet_machinegunner
  - type: DHSkillPamphlet
    skill: DHSkillHeavyWeapons

- type: entity
  parent: DHSkillPamphletBase
  id: DHSkillPamphletCommand
  name: small unit leadership pamphlet
  components:
  - type: Sprite
    state: pamphlet_jtac
  - type: DHSkillPamphlet
    skill: DHSkillCommand
    maxLevel: 1

# Ящик брошюр (карго обеих сторон, раздел «Прочее»): по две каждой.
- type: entity
  parent: CrateGenericSteel
  id: DHCrateSkillPamphlets
  name: training pamphlets crate
  description: Instructional pamphlets for the troops — medicine, engineering, demolitions, heavy weapons, leadership.
  components:
  - type: StorageFill
    contents:
    - id: DHSkillPamphletMedical
      amount: 2
    - id: DHSkillPamphletEngineering
      amount: 2
    - id: DHSkillPamphletDemolitions
      amount: 2
    - id: DHSkillPamphletHeavyWeapons
      amount: 2
    - id: DHSkillPamphletCommand
      amount: 2
