- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseStructureComputerIndestructible
  components:
  # DarkestHour: компьютеры настольные — ставятся на столы (слои как у настольных машин), см. desktop_computers.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.25"
        density: 100
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
  - type: Construction
    graph: Computer
  - type: Sprite
    drawdepth: SmallObjects # DarkestHour: настольный — поверх стола

- type: entity
  abstract: true
  parent: [ BaseStructureComputerIndestructible, StructureHealthMachineWeak ]
  id: BaseStructureComputer
  components:
  - type: Construction
    graph: Computer
    node: frameUnsecured
  - type: Damageable
    damageModifierSet: GlassReinforcedMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: monitorBroken

- type: entity
  id: ComputerFrame
  parent: BaseStructureComputer
  name: computer frame
  description: A computer under construction.
  components:
  - type: Sprite
    sprite: Structures/Machines/parts.rsi
    layers:
    - state: 0
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          frameUnsecured: { state: 0 }
          boardUnsecured: { state: 1 }
          missingWires: { state: 2 }
          monitorMissing: { state: 3 }
          monitorUnsecured: { state: 4 }

- type: entity
  parent: [ BaseStructureComputerIndestructible, StructureHealthMachineFlimsy ]
  id: ComputerBroken
  name: broken computer
  description: This computer has seen better days.
  components:
  - type: Construction
    graph: Computer
    node: monitorBroken
  - type: Sprite
    sprite: _DarkestHour/Structures/Machines/desktop_computers.rsi # DarkestHour: настольный компьютер
    drawdepth: SmallObjects # DarkestHour: настольный — поверх стола
    state: broken
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 2
          ShardGlass:
            min: 0
            max: 2
