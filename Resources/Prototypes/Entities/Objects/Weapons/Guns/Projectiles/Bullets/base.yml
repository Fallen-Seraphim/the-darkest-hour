# One bullet to bring them all into the darkness and bind them
- type: entity
  abstract: true
  id: BaseBullet
  name: BaseBullet
  description: If you can see this you're probably dead!
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
      shader: unshaded
  - type: Reflective
  - type: FlyBySound
  - type: Clickable
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: Fixtures
    fixtures:
      projectile:
        # DarkestHour: хитбокс пули вытянут вперёд (вперёд у пули — локальное −Y) до 0,8 клетки. Физика шагает по 1/60 с,
        # пуля за шаг пролетает ~0,67–0,75 клетки, а прежний хитбокс был 0,4 — между шагами оставалась щель, и пуля,
        # задевшая угол стены, иногда проскакивала её насквозь. Теперь хитбокс длиннее шага, щелей нет. Назад —
        # по-прежнему 0,3, чтобы пуля не задевала стену за спиной стрелка.
        shape: !type:PhysShapeAabb
          bounds: "-0.1,-0.5,0.1,0.3"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by: &flybyfixture
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: false
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 14
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: TimedDespawn
    lifetime: 10

- type: entity
  parent: BaseBullet
  id: BaseBulletTrigger # Trigger-on-collide bullets
  categories: [ HideSpawnMenu ]
  name: base bullet trigger
  components:
  - type: TriggerOnCollide
    fixtureID: projectile
    maxTriggers: 1
  - type: Projectile
    damage:
      types:
        Blunt: 7 # more damage than a punch.
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by: *flybyfixture

- type: entity
  parent: BaseBullet
  id: BaseBulletIncendiary
  categories: [ HideSpawnMenu ]
  name: base bullet incendiary
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 10
        Heat: 4
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 2.0
    energy: 7.0
  - type: IgniteOnCollide
    fireStacks: 0.25

