# Ported from Monolith (_FarHorizons, AGPL-3.0).
# DarkestHour: vanilla 1x1 machine frame and stock part stacks instead of Mono economy parts.
- type: entity
  id: NuclearFabricatorMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: nuclear fabricator machine board
  description: A machine printed circuit board for a nuclear fabricator.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NuclearFabricator
    stackRequirements:
      Manipulator: 4
      Steel: 5
      Glass: 3

- type: entity
  id: NuclearCentrifugeMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: nuclear fuel reprocessing centrifuge machine board
  description: A machine printed circuit board for a nuclear fuel reprocessing centrifuge.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NuclearCentrifuge
    stackRequirements:
      Manipulator: 4
      Plasteel: 5
