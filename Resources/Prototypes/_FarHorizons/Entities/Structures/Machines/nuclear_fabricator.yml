# Ported from Monolith (_FarHorizons, AGPL-3.0), sprite by Onezero0 for Monolith (CC-BY-SA-3.0).
# DarkestHour: vanilla lathe base, built in a regular machine frame. All reactor parts are static recipes
# until the R&D rework (stage 4).
- type: entity
  id: NuclearFabricator
  parent: BaseLatheLube
  name: nuclear fabricator
  description: A fabricator for making components certified for use in nuclear reactors.
  components:
  - type: Sprite
    sprite: _Mono/Structures/Machines/nfr_assembler.rsi
    snapCardinals: false
    offset: 0.5, 0
    noRot: false
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: rad-paint
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: NuclearFabricatorMachineCircuitboard
  - type: Transform
    anchored: true
    noRot: false
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - ReactorPartsBasic
    - ReactorFuelRods
    - ReactorControlRods
    - ReactorGasChannels
    - ReactorHeatExchangers
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,1.3,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
