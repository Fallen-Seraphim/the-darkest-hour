- type: entity
  parent: BaseAction
  id: ActionSummonGhosts
  name: Summon Ghosts
  description: Makes all current ghosts permanently visible
  components:
  - type: Action
    useDelay: 120
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:ToggleGhostVisibilityToAllEvent

# TODO: Add Whitelist/Blacklist and Component support to EntitySpawnLists (to avoid making huge hardcoded lists like below).

- type: entity
  parent: BaseAction
  id: ActionSummonGuns
  name: Summon Guns
  description: AK47s for everyone! Places a random gun in front of everybody.
  components:
  - type: Magic
  - type: Action
    useDelay: 300
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    layers:
    - state: base
  - type: InstantAction
    event: !type:RandomGlobalSpawnSpellEvent
      makeSurvivorAntagonist: true
      spawns:
      - id: WeaponGrapplingGun
        orGroup: Guns
      - id: BowImprovised
        orGroup: Guns
      - id: WeaponFlareGun
        orGroup: Guns
      - id: WeaponImprovisedPneumaticCannon
        orGroup: Guns
      - id: WeaponWaterPistol
        orGroup: Guns
      - id: WeaponWaterBlaster
        orGroup: Guns
      - id: WeaponWaterBlasterSuper
        orGroup: Guns
  - type: SpeakOnAction
    sentence: action-speech-spell-summon-guns

- type: entity
  parent: BaseAction
  id: ActionSummonMagic
  name: Summon Magic
  description: Places a random magical item in front of everybody. Nothing could go wrong!
  components:
  - type: Magic
  - type: Action
    useDelay: 300
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: magicmissile
  - type: InstantAction
    event: !type:RandomGlobalSpawnSpellEvent
      makeSurvivorAntagonist: true
      spawns:
      - id: SpawnSpellbook
        orGroup: Magics
      - id: ForceWallSpellbook
        orGroup: Magics
      - id: BlinkBook
        orGroup: Magics
      - id: KnockSpellbook
        orGroup: Magics
      - id: FireballSpellbook
        orGroup: Magics
      - id: AnimationStaff
        orGroup: Magics
      - id: RGBStaff
        orGroup: Magics
  - type: SpeakOnAction
    sentence: action-speech-spell-summon-magic
