- type: entity
  abstract: true
  id: RMCTrashBinBase
  parent: BaseStructure
  name: trash bin
  description: A Weston-Yamada trash bin used for disposing your unwanted items, or you can just throw your shit on the ground like every other asshole.
  placement:
    mode: SnapgridCenter
    snap:
    - Disposal
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Piping/disposal.rsi
    layers:
    - state: trash-can
  - type: Physics
    bodyType: Static
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Appearance
  - type: InteractionOutline
  - type: Anchorable
    flags:
    - None
  - type: RequireProjectileTarget

- type: entity
  parent: RMCTrashBinBase
  id: RMCTrashBinGreen
  components:
  - type: Sprite
    layers:
    - state: trashgreen

- type: entity
  parent: RMCTrashBinBase
  id: RMCTrashBinBlue
  components:
  - type: Sprite
    layers:
    - state: trashblue
