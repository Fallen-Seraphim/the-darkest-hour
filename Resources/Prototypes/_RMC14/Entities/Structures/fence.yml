# TODO RMC14 cutting
- type: entity
  parent: BaseFenceMetal
  id: CMFence
  name: fence
  description: A large metal mesh strewn between two poles. Intended as a cheap way to separate areas, while allowing one to see through it.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/fences.rsi
  - type: InteractionOutline
  - type: Clickable
  - type: IconSmooth
    key: fences
    states:
    - !type:DHCardinalFlagsSpriteSmoothing
      mask: [ fences ]
      base: fence
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
        - !type:PlaySoundBehavior
          sound:
            path: /Audio/Items/wirecutter.ogg
        - !type:ChangeConstructionNodeBehavior
          node: rmcFenceBroken
        - !type:DoActsBehavior
          acts: [ "Destruction" ]

- type: entity
  parent: BaseStructure
  id: RMCFenceBroken
  name: broken fence
  description: A mess of broken wire strewn between two poles, it's not blocking anyone's way through.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/fences.rsi
  - type: Clickable
  - type: InteractionOutline
  - type: PlacementReplacement
    key: walls
  - type: IconSmooth
    key: fences
    states:
    - !type:DHCardinalFlagsSpriteSmoothing
      mask: [ fences ]
      base: brokenfence
  - type: Physics
    canCollide: false
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags: []

- type: entity
  parent: CMFence
  id: RMCFenceHybrisa
  components:
  - type: Sprite
    sprite: _RMC14/Structures/hybrisa_fences.rsi

- type: entity
  parent: RMCFenceBroken
  id: RMCFenceHybrisaBroken
  components:
  - type: Sprite
    sprite: _RMC14/Structures/hybrisa_fences.rsi

- type: entity
  parent: CMFence
  id: RMCFenceHybrisaElectric
  suffix: electric
  components:
  - type: Sprite
    sprite: _RMC14/Structures/hybrisa_fences_electric.rsi

- type: entity
  parent: RMCFenceBroken
  id: RMCFenceHybrisaElectricBroken
  suffix: electric
  components:
  - type: Sprite
    sprite: _RMC14/Structures/hybrisa_fences_electric.rsi

- type: entity
  parent: CMFence
  id: RMCFenceOvergrown
  name: overgrown fence
  description: A large metal mesh strewn between two poles, tangled with vines and creeping growth. Still separates areas, but nature is reclaiming it.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/fences_overgrown.rsi

- type: entity
  parent: RMCFenceBroken
  id: RMCFenceOvergrownBroken
  name: broken overgrown fence
  description: A mess of broken wire and creeping weeds strung between two posts, swallowed by years of unchecked growth.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/fences_overgrown.rsi

