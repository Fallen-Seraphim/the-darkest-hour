  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/hybrisa_frame.rsi
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/hybrisa_frame.rsi
    state: strata_frame0
  - type: IconSmooth
    key: windows
    states:
    - !type:DHCardinalFlagsSpriteSmoothing
      mask: [ windows, walls ]
      base: strata_frame

- type: entity
  parent: RMCWindowFrameColonyReinforced
  id: RMCWindowFrameHybrisaReinforced
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Windows/Frames/hybrisa_frame.rsi
  - type: Icon
    sprite: _RMC14/Structures/Windows/Frames/hybrisa_frame.rsi
