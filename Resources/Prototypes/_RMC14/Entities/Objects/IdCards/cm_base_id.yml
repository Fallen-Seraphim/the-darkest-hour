# Ported from RMC-14 (MIT): Resources/Prototypes/_RMC14/Entities/Objects/IdCards/cm_base_id.yml
# DarkestHour: RMC-only components removed (ItemIFF, Corrodible, RMCUnstrippable, RMCCryoUnavailableOnStore);
# only the dogtag pieces are ported, holo-badges are not.

# dogtag base, you should be able to remove one of the tags for the memorial later
- type: entity
  abstract: true
  parent: Clothing
  id: CMIDCardStandardDogtag
  name: dog tags
  description: A pair of stamped metal tags on a chain.
  components:
  - type: Item
    size: Tiny
    heldPrefix: default
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/dogtags.rsi
    layers:
    - state: dogtag
      map: ["enum.DogtagVisuals.Taken"]
  - type: Clothing
    slots:
    - idcard
    sprite: _RMC14/Objects/CMIDs/dogtags.rsi
  - type: Access
  - type: IdCard
    nameLocId: cm-access-dogtags-component-owner-name-job-title-text
    fullNameLocId: cm-access-dogtags-component-owner-full-name-job-title-text
    canMicrowave: false
  - type: StationRecordKeyStorage
  - type: TakeableTags
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: rmc-dogtag-verb-show
    foldVerbText: rmc-dogtag-verb-hide
  - type: FoldableClothing
    foldedEquippedPrefix: hidden
  - type: GenericVisualizer
    visuals:
      enum.DogtagVisuals.Taken:
        enum.DogtagVisuals.Taken:
          True: { state: "dogtag_taken" }
          False: { state: "dogtag" }

- type: entity
  parent: BaseItem
  id: RMCInformationDogtagProp
  name: faded information dog tag
  description: A dead crewmember's information dog tag. It looks battered and the name is worn out.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/infotags.rsi
    state: dogtag_1
  - type: Appearance

