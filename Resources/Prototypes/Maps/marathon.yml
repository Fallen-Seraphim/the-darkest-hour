- type: gameMap
  id: Marathon
  mapName: 'Marathon Station'
  mapPath: /Maps/marathon.yml
  minPlayers: 45
  stations:
    Marathon:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Marathon Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_rod.yml
        - type: StationJobs
          availableJobs:
            # DarkestHour: свои должности, всего 59 слотов
            # Command (8)
            # Corporate Security (12)
            # Medical (10)
            # Supply (8)
            # Science (9)
            # Engineering (11)
            # Station AI (1)
            StationAi: [ 1, 1 ]
