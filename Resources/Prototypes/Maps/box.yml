- type: gameMap
  id: Box
  mapName: 'Box Station'
  mapPath: /Maps/box.yml
  minPlayers: 45
  stations:
    Boxstation:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Box Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_box.yml
        - type: StationJobs
          availableJobs:
            # DarkestHour: свои должности, всего 59 слотов
            # Command (8)
            # Corporate Security (12)
            # Medical (10)
            # Supply (8)
            # Science (9)
            # Engineering (11)
            # Station AI (1)
            StationAi: [ 1, 1 ]
