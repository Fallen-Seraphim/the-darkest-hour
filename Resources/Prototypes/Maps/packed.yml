          !type:NanotrasenNameGenerator
          prefixCreator: 'VG'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Shuttles/emergency_crimson.yml
      - type: StationJobs
        availableJobs:
          # DarkestHour: свои должности, всего 59 слотов
          # Command (8)
          # Corporate Security (12)
          # Medical (10)
          # Supply (8)
          # Science (9)
          # Engineering (11)
          # Station AI (1)
          StationAi: [ 1, 1 ]
