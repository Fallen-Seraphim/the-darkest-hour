- type: gameMap
  id: Bagel
  mapName: 'Bagel Station'
  mapPath: /Maps/bagel.yml
  minPlayers: 45 #removing max players since server already has a max doesnt matter
  stations:
    Bagel:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Bagel Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_lox.yml
        - type: StationJobs
          availableJobs:
            # DarkestHour: свои должности, всего 59 слотов
            # Command (8)
            # Corporate Security (12)
            # Medical (10)
            # Supply (8)
            # Science (9)
            # Engineering (11)
            # Station AI (1)
            StationAi: [ 1, 1 ]
