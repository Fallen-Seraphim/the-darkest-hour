- type: gameMap
  id: Snowball
  mapName: 'Snowball Station'
  mapPath: /Maps/snowball.yml
  minPlayers: 5
  maxPlayers: 25
  stations:
    Snowball:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Snowball Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_rod.yml
        - type: StationJobs
          availableJobs:
            # DarkestHour: свои должности, всего 59 слотов
            # Command (8)
            # Corporate Security (12)
            # Medical (10)
            # Supply (8)
            # Science (9)
            # Engineering (11)
            # Station AI (1)
            StationAi: [ 1, 1 ]
