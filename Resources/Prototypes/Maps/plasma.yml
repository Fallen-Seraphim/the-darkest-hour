- type: gameMap
  id: Plasma
  mapName: 'Plasma'
  mapPath: /Maps/plasma.yml
  minPlayers: 30
  maxPlayers: 65
  stations:
    Plasma:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Plasma {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_plasma.yml
        - type: StationCargoShuttle
          path: /Maps/Shuttles/cargo_plasma.yml
        - type: StationJobs
          availableJobs:
            # DarkestHour: свои должности, всего 59 слотов
            # Command (8)
            # Corporate Security (12)
            # Medical (10)
            # Supply (8)
            # Science (9)
            # Engineering (11)
            # Station AI (1)
            StationAi: [ 1, 1 ]
